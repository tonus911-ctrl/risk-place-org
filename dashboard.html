us a light engine inside your perimeter."], ["History and trends out of the box", "Every rebuild stores a snapshot: you see dynamics, not just a snapshot of today."], ["It stays alive after the project", "Scheduled updates and traffic lights keep the continuity system from quietly dying."]], "s10t": "FAQ", "s10": [["Will the data leave the company?", "No. The engine and the data live entirely inside your perimeter — on your computer, server or private cloud. Not a single number goes outside. A key requirement for UAE government and financial clients."], ["We have no data for a dashboard. Where do we start?", "With the Excel workbook: the methodology inside tells you what to collect. If there is no baseline data at all, we will gather it together in a gap assessment."], ["Who will update the data?", "Your coordinator — 1-2 hours a month following the guidance. Or subscribe to the monthly service and we will handle it."], ["How long until the first dashboard?", "Usually 2 weeks from the start: setup, form filling, first build and a results review."], ["Is this a certified monitoring system?", "No. It is a management tool and a methodology — honestly, with no inflated promises."]], "ctaT": "We will show the dashboard on your industry's example", "ctaS": "An online demo, no strings attached: we walk through a live dashboard, map the metrics to your business and honestly tell you whether it will fly. We meet on Zoom and take as much time as the conversation needs."},"ar":{"tagline": "استمرارية الأعمال والمرونة · دول الخليج", "back": "→ كل الخدمات", "copy": "© ٢٠٢٦ risk-place.org · استمرارية الأعمال والمرونة", "privacy": "سياسة الخصوصية", "kicker": "الخطوة ٣ · المنتج الرائد · داخل بنيتكم", "h1": "هل سيصمد عملكم أمام اضطراب الغد؟", "sub": "الآن يمكن رؤية ذلك على شاشة واحدة. لوحة الاستمرارية تعرض مؤشر المرونة والعمليات الحرجة ونقاط الفشل وتكلفة يوم التوقف — للرئيس التنفيذي والمجلس والتدقيق. البيانات لا تغادر شركتكم.", "price": "اللوحة القياسية — ٢٩٠٠$", "prn": "الإعداد المتقدم — حسب الطلب · الخدمة الشهرية من ٣٠٠$", "ctaDemo": "افتحوا العرض الحي ←", "ctaMeet": "اطلبوا عرضاً", "s1t": "هل يبدو هذا مألوفاً؟", "s1": [["«هل نحن مستعدون لاضطراب كبير؟»", "المجلس يسأل — ولا جواب: مجلد خطط بلا أرقام."], ["انتهى مشروع الاستمرارية — وماتت المنظومة", "بعد ربع سنة الخطط قديمة والتمارين متوقفة ولم يلحظ أحد."], ["تعرفون المشكلات من الحوادث", "تدهور الحماية لا يظهر إلا حين ينكسر شيء ويكلف مالاً."]], "s2t": "تكلفة ألا ترى", "s2": [["+١٨ ألف $ يومياً", "تكلفة نموذجية ليوم توقف واحد حتى لشركة متوسطة — ومعظم الشركات لم تحسب رقمها."], ["٤٠٪ لا تعود للعمل", "نسبة الشركات الصغيرة التي لا تستأنف نشاطها بعد اضطراب كبير (FEMA)."], ["٢٦ ساعة بدل ٤", "زمن التعافي الفعلي كثيراً ما يفوق الهدف أضعافاً — ويُكتشف أثناء العطل."]], "s2n": "العمى لا يُعالج بتقرير سميك آخر. تحتاجون جهاز قياس يعرض الحالة باستمرار.", "s3t": "هكذا تبدو", "s3n": "انقروا لفتح مثال حي ببيانات شركة ABC الافتراضية.", "mockTitle": "لوحة استمرارية الأعمال · شركة ABC", "mockUpd": "حُدّثت اليوم", "kpi": [["68 <small>/100</small>", "مؤشر المرونة · الاتجاه +٤"], ["٢٦ س", "زمن التعافي · الهدف ٤ س"], ["٣ / ٨", "عمليات في خطر"], ["٥", "نقاط فشل أحادية"], ["١٨ ألف $", "تكلفة يوم توقف"]], "s4t": "ما الذي سترونه على اللوحة", "s4": [["ما مدى حمايتنا", "مؤشر المرونة ٠-١٠٠ واتجاهه: رقم واحد لحوار المجلس."], ["ما الذي يسقط أولاً", "العمليات الحرجة بإشارات ضوئية: الجاهزية وأهداف التعافي والمسؤولون."], ["أين الخيوط الرفيعة", "نقاط الفشل الأحادية: شخص واحد، مورد واحد، خادم واحد، خدمة ذكاء اصطناعي واحدة."], ["كم تكلف ساعة التوقف", "التعرض المالي: تكلفة التوقف ووسادة التعافي."], ["هل الخطط حية", "تغطية BCP/DRP وتواريخ المراجعة ومتى جرت التمارين وما كشفته."], ["ما الذي تغير", "اتجاهات ربع سنوية: أين تحسنت الأمور وأين بدأ التدهور."]], "s5t": "لمن هذه اللوحة ومتى", "s5": [["الرئيس التنفيذي", "رؤية مرونة الأعمال كما ترون الإيرادات — دون قراءة الخطط."], ["مجلس الإدارة", "شاشة واحدة بدل تقرير ربع سنوي يقول «كل شيء على ما يرام»."], ["مدير المخاطر ومالك الاستمرارية", "صورة موحدة بدل عشرات الجداول؛ وحجج للميزانية."], ["التدقي , "s9": [["المنهجية بالداخل", "فريق BI يقضي شهوراً يقرر ماذا يقيس. هنا مقاييس الاستمرارية مختارة ومعرفة ومترابطة — املأوا من اليوم الأول."], ["لا حاجة لمشروع تقني", "البداية بلا تكاملات ولا خوادم ولا مشتريات: Excel ومحرك خفيف داخل نطاقكم."], ["التاريخ والاتجاهات جاهزة", "كل إعادة بناء تخزن لقطة: ترون الديناميكا لا لقطة اليوم فقط."], ["تبقى حية بعد المشروع", "التحديث المجدول والإشارات الضوئية يمنعان موت منظومة الاستمرارية بصمت."]], "s10t": "أسئلة شائعة", "s10": [["هل تغادر البيانات الشركة؟", "لا. المحرك والبيانات داخل نطاقكم بالكامل. لا يخرج رقم واحد — متطلب أساسي للجهات الحكومية والمالية في الإمارات."], ["لا نملك بيانات للوحة، من أين نبدأ؟", "من مصنف Excel: المنهجية بداخله تدلكم على ما يُجمع. وإن غابت البيانات الأساسية كلياً نجمعها معاً في تقييم الفجوات."], ["من سيحدّث البيانات؟", "منسقكم — ساعة إلى ساعتين شهرياً وفق الإرشادات. أو اشتركوا بالخدمة الشهرية ونتولى الأمر."], ["كم يلزم حتى أول لوحة؟", "عادة أسبوعان من البدء: إعداد وملء النموذج وأول بناء وجلسة مراجعة."], ["هل هي منظومة مراقبة معتمدة؟", "لا. إنها أداة إدارية ومنهجية — بصدق ودون وعود منفوخة."]], "ctaT": "سنعرض اللوحة على مثال من قطاعكم", "ctaS": "عرض عبر الإنترنت دون أي التزام: نمر على لوحة حية ونطبق المقاييس على أعمالكم ونقول بصدق إن كانت ستنجح لديكم. نلتقي عبر Zoom ونأخذ من الوقت ما يحتاجه الحوار."}};
var lang="en";
function fill(id,items,cls){var g=document.getElementById(id);g.innerHTML="";items.forEach(function(x){var v=document.createElement("div");v.className=cls||"it";v.innerHTML="<b>"+x[0]+"</b><p>"+x[1]+"</p>";g.appendChild(v);});}
function setLang(l){
  lang=l;document.documentElement.lang=l;document.documentElement.dir=(l==="ar")?"rtl":"ltr";
  var d=C[l];
  document.querySelectorAll("[data-ui]").forEach(function(el){var k=el.getAttribute("data-ui");if(typeof d[k]==="string")el.innerHTML=d[k];});
  ["s1","s2","s4","s5","s7","s9","s10"].forEach(function(s){fill(s,d[s]);});

  fill("s8",d.s8);
  var kp=document.getElementById("kpi");kp.innerHTML="";
  d.kpi.forEach(function(x){var v=document.createElement("div");v.className="k";v.innerHTML='<div class="v">'+x[0]+'</div><div class="l">'+x[1]+'</div>';kp.appendChild(v);});
  document.getElementById("langbtn").textContent=(l==="ar")?"EN":"AR";
  try{localStorage.setItem("rp_org_lang",l);}catch(e){}
}
function toggleLang(){setLang(lang==="ar"?"en":"ar");}
(function(){var s=null;try{s=localStorage.getItem("rp_org_lang");}catch(e){}setLang(s==="ar"?"ar":"en");})();
