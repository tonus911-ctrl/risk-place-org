<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1056" width="1060" height="1056" direction="rtl" role="img" aria-label="خمس مراحل من التدريب على المعيار 7000 إلى كفاءة مثبتة، الأساس في المعيار ثم التطبيق على عملياتك ثم مخرجات العمل ثم التقييم ثم الكفاءة المثبتة">
<rect x="0" y="0" width="1060" height="1056" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">من التدريب إلى كفاءة مثبتة</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">خمس مراحل، وما تتركه كل مرحلة من أثر موثق</text>

<!-- المرحلة 1 -->
<rect x="8" y="112" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="166" r="25" fill="#C4571C"/>
<text x="1000" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="586" y="156" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الأساس في المعيار</text>
<text x="586" y="190" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">البنود والمصطلحات والفرق بين الإرشاد وبين الإلزام</text>
<text x="116" y="190" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">من 3 إلى 4 ساعات</text>
<polygon points="993,226 1007,226 1000,238" fill="#C4571C"/>

<!-- المرحلة 2 -->
<rect x="8" y="246" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="300" r="25" fill="#C4571C"/>
<text x="1000" y="308" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="586" y="290" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التطبيق على عملياتك أنت</text>
<text x="586" y="324" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تحليل أثر لأنشطتك أنت واعتماديات وموردين وكلفة يوم توقف</text>
<text x="116" y="324" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">من 8 إلى 10 ساعات</text>
<polygon points="993,360 1007,360 1000,372" fill="#C4571C"/>

<!-- المرحلة 3 -->
<rect x="8" y="380" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="434" r="25" fill="#C4571C"/>
<text x="1000" y="442" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="586" y="424" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مخرجات عمل حقيقية</text>
<text x="586" y="458" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أهداف تعاف بالمال وهيكل خطة بأسماء وسيناريو تمرين</text>
<text x="116" y="458" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">من 20 إلى 30 ساعة</text>
<polygon points="993,494 1007,494 1000,506" fill="#C4571C"/>

<!-- المرحلة 4 -->
<rect x="8" y="514" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="568" r="25" fill="#C4571C"/>
<text x="1000" y="576" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="586" y="558" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">تقييم بعتبة نجاح</text>
<text x="586" y="592" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">اختبار يمكن الرسوب فيه ومناقشة عمل من إعدادك لا تسليم ملف فقط</text>
<text x="116" y="592" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ساعتان إلى ثلاث</text>
<polygon points="993,628 1007,628 1000,640" fill="#C4571C"/>

<!-- المرحلة 5 -->
<rect x="8" y="648" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1000" cy="702" r="25" fill="#C4571C"/>
<text x="1000" y="710" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="586" y="692" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">كفاءة مثبتة وموثقة</text>
<text x="586" y="726" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">شخص مسمى وتاريخ وسجل يتحقق منه طرف ثالث</text>
<text x="116" y="726" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">تحديث سنوي</text>

<!-- لوحة الأثر الموثق -->
<rect x="8" y="782" width="1044" height="214" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1046" y="796" width="5" height="186" rx="2.5" fill="#C4571C"/>
<text x="530" y="818" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">ما يبقى في الملف بعد انتهاء المسار</text>

<text x="918" y="866" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">للمدقق</text>
<text x="430" y="866" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سجلات كفاءة بأسماء وتواريخ ومنهج تدريب ونتيجة تقييم</text>

<text x="918" y="914" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">للمؤسسة</text>
<text x="430" y="914" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تحليل أثر وأهداف تعاف وخطة وتقرير تمرين قيد الاستخدام</text>

<text x="918" y="962" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">للشخص</text>
<text x="430" y="962" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">شهادة يستطيع طرف ثالث التحقق من صحتها</text>

<text x="530" y="1030" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">توعية ساعة ونصف للفرد · ممارس من 16 إلى 24 ساعة اتصال · من 6 إلى 10 أسابيع لكل ممارس</text>
</svg>
