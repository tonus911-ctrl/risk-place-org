<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1400" width="1060" height="1400" role="img" aria-label="Three routes to a continuity qualification compared: BCI, DRI International and ERGP one after another, with the reader situations each route fits">
<rect x="0" y="0" width="1060" height="1400" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Three routes to a continuity qualification</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Different products rather than competing versions of one. Match the route to the situation.</text>
<rect x="8" y="112" width="1044" height="384" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="146" font-family="Consolas, monospace" font-size="15" fill="#C4571C">PROFESSIONAL INSTITUTE</text>
<text x="32" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">BCI</text>
<text x="32" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Business Continuity Institute</text>
<line x1="32" y1="238" x2="1028" y2="238" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="268" font-family="Consolas, monospace" font-size="15" fill="#A34D19">HOW IT IS EARNED</text>
<text x="290" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Examination on a published body of knowledge, then grades on verified years</text>
<text x="32" y="300" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT GIVES YOU</text>
<text x="290" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A portable credential, membership grades and a professional community</text>
<text x="32" y="332" font-family="Consolas, monospace" font-size="15" fill="#A34D19">LANGUAGE</text>
<text x="290" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Mainly English</text>
<line x1="32" y1="354" x2="1028" y2="354" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="384" font-family="Consolas, monospace" font-size="15" fill="#C4571C">FITS YOU WHEN</text>
<text x="32" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">an advert or a promotion policy names the institute</text>
<text x="32" y="444" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">you want a ladder of grades that grows with verified experience</text>
<text x="32" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">you expect to work outside the Gulf region</text>
<rect x="8" y="516" width="1044" height="384" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="550" font-family="Consolas, monospace" font-size="15" fill="#C4571C">CERTIFYING BODY</text>
<text x="32" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">DRI International</text>
<text x="32" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Certification in continuity practice</text>
<line x1="32" y1="642" x2="1028" y2="642" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="672" font-family="Consolas, monospace" font-size="15" fill="#A34D19">HOW IT IS EARNED</text>
<text x="290" y="672" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Examination on professional practices, then an experience file the body reviews</text>
<text x="32" y="704" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT GIVES YOU</text>
<text x="290" y="704" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A portable credential, rising grades and a certified community</text>
<text x="32" y="736" font-family="Consolas, monospace" font-size="15" fill="#A34D19">LANGUAGE</text>
<text x="290" y="736" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Mainly English</text>
<line x1="32" y1="758" x2="1028" y2="758" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="788" font-family="Consolas, monospace" font-size="15" fill="#C4571C">FITS YOU WHEN</text>
<text x="32" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">recruiters in your market screen for its letters</text>
<text x="32" y="848" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">you want an exam plus an experience file a body reviews</text>
<text x="32" y="876" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">your employer already sponsors that route</text>
<rect x="8" y="920" width="1044" height="384" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="32" y="954" font-family="Consolas, monospace" font-size="15" fill="#C4571C">APPLIED PROGRAMME</text>
<text x="32" y="994" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">ERGP</text>
<text x="32" y="1024" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Enterprise resilience governance</text>
<line x1="32" y1="1046" x2="1028" y2="1046" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="1076" font-family="Consolas, monospace" font-size="15" fill="#A34D19">HOW IT IS EARNED</text>
<text x="290" y="1076" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Six modules with six artefacts, then a capstone report reviewed with an expert</text>
<text x="32" y="1108" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT GIVES YOU</text>
<text x="290" y="1108" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Six documents on your own scope and a certificate in a public register</text>
<text x="32" y="1140" font-family="Consolas, monospace" font-size="15" fill="#A34D19">LANGUAGE</text>
<text x="290" y="1140" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Arabic and English</text>
<line x1="32" y1="1162" x2="1028" y2="1162" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="1192" font-family="Consolas, monospace" font-size="15" fill="#C4571C">FITS YOU WHEN</text>
<text x="32" y="1224" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">your board papers and regulator correspondence are in Arabic</text>
<text x="32" y="1252" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">your next assessment is read against NCEMA 7000 and ISO 22301</text>
<text x="32" y="1280" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">you must produce the documents for your own organisation</text>
<text x="530" y="1360" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">None of the three is better than the other two. The right one is the one your situation asks for.</text>
</svg>
