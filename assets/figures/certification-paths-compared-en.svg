<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Three routes to a continuity qualification compared: BCI, DRI International and ERGP side by side, with the reader situations each route fits">
<rect x="0" y="0" width="1200" height="740" fill="#FDFBF7"/>

<text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">Three routes to a continuity qualification</text>
<text x="600" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Different products rather than competing versions of one. Match the route to the situation.</text>

<!-- route 1: BCI -->
<rect x="40" y="108" width="360" height="300" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.2" fill="#C4571C">PROFESSIONAL INSTITUTE</text>
<text x="220" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16181F">BCI</text>
<text x="220" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Business Continuity Institute</text>
<line x1="64" y1="214" x2="376" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">HOW IT IS EARNED</text>
<text x="220" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Examination on a published body of</text>
<text x="220" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">knowledge, then grades on verified years</text>
<text x="220" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">WHAT IT GIVES YOU</text>
<text x="220" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">A portable credential, membership</text>
<text x="220" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">grades and a professional community</text>
<text x="220" y="366" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">LANGUAGE</text>
<text x="220" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Mainly English</text>

<!-- route 2: DRI International -->
<rect x="420" y="108" width="360" height="300" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.2" fill="#C4571C">CERTIFYING BODY</text>
<text x="600" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16181F">DRI International</text>
<text x="600" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Certification in continuity practice</text>
<line x1="444" y1="214" x2="756" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">HOW IT IS EARNED</text>
<text x="600" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Examination on professional practices,</text>
<text x="600" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">then an experience file the body reviews</text>
<text x="600" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">WHAT IT GIVES YOU</text>
<text x="600" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">A portable credential, rising grades</text>
<text x="600" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">and a certified community</text>
<text x="600" y="366" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">LANGUAGE</text>
<text x="600" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Mainly English</text>

<!-- route 3: ERGP -->
<rect x="800" y="108" width="360" height="300" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.2" fill="#C4571C">APPLIED PROGRAMME</text>
<text x="980" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16181F">ERGP</text>
<text x="980" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Enterprise resilience governance</text>
<line x1="824" y1="214" x2="1136" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">HOW IT IS EARNED</text>
<text x="980" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Six modules with six artefacts, then a</text>
<text x="980" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">capstone report reviewed with an expert</text>
<text x="980" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">WHAT IT GIVES YOU</text>
<text x="980" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Six documents on your own scope</text>
<text x="980" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">and a certificate in a public register</text>
<text x="980" y="366" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8A8578">LANGUAGE</text>
<text x="980" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Arabic and English</text>

<!-- arrows down to the situation band -->
<line x1="220" y1="418" x2="220" y2="440" stroke="#C4571C" stroke-width="2"/><polygon points="214,439 220,450 226,439" fill="#C4571C"/>
<line x1="600" y1="418" x2="600" y2="440" stroke="#C4571C" stroke-width="2"/><polygon points="594,439 600,450 606,439" fill="#C4571C"/>
<line x1="980" y1="418" x2="980" y2="440" stroke="#C4571C" stroke-width="2"/><polygon points="974,439 980,450 986,439" fill="#C4571C"/>

<!-- situations: BCI -->
<rect x="40" y="456" width="360" height="210" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="486" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.2" fill="#C4571C">FITS YOU WHEN</text>
<text x="220" y="514" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">an advert or a promotion policy</text>
<text x="220" y="532" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">names the institute</text>
<line x1="100" y1="548" x2="340" y2="548" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="572" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">you want a ladder of grades that</text>
<text x="220" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">grows with verified experience</text>
<line x1="100" y1="606" x2="340" y2="606" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="630" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">you expect to work outside</text>
<text x="220" y="648" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">the Gulf region</text>

<!-- situations: DRI -->
<rect x="420" y="456" width="360" height="210" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="486" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.2" fill="#C4571C">FITS YOU WHEN</text>
<text x="600" y="514" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">recruiters in your market screen</text>
<text x="600" y="532" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">for its letters</text>
<line x1="480" y1="548" x2="720" y2="548" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="572" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">you want an exam plus an</text>
<text x="600" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">experience file a body reviews</text>
<line x1="480" y1="606" x2="720" y2="606" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="630" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">your employer already</text>
<text x="600" y="648" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">sponsors that route</text>

<!-- situations: ERGP -->
<rect x="800" y="456" width="360" height="210" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="486" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" letter-spacing="1.2" fill="#C4571C">FITS YOU WHEN</text>
<text x="980" y="514" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">your board papers and regulator</text>
<text x="980" y="532" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">correspondence are in Arabic</text>
<line x1="860" y1="548" x2="1100" y2="548" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="572" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">your next assessment is read</text>
<text x="980" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">against NCEMA 7000 and ISO 22301</text>
<line x1="860" y1="606" x2="1100" y2="606" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="630" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">you must produce the documents</text>
<text x="980" y="648" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">for your own organisation</text>

<text x="600" y="706" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#8A8578">None of the three is better than the other two. The right one is the one your situation asks for.</text>
</svg>
