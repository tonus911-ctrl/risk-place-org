<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" direction="rtl" role="img" aria-label="مراجعة ذاتية مقابل المادة 7 من كتاب قواعد المصرف المركزي موزعة على أربعة مجالات وثمانية عشر سؤالا، مع الإجابات الثلاث المسموحة وثلاث نطاقات لقراءة النتيجة">
<rect x="0" y="0" width="1200" height="710" fill="#FDFBF7"/>

<text x="600" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">أربعة مجالات وثمانية عشر سؤالا وإجابة واحدة تحتسب</text>
<text x="600" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">مراجعة ذاتية مقابل المادة 7 من كتاب قواعد المصرف المركزي، ولا يحتسب إلا الدليل المؤرخ</text>

<!-- مقياس الإجابة -->
<rect x="40" y="104" width="1120" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1154" y="116" width="5" height="72" rx="2.5" fill="#C4571C"/>
<text x="600" y="130" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#C4571C">الإجابات الثلاث الوحيدة</text>

<rect x="800" y="146" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="950" y="174" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14.5" fill="#5B564A">لا، لا شيء قائم</text>

<line x1="794" y1="168" x2="772" y2="168" stroke="#C4571C" stroke-width="2"/><polygon points="773,161 756,168 773,175" fill="#C4571C"/>

<rect x="450" y="146" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="174" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14.5" fill="#5B564A">على الورق فقط، بلا اختبار</text>

<line x1="444" y1="168" x2="422" y2="168" stroke="#C4571C" stroke-width="2"/><polygon points="423,161 406,168 423,175" fill="#C4571C"/>

<rect x="100" y="146" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="250" y="174" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14.5" fill="#16181F">نعم، مع دليل مؤرخ</text>

<!-- المجال 1 -->
<rect x="895" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1027" cy="266" r="18" fill="#C4571C"/>
<text x="1027" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">4</text>
<text x="1027" y="316" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">السياسة</text>
<text x="1027" y="338" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">والحوكمة</text>
<line x1="911" y1="358" x2="1144" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1027" y="384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">سياسة موقعة وسارية</text>
<text x="1027" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">مالك تنفيذي مسمى</text>
<text x="1027" y="428" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">اطلاع سنوي للمجلس</text>

<!-- المجال 2 -->
<rect x="610" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="742" cy="266" r="18" fill="#C4571C"/>
<text x="742" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">4</text>
<text x="742" y="316" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">تحليل الأثر</text>
<text x="742" y="338" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">وتقييم المخاطر</text>
<line x1="626" y1="358" x2="859" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="742" y="384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">وظائف حيوية بأسمائها</text>
<text x="742" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">أثر يقاس عبر الزمن</text>
<text x="742" y="428" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">اعتماديات ونقاط فشل منفردة</text>

<!-- المجال 3 -->
<rect x="325" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="457" cy="266" r="18" fill="#C4571C"/>
<text x="457" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">4</text>
<text x="457" y="316" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">الخطط والتعافي</text>
<text x="457" y="338" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">من الكوارث</text>
<line x1="341" y1="358" x2="574" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="457" y="384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">خطة من طرف إلى طرف</text>
<text x="457" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">صلاحيات الساعات الأولى</text>
<text x="457" y="428" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تعاف مجرب لا مفترض</text>

<!-- المجال 4 -->
<rect x="40" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="172" cy="266" r="18" fill="#C4571C"/>
<text x="172" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">6</text>
<text x="172" y="316" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">الاختبار</text>
<text x="172" y="338" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">والأدلة</text>
<line x1="56" y1="358" x2="289" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="172" y="384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">اختبار خلال 12 شهرا</text>
<text x="172" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ملاحظات مغلقة بتواريخ</text>
<text x="172" y="428" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الإسناد الخارجي مغطى</text>

<!-- المجموع -->
<line x1="600" y1="474" x2="600" y2="496" stroke="#C4571C" stroke-width="2"/><polygon points="593,495 600,511 607,495" fill="#C4571C"/>
<text x="480" y="500" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">المجموع 18 سؤالا</text>

<!-- نطاقات النتيجة -->
<rect x="794" y="530" width="366" height="116" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="977" y="576" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="30" fill="#C4571C">18</text>
<text x="977" y="604" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">نعم مع دليل مؤرخ</text>
<text x="977" y="628" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">جاهزون للفحص</text>

<rect x="417" y="530" width="366" height="116" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="576" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="30" fill="#16181F">13 إلى 17</text>
<text x="600" y="604" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">ربع سنة مركز يغلقها</text>
<text x="600" y="628" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ابدؤوا بما يظهر في أول ساعة</text>

<rect x="40" y="530" width="366" height="116" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="223" y="576" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="30" fill="#16181F">أقل من 13</text>
<text x="223" y="604" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">أمام برنامج لا تصحيحات</text>
<text x="223" y="628" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">والبدء مبكرا أريح من الطابور</text>

<text x="600" y="686" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">المصدر، كتاب قواعد المصرف المركزي، نظام ومعايير المخاطر التشغيلية، المادة 7 · والأسئلة موزعة على أربعة مجالات</text>
</svg>
