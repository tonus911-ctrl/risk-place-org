<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1216" width="1060" height="1216" direction="rtl" role="img" aria-label="مراجعة ذاتية مقابل المادة 7 من كتاب قواعد المصرف المركزي موزعة على أربعة مجالات وثمانية عشر سؤالا، مع الإجابات الثلاث المسموحة وثلاث نطاقات لقراءة النتيجة">
<rect x="0" y="0" width="1060" height="1216" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">أربعة مجالات وثمانية عشر سؤالا وإجابة واحدة تحتسب</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">مراجعة ذاتية مقابل المادة 7 من كتاب قواعد المصرف المركزي، ولا يحتسب إلا الدليل المؤرخ</text>

<!-- مقياس الإجابة -->
<rect x="8" y="112" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1046" y="126" width="5" height="84" rx="2.5" fill="#C4571C"/>
<text x="530" y="142" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الإجابات الثلاث الوحيدة</text>

<rect x="712" y="156" width="308" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="866" y="191" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">لا، لا شيء قائم</text>
<line x1="708" y1="184" x2="698" y2="184" stroke="#C4571C" stroke-width="2.5"/><polygon points="699,177 688,184 699,191" fill="#C4571C"/>

<rect x="372" y="156" width="308" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="526" y="191" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">على الورق فقط، بلا اختبار</text>
<line x1="368" y1="184" x2="358" y2="184" stroke="#C4571C" stroke-width="2.5"/><polygon points="359,177 348,184 359,191" fill="#C4571C"/>

<rect x="32" y="156" width="308" height="56" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="186" y="191" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">نعم، مع دليل مؤرخ</text>

<!-- المجال 1 -->
<rect x="8" y="248" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="302" r="25" fill="#C4571C"/>
<text x="1000" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="492" y="292" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">السياسة والحوكمة</text>
<text x="492" y="326" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سياسة موقعة وسارية · مالك تنفيذي مسمى · اطلاع سنوي للمجلس</text>
<polygon points="993,360 1007,360 1000,370" fill="#C4571C"/>

<!-- المجال 2 -->
<rect x="8" y="372" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="426" r="25" fill="#C4571C"/>
<text x="1000" y="434" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="492" y="416" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">تحليل الأثر وتقييم المخاطر</text>
<text x="492" y="450" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">وظائف حيوية بأسمائها · أثر يقاس عبر الزمن · اعتماديات ونقاط فشل منفردة</text>
<polygon points="993,484 1007,484 1000,494" fill="#C4571C"/>

<!-- المجال 3 -->
<rect x="8" y="496" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="550" r="25" fill="#C4571C"/>
<text x="1000" y="558" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="492" y="540" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الخطط والتعافي من الكوارث</text>
<text x="492" y="574" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">خطة من طرف إلى طرف · صلاحيات الساعات الأولى · تعاف مجرب لا مفترض</text>
<polygon points="993,608 1007,608 1000,618" fill="#C4571C"/>

<!-- المجال 4 -->
<rect x="8" y="620" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1000" cy="674" r="25" fill="#C4571C"/>
<text x="1000" y="682" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="492" y="664" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الاختبار والأدلة</text>
<text x="492" y="698" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">اختبار خلال 12 شهرا · ملاحظات مغلقة بتواريخ · الإسناد الخارجي مغطى</text>

<!-- المجموع -->
<line x1="530" y1="748" x2="530" y2="772" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,770 530,784 537,770" fill="#C4571C"/>
<text x="530" y="812" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المجموع 18 سؤالا</text>

<!-- النطاق 1 -->
<rect x="8" y="836" width="1044" height="104" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="950" y="898" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="30" fill="#C4571C">18</text>
<text x="460" y="880" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">نعم مع دليل مؤرخ</text>
<text x="460" y="910" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">جاهزون للفحص</text>

<!-- النطاق 2 -->
<rect x="8" y="952" width="1044" height="104" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="950" y="1014" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="30" fill="#16181F">من 13 إلى 17</text>
<text x="460" y="996" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">ربع سنة مركز يغلقها</text>
<text x="460" y="1026" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ابدؤوا بما يظهر في أول ساعة</text>

<!-- النطاق 3 -->
<rect x="8" y="1068" width="1044" height="104" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="950" y="1130" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="30" fill="#16181F">أقل من 13</text>
<text x="460" y="1112" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">أمام برنامج لا تصحيحات</text>
<text x="460" y="1142" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">والبدء مبكرا أريح من الطابور</text>

<text x="530" y="1196" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصدر، كتاب قواعد المصرف المركزي، نظام ومعايير المخاطر التشغيلية، المادة 7 · والأسئلة موزعة على أربعة مجالات</text>
</svg>
