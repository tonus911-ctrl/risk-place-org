<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1766" width="1060" height="1766" role="img" aria-label="The first day of a ransomware event laid out by hour, with the five decisions that need a named owner">
<rect x="0" y="0" width="1060" height="1766" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">The first day, in the order the decisions arrive</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Isolation, declaration, degraded operation, communication and evidence —</text>
<text x="530" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">each one owned before the day, not during it</text>
<rect x="8" y="138" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="32" y="156" width="188" height="32" rx="16" fill="#C4571C"/>
<text x="126" y="179" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">HOUR 1</text>
<text x="244" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Confirm and classify</text>
<line x1="32" y1="202" x2="1028" y2="202" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">One duty contact takes the call</text>
<text x="32" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The decision log is opened</text>
<text x="32" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">No mass mail and no rumours</text>
<text x="32" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The generic first hour is a separate protocol</text>
<line x1="530" y1="344" x2="530" y2="358" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,356 530,370 537,356" fill="#C4571C"/>
<rect x="8" y="378" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="32" y="396" width="188" height="32" rx="16" fill="#C4571C"/>
<text x="126" y="419" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">HOURS 1 TO 4</text>
<text x="244" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Isolate and declare</text>
<line x1="32" y1="442" x2="1028" y2="442" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Networks and sites cut on written authority</text>
<text x="32" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The continuity plan is invoked at its written threshold</text>
<text x="32" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Restoration frozen until the evidence is taken</text>
<line x1="530" y1="584" x2="530" y2="598" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,596 530,610 537,596" fill="#C4571C"/>
<rect x="8" y="618" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="32" y="636" width="188" height="32" rx="16" fill="#C4571C"/>
<text x="126" y="659" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">HOURS 4 TO 12</text>
<text x="244" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Run degraded and speak</text>
<line x1="32" y1="682" x2="1028" y2="682" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="712" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Priority activities move to their manual mode</text>
<text x="32" y="738" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A holding statement to staff and to clients</text>
<text x="32" y="764" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Insurer and counsel are already on the line</text>
<line x1="530" y1="824" x2="530" y2="838" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,836 530,850 537,836" fill="#C4571C"/>
<rect x="8" y="858" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<rect x="32" y="876" width="188" height="32" rx="16" fill="#C4571C"/>
<text x="126" y="899" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">HOURS 12 TO 24</text>
<text x="244" y="900" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Notify and rebuild</text>
<line x1="32" y1="922" x2="1028" y2="922" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="952" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The notification path walked with counsel, from detection</text>
<text x="32" y="978" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Recovery only from a copy proven by a restore test</text>
<text x="32" y="1004" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Any contact with attackers left to specialists</text>
<text x="530" y="1120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Five decisions that need a name, not a meeting</text>
<rect x="8" y="1146" width="1044" height="76" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="52" cy="1184" r="25" fill="#C4571C"/>
<text x="52" y="1192" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="100" y="1192" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Isolate</text>
<text x="1028" y="1192" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">Written authority, 24/7 reach</text>
<rect x="8" y="1234" width="1044" height="76" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="1272" r="25" fill="#C4571C"/>
<text x="52" y="1280" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="100" y="1280" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Declare</text>
<text x="1028" y="1280" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">A threshold, not a debate</text>
<rect x="8" y="1322" width="1044" height="76" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="1360" r="25" fill="#C4571C"/>
<text x="52" y="1368" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="100" y="1368" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Operate degraded</text>
<text x="1028" y="1368" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">From the manual-mode plans</text>
<rect x="8" y="1410" width="1044" height="76" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="1448" r="25" fill="#C4571C"/>
<text x="52" y="1456" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="100" y="1456" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Communicate</text>
<text x="1028" y="1456" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">One voice, statements ready</text>
<rect x="8" y="1498" width="1044" height="76" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="52" cy="1536" r="25" fill="#C4571C"/>
<text x="52" y="1544" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="100" y="1544" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Preserve evidence</text>
<text x="1028" y="1544" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">Before restoring anything</text>
<rect x="8" y="1602" width="1044" height="80" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="1650" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">The one-page card — five decisions, owners, deputies, thresholds, numbers — laminated, offline, at three locations</text>
<text x="530" y="1726" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">The clock starts at detection, not at your first meeting · risk-place.org</text>
</svg>
