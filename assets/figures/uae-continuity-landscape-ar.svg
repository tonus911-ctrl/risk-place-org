<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1152" width="1060" height="1152" direction="rtl" role="img" aria-label="ثلاث طبقات من متطلبات استمرارية الأعمال في الإمارات ومن يخضع لكل طبقة، وضغط العقود والتأمين على من لا يخضع لأي منها، ونقطة بداية واحدة">
<rect x="0" y="0" width="1060" height="1152" fill="#FDFBF7"/>

<text x="530" y="44" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">ثلاث طبقات من المتطلبات، ونقطة بداية واحدة</text>
<text x="530" y="78" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">استمرارية الأعمال في الإمارات، من يخضع لماذا</text>

<!-- الطبقة الأولى -->
<rect x="8" y="104" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="138" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إلزامي</text>
<text x="530" y="176" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المعيار الوطني</text>
<text x="140" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#16181F">NCEMA 7000</text>
<line x1="40" y1="196" x2="1020" y2="196" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">من يخضع</text>
<text x="530" y="252" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الجهات الحكومية الاتحادية والمحلية · مشغلو البنية التحتية الحيوية · موردوهم، عبر العقود</text>
<text x="530" y="284" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">الامتثال يقاس بالتدقيق الدوري</text>

<!-- الطبقة الثانية -->
<rect x="8" y="316" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="350" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إلزامي</text>
<text x="530" y="388" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المصرف المركزي</text>
<text x="140" y="388" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#16181F">CBUAE Article 7</text>
<line x1="40" y1="408" x2="1020" y2="408" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="436" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">من يخضع</text>
<text x="530" y="464" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">البنوك والمؤسسات المالية · شركات التأمين · مزودو خدمات الدفع</text>
<text x="530" y="496" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">مهلة انتقالية حتى 16 سبتمبر 2026</text>

<!-- الطبقة الثالثة -->
<rect x="8" y="528" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="562" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">اختياري</text>
<text x="530" y="600" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">معيار دولي</text>
<text x="140" y="600" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#16181F">ISO 22301</text>
<line x1="40" y1="620" x2="1020" y2="620" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="648" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">من يطلبه</text>
<text x="530" y="676" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">المناقصات الحكومية والكبرى · الشركات الأم · العملاء الدوليون</text>
<text x="530" y="708" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">لا يفرضه قانون، وتفرضه العقود</text>

<line x1="530" y1="732" x2="530" y2="756" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,754 530,768 537,754" fill="#C4571C"/>

<!-- ضغط العقود -->
<rect x="8" y="776" width="1044" height="124" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1046" y="790" width="5" height="96" rx="2.5" fill="#C4571C"/>
<text x="530" y="822" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">ومن لا يلزمه منظم، تلزمه العقود والتأمين</text>
<text x="530" y="856" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">المناقصات تطلب الأدلة، والمتطلب ينساب عبر سلسلة العقود،</text>
<text x="530" y="882" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">واكتتاب انقطاع الأعمال يسأل أسئلة أصعب كل سنة</text>

<line x1="530" y1="908" x2="530" y2="932" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,930 530,944 537,930" fill="#C4571C"/>

<!-- نقطة البداية -->
<rect x="8" y="952" width="1044" height="140" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="996" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">نقطة البداية واحدة مهما اختلف المتطلب</text>
<text x="530" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تقييم فجوات من أسبوعين إلى ثلاثة</text>
<text x="530" y="1064" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ثم من ثلاثة إلى ستة أشهر حتى نظام مختبر</text>

<text x="530" y="1128" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصادر، المعيار الوطني NCEMA 7000، وكتاب قواعد المصرف المركزي المادة 7، والمرسوم بقانون اتحادي رقم 6 لسنة 2025</text>
</svg>
