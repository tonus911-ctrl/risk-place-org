<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" direction="rtl" role="img" aria-label="ثلاث طبقات من متطلبات استمرارية الأعمال في الإمارات ومن يخضع لكل طبقة، وضغط العقود والتأمين على من لا يخضع لأي منها، ونقطة بداية واحدة">
<rect x="0" y="0" width="1200" height="700" fill="#FDFBF7"/>

<text x="600" y="44" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">ثلاث طبقات من المتطلبات، ونقطة بداية واحدة</text>
<text x="600" y="76" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">استمرارية الأعمال في الإمارات، من يخضع لماذا</text>

<!-- الطبقة الأولى -->
<rect x="800" y="104" width="360" height="286" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="980" y="140" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#C4571C">إلزامي</text>
<text x="980" y="172" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="19" fill="#16181F">المعيار الوطني</text>
<text x="980" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#16181F">NCEMA 7000</text>
<line x1="820" y1="214" x2="1140" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">من يخضع</text>
<text x="980" y="266" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">الجهات الحكومية الاتحادية والمحلية</text>
<text x="980" y="292" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">مشغلو البنية التحتية الحيوية</text>
<text x="980" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">موردوهم، عبر العقود</text>
<line x1="820" y1="338" x2="1140" y2="338" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="368" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">الامتثال يقاس بالتدقيق الدوري</text>

<!-- الطبقة الثانية -->
<rect x="420" y="104" width="360" height="286" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="140" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#C4571C">إلزامي</text>
<text x="600" y="172" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="19" fill="#16181F">المصرف المركزي</text>
<text x="600" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#16181F">CBUAE Article 7</text>
<line x1="440" y1="214" x2="760" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">من يخضع</text>
<text x="600" y="266" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">البنوك والمؤسسات المالية</text>
<text x="600" y="292" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">شركات التأمين</text>
<text x="600" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">مزودو خدمات الدفع</text>
<line x1="440" y1="338" x2="760" y2="338" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="368" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">مهلة انتقالية حتى 16 سبتمبر 2026</text>

<!-- الطبقة الثالثة -->
<rect x="40" y="104" width="360" height="286" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="140" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">اختياري</text>
<text x="220" y="172" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="19" fill="#16181F">معيار دولي</text>
<text x="220" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#16181F">ISO 22301</text>
<line x1="60" y1="214" x2="380" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">من يطلبه</text>
<text x="220" y="266" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">المناقصات الحكومية والكبرى</text>
<text x="220" y="292" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">الشركات الأم</text>
<text x="220" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">العملاء الدوليون</text>
<line x1="60" y1="338" x2="380" y2="338" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="368" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">لا يفرضه قانون، وتفرضه العقود</text>

<line x1="980" y1="390" x2="980" y2="412" stroke="#C4571C" stroke-width="2"/><polygon points="973,411 980,424 987,411" fill="#C4571C"/>
<line x1="600" y1="390" x2="600" y2="412" stroke="#C4571C" stroke-width="2"/><polygon points="593,411 600,424 607,411" fill="#C4571C"/>
<line x1="220" y1="390" x2="220" y2="412" stroke="#C4571C" stroke-width="2"/><polygon points="213,411 220,424 227,411" fill="#C4571C"/>

<!-- ضغط العقود -->
<rect x="40" y="424" width="1120" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1154" y="440" width="5" height="64" rx="2.5" fill="#C4571C"/>
<text x="600" y="462" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#16181F">ومن لا يلزمه منظم، تلزمه العقود والتأمين</text>
<text x="600" y="492" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">المناقصات تطلب الأدلة، والمتطلب ينساب عبر سلسلة العقود، واكتتاب انقطاع الأعمال يسأل أسئلة أصعب كل سنة</text>

<line x1="600" y1="520" x2="600" y2="540" stroke="#C4571C" stroke-width="2"/><polygon points="593,539 600,552 607,539" fill="#C4571C"/>

<!-- نقطة البداية -->
<rect x="240" y="552" width="720" height="104" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="586" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">نقطة البداية واحدة مهما اختلف المتطلب</text>
<text x="600" y="614" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">تقييم فجوات من أسبوعين إلى ثلاثة</text>
<text x="600" y="638" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">ثم من ثلاثة إلى ستة أشهر حتى نظام مختبر</text>

<text x="600" y="684" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">المصادر، المعيار الوطني NCEMA 7000، وكتاب قواعد المصرف المركزي المادة 7، والمرسوم بقانون اتحادي رقم 6 لسنة 2025</text>
</svg>
