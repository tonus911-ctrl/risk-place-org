<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The seven sections of a business continuity plan, what each one contains and the quality test each one has to pass">
<rect x="0" y="0" width="1200" height="760" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">Seven sections, and the test each one has to pass</text>
<text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Action first, reference later, nothing that does not help tonight</text>
<rect x="40" y="104" width="1120" height="46" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="133" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#16181F">The 2 a.m. test — a duty manager must find the next thirty minutes within ninety seconds</text>
<text x="112" y="178" text-anchor="start" font-family="Consolas, monospace" font-size="11.5" fill="#8A8578">SECTION</text>
<text x="412" y="178" text-anchor="start" font-family="Consolas, monospace" font-size="11.5" fill="#8A8578">WHAT IT CONTAINS</text>
<text x="772" y="178" text-anchor="start" font-family="Consolas, monospace" font-size="11.5" fill="#8A8578">THE QUALITY TEST</text>
<rect x="40" y="192" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="76" cy="220" r="15" fill="#C4571C"/>
<text x="76" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">1</text>
<text x="112" y="225" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">Activation</text>
<line x1="396" y1="204" x2="396" y2="236" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="225" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Who declares an incident and on what triggers</text>
<line x1="756" y1="204" x2="756" y2="236" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="225" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">One page, applied alone at night</text>
<rect x="40" y="256" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="76" cy="284" r="15" fill="#C4571C"/>
<text x="76" y="289" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">2</text>
<text x="112" y="289" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">Roles and authority</text>
<line x1="396" y1="268" x2="396" y2="300" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="289" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Stop operations, spend money, speak externally</text>
<line x1="756" y1="268" x2="756" y2="300" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="289" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Every role has a deputy, no step needs a meeting</text>
<rect x="40" y="320" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="76" cy="348" r="15" fill="#C4571C"/>
<text x="76" y="353" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">3</text>
<text x="112" y="353" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">First hours</text>
<line x1="396" y1="332" x2="396" y2="364" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="353" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Checklists for the first 1 to 4 hours</text>
<line x1="756" y1="332" x2="756" y2="364" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="353" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Verbs and owners, not policy prose</text>
<rect x="40" y="384" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="76" cy="412" r="15" fill="#C4571C"/>
<text x="76" y="417" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">4</text>
<text x="112" y="417" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">Workarounds</text>
<line x1="396" y1="396" x2="396" y2="428" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="417" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Manual processes, alternate suppliers and site</text>
<line x1="756" y1="396" x2="756" y2="428" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="417" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Each one names trigger, capacity, time limit</text>
<rect x="40" y="448" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="76" cy="476" r="15" fill="#C4571C"/>
<text x="76" y="481" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">5</text>
<text x="112" y="481" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">Recovery</text>
<line x1="396" y1="460" x2="396" y2="492" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="481" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Back to normal against RTO and RPO, in order</text>
<line x1="756" y1="460" x2="756" y2="492" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="481" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Consistent with the BIA, shown in a test</text>
<rect x="40" y="512" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="76" cy="540" r="15" fill="#C4571C"/>
<text x="76" y="545" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">6</text>
<text x="112" y="545" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">Communications</text>
<line x1="396" y1="524" x2="396" y2="556" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="545" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Staff, clients, authorities, media, statements</text>
<line x1="756" y1="524" x2="756" y2="556" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="545" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">First statement ready within the hour</text>
<rect x="40" y="576" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="76" cy="604" r="15" fill="#C4571C"/>
<text x="76" y="609" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">7</text>
<text x="112" y="609" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#16181F">Contacts and resources</text>
<line x1="396" y1="588" x2="396" y2="620" stroke="#E1DCD3" stroke-width="1"/>
<text x="412" y="609" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">People, suppliers, insurers, regulators</text>
<line x1="756" y1="588" x2="756" y2="620" stroke="#E1DCD3" stroke-width="1"/>
<text x="772" y="609" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Dated, verified quarterly, available offline</text>
<rect x="40" y="646" width="1120" height="46" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="675" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#16181F">Sections 1 to 3 — the part used under stress — fit in 10 to 15 pages. Everything else is appendix.</text>
<text x="600" y="730" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8A8578">A 120-page monolith is not a plan, it is a filing cabinet with a cover · risk-place.org</text>
</svg>
