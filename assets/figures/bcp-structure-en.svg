<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1550" width="1060" height="1550" role="img" aria-label="The seven sections of a business continuity plan, what each one contains and the quality test each one has to pass">
<rect x="0" y="0" width="1060" height="1550" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Seven sections, and the test each one has to pass</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Action first, reference later, nothing that does not help tonight</text>
<rect x="8" y="112" width="1044" height="64" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">The 2 a.m. test — a duty manager must find the next thirty minutes within ninety seconds</text>
<rect x="8" y="200" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="52" cy="238" r="25" fill="#C4571C"/>
<text x="52" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="100" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Activation</text>
<line x1="32" y1="266" x2="1028" y2="266" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="298" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Who declares an incident and on what triggers</text>
<text x="32" y="330" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">One page, applied alone at night</text>
<rect x="8" y="368" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="406" r="25" fill="#C4571C"/>
<text x="52" y="414" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="100" y="414" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Roles and authority</text>
<line x1="32" y1="434" x2="1028" y2="434" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="466" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Stop operations, spend money, speak externally</text>
<text x="32" y="498" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Every role has a deputy, no step needs a meeting</text>
<rect x="8" y="536" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="574" r="25" fill="#C4571C"/>
<text x="52" y="582" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="100" y="582" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">First hours</text>
<line x1="32" y1="602" x2="1028" y2="602" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="634" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="634" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Checklists for the first 1 to 4 hours</text>
<text x="32" y="666" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="666" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Verbs and owners, not policy prose</text>
<rect x="8" y="704" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="742" r="25" fill="#C4571C"/>
<text x="52" y="750" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="100" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Workarounds</text>
<line x1="32" y1="770" x2="1028" y2="770" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="802" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="802" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Manual processes, alternate suppliers and site</text>
<text x="32" y="834" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="834" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Each one names trigger, capacity, time limit</text>
<rect x="8" y="872" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="910" r="25" fill="#C4571C"/>
<text x="52" y="918" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="100" y="918" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Recovery</text>
<line x1="32" y1="938" x2="1028" y2="938" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="970" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="970" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Back to normal against RTO and RPO, in order</text>
<text x="32" y="1002" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="1002" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Consistent with the BIA, shown in a test</text>
<rect x="8" y="1040" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="52" cy="1078" r="25" fill="#C4571C"/>
<text x="52" y="1086" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="100" y="1086" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Communications</text>
<line x1="32" y1="1106" x2="1028" y2="1106" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="1138" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="1138" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Staff, clients, authorities, media, statements</text>
<text x="32" y="1170" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="1170" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">First statement ready within the hour</text>
<rect x="8" y="1208" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="52" cy="1246" r="25" fill="#C4571C"/>
<text x="52" y="1254" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">7</text>
<text x="100" y="1254" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Contacts and resources</text>
<line x1="32" y1="1274" x2="1028" y2="1274" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="1306" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT IT CONTAINS</text>
<text x="260" y="1306" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">People, suppliers, insurers, regulators</text>
<text x="32" y="1338" font-family="Consolas, monospace" font-size="15" fill="#A34D19">THE QUALITY TEST</text>
<text x="260" y="1338" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Dated, verified quarterly, available offline</text>
<rect x="8" y="1400" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="1440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Sections 1 to 3 — the part used under stress — fit in 10 to 15 pages. Everything else is appendix.</text>
<text x="530" y="1512" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">A 120-page monolith is not a plan, it is a filing cabinet with a cover · risk-place.org</text>
</svg>
