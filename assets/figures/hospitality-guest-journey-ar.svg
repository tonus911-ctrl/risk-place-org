<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1376" width="1060" height="1376" direction="rtl" role="img" aria-label="رحلة الضيف في الفندق ونقاط انكسارها والبديل اليدوي عند كل محطة">
<rect x="0" y="0" width="1060" height="1376" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">رحلة الضيف، خمس محطات وخمس نقاط انكسار</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">عند كل محطة نظام قد يسقط، وبديل يدوي يجب أن يكون مكتوبا ومجربا قبل الحادث</text>

<rect x="8" y="112" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="196" r="25" fill="#C4571C"/>
<text x="1000" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="520" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الحجز والتسعير</text>
<text x="520" y="186" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">قنوات التوزيع والأسعار</text>
<text x="880" y="224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">نقطة الانكسار</text>
<text x="520" y="224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">قناة الحجز تتوقف والأسعار تتجمد</text>
<text x="880" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">البديل</text>
<text x="520" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">قائمة أسعار ورقية معتمدة</text>

<polygon points="993,286 1007,286 1000,298" fill="#C4571C"/>

<rect x="8" y="306" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="390" r="25" fill="#C4571C"/>
<text x="1000" y="398" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="520" y="348" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الوصول وتسجيل الدخول</text>
<text x="520" y="380" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">المكتب الأمامي</text>
<text x="880" y="418" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">نقطة الانكسار</text>
<text x="520" y="418" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">نظام إدارة الفندق لا يوزع الغرف</text>
<text x="880" y="452" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">البديل</text>
<text x="520" y="452" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بطاقات تسجيل ورقية</text>

<polygon points="993,480 1007,480 1000,492" fill="#C4571C"/>

<rect x="8" y="500" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="584" r="25" fill="#C4571C"/>
<text x="1000" y="592" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="520" y="542" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الإقامة والغرفة</text>
<text x="520" y="574" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">المفاتيح والتبريد</text>
<text x="880" y="612" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">نقطة الانكسار</text>
<text x="520" y="612" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مفاتيح إلكترونية وتبريد متوقف</text>
<text x="880" y="646" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">البديل</text>
<text x="520" y="646" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أولويات حمل المولد</text>

<polygon points="993,674 1007,674 1000,686" fill="#C4571C"/>

<rect x="8" y="694" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="778" r="25" fill="#C4571C"/>
<text x="1000" y="786" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="520" y="736" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المطاعم والمرافق</text>
<text x="520" y="768" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">نقاط البيع والإمداد</text>
<text x="880" y="806" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">نقطة الانكسار</text>
<text x="520" y="806" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">نقاط البيع والغسيل والتوريد تتعثر</text>
<text x="880" y="840" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">البديل</text>
<text x="520" y="840" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">موردون بدلاء مؤهلون</text>

<polygon points="993,868 1007,868 1000,880" fill="#C4571C"/>

<rect x="8" y="888" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="972" r="25" fill="#C4571C"/>
<text x="1000" y="980" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="520" y="930" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المغادرة والدفع</text>
<text x="520" y="962" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">الحساب والتحصيل</text>
<text x="880" y="1000" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">نقطة الانكسار</text>
<text x="520" y="1000" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الفوترة وبوابة الدفع خارج الخدمة</text>
<text x="880" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">البديل</text>
<text x="520" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">دفتر حساب يدوي وتحصيل لاحق</text>

<rect x="8" y="1088" width="1044" height="224" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="1046" y="1102" width="5" height="196" rx="2.5" fill="#C4571C"/>
<text x="530" y="1128" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#C4571C">ما يبقى في ذاكرة الضيف</text>
<text x="530" y="1166" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">الضيف لا يتذكر الحادث، يتذكر هل بدا الطاقم عارفا بما يفعل</text>
<rect x="704" y="1194" width="316" height="40" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="862" y="1220" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">بطاقة ساعات أولى لكل قسم</text>
<rect x="372" y="1194" width="316" height="40" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1220" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">صوت واحد يتحدث باسم الفندق</text>
<rect x="40" y="1194" width="316" height="40" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="1220" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">أسعار وتسجيل على الورق</text>
<text x="530" y="1284" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">البدائل اليدوية تكتب وتجرب في وردية هادئة، لا تخترع ليلة الإشغال الكامل</text>

<text x="530" y="1348" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصدر، استمرارية الضيافة · risk-place.org</text>
</svg>
