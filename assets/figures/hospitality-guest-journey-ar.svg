<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" direction="rtl" role="img" aria-label="رحلة الضيف في الفندق ونقاط انكسارها والبديل اليدوي عند كل محطة">
<rect x="0" y="0" width="1200" height="760" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">رحلة الضيف، خمس محطات وخمس نقاط انكسار</text>
