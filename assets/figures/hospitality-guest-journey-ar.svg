<text x="600" y="588" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">الضيف لا يتذكر الحادث، يتذكر هل بدا الطاقم عارفا بما يفعل</text>
<rect x="800" y="612" width="330" height="30" rx="6" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
