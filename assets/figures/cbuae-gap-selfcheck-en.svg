<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-label="Self-assessment against Article 7 of the CBUAE Rulebook broken into four areas with eighteen questions, the three permitted answers, and three scoring bands">
<rect x="0" y="0" width="1200" height="710" fill="#FDFBF7"/>

<text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">Four areas, eighteen questions, one answer that counts</text>
<text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">A self-assessment against Article 7 of the CBUAE Rulebook — only dated evidence scores</text>

<!-- answer scale -->
<rect x="40" y="104" width="1120" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="41" y="116" width="5" height="72" rx="2.5" fill="#C4571C"/>
<text x="600" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#C4571C">THE ONLY THREE ANSWERS</text>

<rect x="100" y="146" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="250" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B564A">No — nothing in place</text>

<line x1="406" y1="168" x2="428" y2="168" stroke="#C4571C" stroke-width="2"/><polygon points="427,161 444,168 427,175" fill="#C4571C"/>

<rect x="450" y="146" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B564A">On paper only — untested</text>

<line x1="756" y1="168" x2="778" y2="168" stroke="#C4571C" stroke-width="2"/><polygon points="777,161 794,168 777,175" fill="#C4571C"/>

<rect x="800" y="146" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="950" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#16181F">Yes — with dated evidence</text>

<!-- area 1 -->
<rect x="40" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="172" cy="266" r="18" fill="#C4571C"/>
<text x="172" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">4</text>
<text x="172" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">Policy and</text>
<text x="172" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">governance</text>
<line x1="56" y1="358" x2="289" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="172" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Signed, current policy</text>
<text x="172" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">A named executive owner</text>
<text x="172" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Board sighted annually</text>

<!-- area 2 -->
<rect x="325" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="457" cy="266" r="18" fill="#C4571C"/>
<text x="457" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">4</text>
<text x="457" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">BIA and risk</text>
<text x="457" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">assessment</text>
<line x1="341" y1="358" x2="574" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="457" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Critical functions named</text>
<text x="457" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Impact measured over time</text>
<text x="457" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Dependencies and failure points</text>

<!-- area 3 -->
<rect x="610" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="742" cy="266" r="18" fill="#C4571C"/>
<text x="742" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">4</text>
<text x="742" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">Plans and disaster</text>
<text x="742" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">recovery</text>
<line x1="626" y1="358" x2="859" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="742" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">BCP end to end</text>
<text x="742" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">First-hours authority</text>
<text x="742" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Recovery tested, not assumed</text>

<!-- area 4 -->
<rect x="895" y="230" width="265" height="230" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="1027" cy="266" r="18" fill="#C4571C"/>
<text x="1027" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">6</text>
<text x="1027" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">Testing and</text>
<text x="1027" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">evidence</text>
<line x1="911" y1="358" x2="1144" y2="358" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1027" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Tested within 12 months</text>
<text x="1027" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Findings closed with dates</text>
<text x="1027" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Outsourced services covered</text>

<!-- total -->
<line x1="600" y1="474" x2="600" y2="496" stroke="#C4571C" stroke-width="2"/><polygon points="593,495 600,511 607,495" fill="#C4571C"/>
<text x="712" y="500" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#8A8578">18 QUESTIONS IN TOTAL</text>

<!-- score band -->
<rect x="40" y="530" width="366" height="116" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="223" y="576" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#C4571C">18</text>
<text x="223" y="604" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#16181F">Yes, with dated evidence</text>
<text x="223" y="628" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Examination-ready</text>

<rect x="417" y="530" width="366" height="116" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="576" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#16181F">13 — 17</text>
<text x="600" y="604" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#16181F">A focused quarter closes it</text>
<text x="600" y="628" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Start with what shows in hour one</text>

<rect x="794" y="530" width="366" height="116" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="977" y="576" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#16181F">Below 13</text>
<text x="977" y="604" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#16181F">You need a programme</text>
<text x="977" y="628" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Not a set of corrections</text>

<text x="600" y="686" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Source — CBUAE Rulebook, Operational Risk Regulation and Standards, Article 7 · 18 questions across four areas</text>
</svg>
