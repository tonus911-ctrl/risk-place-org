<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1216" width="1060" height="1216" role="img" aria-label="Self-assessment against Article 7 of the CBUAE Rulebook broken into four areas with eighteen questions, the three permitted answers, and three scoring bands">
<rect x="0" y="0" width="1060" height="1216" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Four areas, eighteen questions, one answer that counts</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">A self-assessment against Article 7 of the CBUAE Rulebook — only dated evidence scores</text>

<!-- answer scale -->
<rect x="8" y="112" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="126" width="5" height="84" rx="2.5" fill="#C4571C"/>
<text x="40" y="142" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">THE ONLY THREE ANSWERS</text>

<rect x="32" y="156" width="308" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="186" y="191" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">No — nothing in place</text>
<line x1="344" y1="184" x2="358" y2="184" stroke="#C4571C" stroke-width="2.5"/><polygon points="357,177 368,184 357,191" fill="#C4571C"/>

<rect x="372" y="156" width="308" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="526" y="191" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">On paper only — untested</text>
<line x1="684" y1="184" x2="698" y2="184" stroke="#C4571C" stroke-width="2.5"/><polygon points="697,177 708,184 697,191" fill="#C4571C"/>

<rect x="712" y="156" width="308" height="56" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="866" y="191" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Yes — with dated evidence</text>

<!-- area 1 -->
<rect x="8" y="248" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="302" r="25" fill="#C4571C"/>
<text x="60" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Policy and governance</text>
<text x="108" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Signed, current policy · A named executive owner · Board sighted annually</text>
<polygon points="53,360 67,360 60,370" fill="#C4571C"/>

<!-- area 2 -->
<rect x="8" y="372" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="426" r="25" fill="#C4571C"/>
<text x="60" y="434" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">BIA and risk assessment</text>
<text x="108" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Critical functions named · Impact measured over time · Dependencies and failure points</text>
<polygon points="53,484 67,484 60,494" fill="#C4571C"/>

<!-- area 3 -->
<rect x="8" y="496" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="550" r="25" fill="#C4571C"/>
<text x="60" y="558" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Plans and disaster recovery</text>
<text x="108" y="574" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">BCP end to end · First-hours authority · Recovery tested, not assumed</text>
<polygon points="53,608 67,608 60,618" fill="#C4571C"/>

<!-- area 4 -->
<rect x="8" y="620" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="60" cy="674" r="25" fill="#C4571C"/>
<text x="60" y="682" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="108" y="664" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Testing and evidence</text>
<text x="108" y="698" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Tested within 12 months · Findings closed with dates · Outsourced services covered</text>

<!-- total -->
<line x1="530" y1="748" x2="530" y2="772" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,770 530,784 537,770" fill="#C4571C"/>
<text x="530" y="812" text-anchor="middle" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">18 QUESTIONS IN TOTAL</text>

<!-- score band 1 -->
<rect x="8" y="836" width="1044" height="104" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="40" y="898" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#C4571C">18</text>
<text x="290" y="880" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Yes, with dated evidence</text>
<text x="290" y="910" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Examination-ready</text>

<!-- score band 2 -->
<rect x="8" y="952" width="1044" height="104" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="40" y="1014" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#16181F">13 — 17</text>
<text x="290" y="996" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">A focused quarter closes it</text>
<text x="290" y="1026" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Start with what shows in hour one</text>

<!-- score band 3 -->
<rect x="8" y="1068" width="1044" height="104" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="40" y="1130" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#16181F">Below 13</text>
<text x="290" y="1112" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">You need a programme</text>
<text x="290" y="1142" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Not a set of corrections</text>

<text x="530" y="1196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Source — CBUAE Rulebook, Operational Risk Regulation and Standards, Article 7 · 18 questions across four areas</text>
</svg>
