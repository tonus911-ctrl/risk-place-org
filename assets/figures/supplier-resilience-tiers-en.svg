<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1390" width="1060" height="1390" role="img" aria-label="How the supplier evaluation duty flows down, and three tiers of continuity evidence">
<rect x="0" y="0" width="1060" height="1390" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Three supplier tiers, three evidence packs</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">The weight of evidence follows the impact of your stoppage on the client, not your headcount</text>

<rect x="8" y="112" width="1044" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="154" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Critical infrastructure operator</text>
<text x="530" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">the national standard obliges it to evaluate suppliers</text>
<polygon points="523,214 537,214 530,226" fill="#C4571C"/>

<rect x="8" y="232" width="1044" height="96" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="274" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Direct supplier</text>
<text x="530" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">answers with evidence, not intent</text>
<polygon points="523,334 537,334 530,346" fill="#C4571C"/>

<rect x="8" y="352" width="1044" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="394" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Sub-supplier</text>
<text x="530" y="426" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">asked in turn about its own failure point</text>

<text x="530" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">The supplier evaluation duty flows down through contracts, not through inspection</text>

<rect x="8" y="512" width="1044" height="296" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="36" y="564" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Critical supplier</text>
<text x="36" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">your stoppage stops the client's line</text>
<text x="420" y="558" font-family="Consolas, monospace" font-size="15" fill="#A34D19">EVIDENCE PACK</text>
<text x="420" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Continuity summary</text>
<text x="420" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Recovery commitments</text>
<text x="420" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Dated exercise report</text>
<text x="420" y="692" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Sub-supplier map</text>
<text x="420" y="724" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Communication protocol</text>
<text x="530" y="780" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">The buyer wants the full pack, and asks for the date of the last exercise and the findings closed</text>

<rect x="8" y="832" width="1044" height="232" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="36" y="884" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Important supplier</text>
<text x="36" y="916" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">your stoppage delays but does not stop</text>
<text x="420" y="878" font-family="Consolas, monospace" font-size="15" fill="#A34D19">EVIDENCE PACK</text>
<text x="420" y="916" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Two-page summary</text>
<text x="420" y="948" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Recovery commitments</text>
<text x="420" y="980" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Communication protocol</text>
<text x="530" y="1036" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Three documents are enough, provided the recovery numbers come from an impact analysis</text>

<rect x="8" y="1088" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="36" y="1140" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Replaceable supplier</text>
<text x="36" y="1172" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">an alternate exists within days</text>
<text x="420" y="1134" font-family="Consolas, monospace" font-size="15" fill="#A34D19">EVIDENCE PACK</text>
<text x="420" y="1172" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Continuity statement</text>
<text x="420" y="1204" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Emergency contacts</text>
<text x="530" y="1260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">A short statement and contacts that work — attention moves back to price and quality</text>

<text x="530" y="1328" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">The same pack is built in six to eight weeks and drops into any prequalification or tender</text>
<text x="530" y="1362" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Source — ADNOC supplier qualification and the resilience dimension · risk-place.org</text>
</svg>
