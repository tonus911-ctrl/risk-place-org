<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" direction="rtl" role="img" aria-label="نموذج الخطوط الثلاثة، مجلس الإدارة والإدارة التنفيذية بخطيها الأول والثاني والتدقيق الداخلي كتأكيد مستقل، مع بيان من يرفع تقاريره إلى من">
<rect x="0" y="0" width="1200" height="740" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">ثلاثة أدوار ومجلس واحد ورأي مستقل واحد</text>
<text x="600" y="82" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">نموذج معهد المدققين الداخليين لعام 2020 يصف مسؤوليات لا إدارات، ويحدد من يرفع تقاريره إلى من</text>
<rect x="40" y="108" width="1120" height="70" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="138" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#16181F">مجلس الإدارة ولجانه</text>
<text x="600" y="162" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">يتحمل المساءلة أمام أصحاب المصلحة، ويحدد شهية المخاطر، ويتلقى التقارير الثلاثة</text>
<line x1="775" y1="186" x2="775" y2="206" stroke="#C4571C" stroke-width="2"/>
<polygon points="782,205 775,220 768,205" fill="#C4571C"/>
<text x="789" y="206" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">يفوض الصلاحية والموارد</text>
<line x1="207" y1="186" x2="207" y2="206" stroke="#C4571C" stroke-width="2"/>
<polygon points="214,205 207,220 200,205" fill="#C4571C"/>
<text x="221" y="206" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">يمنح التفويض ويحمي الاستقلال</text>
<rect x="390" y="228" width="770" height="272" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="775" y="252" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12" fill="#C4571C">الإدارة التنفيذية، تملك المخاطر التي ينشئها العمل</text>
<rect x="40" y="228" width="334" height="272" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="207" y="252" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12" fill="#C4571C">تأكيد مستقل</text>
<rect x="788" y="266" width="352" height="216" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="964" cy="298" r="17" fill="#C4571C"/>
<text x="964" y="304" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">1</text>
<text x="964" y="338" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">أصحاب العمليات</text>
<text x="964" y="360" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">والخدمات</text>
<line x1="1124" y1="376" x2="804" y2="376" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="964" y="400" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">يديرون العمل ويتخذون القرارات</text>
<text x="964" y="422" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">يملكون الخطر ويشغلون الضوابط</text>
<text x="964" y="444" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">يكتبون خططهم ويحدثونها بأنفسهم</text>
<text x="964" y="466" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">يرفعون تقاريرهم عبر الإدارة التنفيذية</text>
<rect x="410" y="266" width="357" height="216" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="588.5" cy="298" r="17" fill="#C4571C"/>
<text x="588.5" y="304" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">2</text>
<text x="588.5" y="338" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">وظائف المخاطر والامتثال</text>
<text x="588.5" y="360" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">والاستمرارية</text>
<line x1="751" y1="376" x2="426" y2="376" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="588.5" y="400" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تضع المنهجية والمعايير</text>
<text x="588.5" y="422" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تراقب وتتحدى وتجمع الصورة</text>
<text x="588.5" y="444" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تسند الخط الأول ولا تحل محله</text>
<text x="588.5" y="466" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ترفع تقاريرها عبر الإدارة التنفيذية</text>
<rect x="60" y="266" width="294" height="216" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="207" cy="298" r="17" fill="#C4571C"/>
<text x="207" y="304" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">3</text>
<text x="207" y="338" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">التدقيق الداخلي</text>
<text x="207" y="360" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">مستقل بالتصميم</text>
<line x1="338" y1="376" x2="76" y2="376" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="207" y="400" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">يؤكد أن المنظومة كلها تعمل</text>
<text x="207" y="422" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">يرفع تقاريره إلى لجنة التدقيق</text>
<text x="207" y="444" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">لا يصمم ما سيدققه لاحقا</text>
<text x="207" y="466" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ارتباطه بالرئيس التنفيذي إداري فقط</text>
<rect x="40" y="520" width="1120" height="96" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="544" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">ما ينبغي أن يصل المجلس من كل خط</text>
<rect x="790" y="556" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="965" y="584" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">الخط الأول، ما ندير وما كاد أن يتعطل</text>
<rect x="425" y="556" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="584" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#5B564A">الخط الثاني، هل تتبع المنهجية فعلا</text>
<rect x="60" y="556" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="235" y="584" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#16181F">الخط الثالث، هل يمكن تصديق الخطين الأولين</text>
<text x="600" y="648" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">نموذج 2020 أسقط كلمة الدفاع، فالخطوط أدوار تتعاون لا جدران تتراكم</text>
<text x="600" y="676" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">الاستقلال هو ما يجعل الخط الثالث جديرا بالقراءة، وفصل المهام ليس عزلا</text>
<text x="600" y="712" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">استنادا إلى نموذج الخطوط الثلاثة لمعهد المدققين الداخليين لعام 2020 · risk-place.org</text>
</svg>
