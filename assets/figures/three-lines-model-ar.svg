<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1400" width="1060" height="1400" direction="rtl" role="img" aria-label="نموذج الخطوط الثلاثة، مجلس الإدارة والإدارة التنفيذية بخطيها الأول والثاني والتدقيق الداخلي كتأكيد مستقل، مع بيان من يرفع تقاريره إلى من">
<rect x="0" y="0" width="1060" height="1400" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">ثلاثة أدوار ومجلس واحد ورأي مستقل واحد</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">نموذج معهد المدققين الداخليين لعام 2020 يصف مسؤوليات لا إدارات، ويحدد من يرفع تقاريره إلى من</text>
<rect x="8" y="112" width="1044" height="110" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="530" y="156" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مجلس الإدارة ولجانه</text>
<text x="530" y="192" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">يتحمل المساءلة أمام أصحاب المصلحة، ويحدد شهية المخاطر، ويتلقى التقارير الثلاثة</text>
<text x="790" y="248" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">يفوض الصلاحية والموارد</text>
<line x1="790" y1="258" x2="790" y2="274" stroke="#C4571C" stroke-width="2.5"/><polygon points="783,272 790,286 797,272" fill="#C4571C"/>
<text x="270" y="248" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">يمنح التفويض ويحمي الاستقلال</text>
<line x1="270" y1="258" x2="270" y2="274" stroke="#C4571C" stroke-width="2.5"/><polygon points="263,272 270,286 277,272" fill="#C4571C"/>
<text x="857.8" y="312" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">الإدارة التنفيذية، تملك المخاطر التي ينشئها العمل</text>
<rect x="8" y="324" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1000" cy="374" r="25" fill="#C4571C"/>
<text x="1000" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="807.5" y="366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">أصحاب العمليات والخدمات</text>
<line x1="32" y1="388" x2="952" y2="388" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="825.4" y="416" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يديرون العمل ويتخذون القرارات</text>
<text x="821.0" y="442" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يملكون الخطر ويشغلون الضوابط</text>
<text x="817.0" y="468" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يكتبون خططهم ويحدثونها بأنفسهم</text>
<text x="806.4" y="494" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يرفعون تقاريرهم عبر الإدارة التنفيذية</text>
<rect x="8" y="536" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="586" r="25" fill="#C4571C"/>
<text x="1000" y="594" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="745.9" y="578" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">وظائف المخاطر والامتثال والاستمرارية</text>
<line x1="32" y1="600" x2="952" y2="600" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="863.0" y="628" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تضع المنهجية والمعايير</text>
<text x="837.2" y="654" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تراقب وتتحدى وتجمع الصورة</text>
<text x="831.6" y="680" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تسند الخط الأول ولا تحل محله</text>
<text x="821.5" y="706" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ترفع تقاريرها عبر الإدارة التنفيذية</text>
<text x="984.3" y="772" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">تأكيد مستقل</text>
<rect x="8" y="784" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="834" r="25" fill="#C4571C"/>
<text x="1000" y="842" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="775.0" y="826" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التدقيق الداخلي مستقل بالتصميم</text>
<line x1="32" y1="848" x2="952" y2="848" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="841.1" y="876" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يؤكد أن المنظومة كلها تعمل</text>
<text x="835.0" y="902" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يرفع تقاريره إلى لجنة التدقيق</text>
<text x="854.6" y="928" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لا يصمم ما سيدققه لاحقا</text>
<text x="808.6" y="954" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ارتباطه بالرئيس التنفيذي إداري فقط</text>
<text x="530" y="1026" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">ما ينبغي أن يصل المجلس من كل خط</text>
<rect x="8" y="1046" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1086" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الخط الأول، ما ندير وما كاد أن يتعطل</text>
<rect x="8" y="1122" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1162" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الخط الثاني، هل تتبع المنهجية فعلا</text>
<rect x="8" y="1198" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="1238" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">الخط الثالث، هل يمكن تصديق الخطين الأولين</text>
<text x="530" y="1302" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">نموذج 2020 أسقط كلمة الدفاع، فالخطوط أدوار تتعاون لا جدران تتراكم</text>
<text x="530" y="1334" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">الاستقلال هو ما يجعل الخط الثالث جديرا بالقراءة، وفصل المهام ليس عزلا</text>
<text x="530" y="1374" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">استنادا إلى نموذج الخطوط الثلاثة لمعهد المدققين الداخليين لعام 2020 · risk-place.org</text>
</svg>
