<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1376" width="1060" height="1376" direction="rtl" role="img" aria-label="سلسلة التوقف في المصنع من الحدث إلى أول إنتاج معتمد، وأين تنكسر كل حلقة">
<rect x="0" y="0" width="1060" height="1376" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">سلسلة التوقف في المصنع، وأين تنكسر</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">من الحدث إلى أول إنتاج معتمد، خمس حلقات لكل واحدة نقطة انكسار معروفة</text>

<rect x="8" y="112" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="196" r="25" fill="#C4571C"/>
<text x="1000" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="520" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الحدث</text>
<text x="520" y="186" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">حريق، مرافق، فدية، مورد</text>
<text x="880" y="224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">أين تنكسر</text>
<text x="520" y="224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الإبلاغ يتأخر لأن الوردية تنتظر إذنا</text>
<text x="880" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المعالجة</text>
<text x="520" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تصعيد مكتوب</text>

<polygon points="993,286 1007,286 1000,298" fill="#C4571C"/>

<rect x="8" y="306" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="390" r="25" fill="#C4571C"/>
<text x="1000" y="398" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="520" y="348" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الإيقاف الآمن</text>
<text x="520" y="380" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">قرار من يوقف الخط</text>
<text x="880" y="418" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">أين تنكسر</text>
<text x="520" y="418" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">صلاحية الإيقاف غير مكتوبة باسم أحد</text>
<text x="880" y="452" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المعالجة</text>
<text x="520" y="452" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تفويض معلن</text>

<polygon points="993,480 1007,480 1000,492" fill="#C4571C"/>

<rect x="8" y="500" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="584" r="25" fill="#C4571C"/>
<text x="1000" y="592" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="520" y="542" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مدة التعذر</text>
<text x="520" y="574" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">لا وصول إلى الموقع</text>
<text x="880" y="612" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">أين تنكسر</text>
<text x="520" y="612" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لا خطة تعذر وصول ولا مراقبة عن بعد</text>
<text x="880" y="646" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المعالجة</text>
<text x="520" y="646" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تصاريح وطاقم مصغر</text>

<polygon points="993,674 1007,674 1000,686" fill="#C4571C"/>

<rect x="8" y="694" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="778" r="25" fill="#C4571C"/>
<text x="1000" y="786" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="520" y="736" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">إعادة تشغيل متسلسلة</text>
<text x="520" y="768" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">وحدة بعد وحدة</text>
<text x="880" y="806" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">أين تنكسر</text>
<text x="520" y="806" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الكتيب في رأس مهندس واحد مسافر</text>
<text x="880" y="840" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المعالجة</text>
<text x="520" y="840" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">كتيب مكتوب للوردية</text>

<polygon points="993,868 1007,868 1000,880" fill="#C4571C"/>

<rect x="8" y="888" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1000" cy="972" r="25" fill="#C4571C"/>
<text x="1000" y="980" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="520" y="930" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">أول إنتاج معتمد</text>
<text x="520" y="962" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">بعد فحوص الجودة</text>
<text x="880" y="1000" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">أين تنكسر</text>
<text x="520" y="1000" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مدخل وحيد المصدر لم يصل، والدفعة ترفض</text>
<text x="880" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المعالجة</text>
<text x="520" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سجل وحيد المصدر</text>

<rect x="8" y="1088" width="1044" height="224" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="1046" y="1102" width="5" height="196" rx="2.5" fill="#C4571C"/>
<text x="530" y="1128" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#C4571C">الفجوة التي تسقط من حسابات الميزانية</text>
<rect x="726" y="1150" width="282" height="36" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="867" y="1174" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">مدة الحدث، ست ساعات</text>
<rect x="68" y="1200" width="940" height="36" rx="8" fill="#C4571C"/>
<text x="538" y="1224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#FFFFFF">مدة العودة إلى الإنتاج، عشرين ساعة</text>
<text x="530" y="1276" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">إعادة التشغيل تسلسل لا مفتاح، ولهذا تطول العودة بعد حدث قصير</text>

<text x="530" y="1348" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصدر، استمرارية التصنيع في الخليج · risk-place.org</text>
</svg>
