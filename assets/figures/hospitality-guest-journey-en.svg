<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The hotel guest journey, its points of failure and the manual fallback at each stage">
<rect x="0" y="0" width="1200" height="760" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#16181F">The guest journey, five stages and five failure points</text>
<text x="600" y="82" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#5B564A">At every stage a system can fail, and a manual fallback must be written and rehearsed first</text>
<rect x="39" y="118" width="205" height="120" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="141.5" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#C4571C">1</text>
<text x="141.5" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#16181F">Booking and rates</text>
<text x="141.5" y="208" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#5B564A">Distribution channels</text>
<line x1="246" y1="178" x2="254" y2="178" stroke="#C4571C" stroke-width="2"/>
<polygon points="254,171 266,178 254,185" fill="#C4571C"/>
<rect x="39" y="288" width="205" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="141.5" y="318" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#C4571C">Point of failure</text>
<line x1="55" y1="336" x2="228" y2="336" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="141.5" y="364" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">Booking channel down,</text>
<text x="141.5" y="388" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">rates frozen</text>
<line x1="55" y1="416" x2="228" y2="416" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="141.5" y="442" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">Fallback, approved</text>
<text x="141.5" y="464" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">paper rate sheet</text>
<rect x="268" y="118" width="205" height="120" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="370.5" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#C4571C">2</text>
<text x="370.5" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#16181F">Arrival and check-in</text>
<text x="370.5" y="208" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#5B564A">Property management</text>
<line x1="475" y1="178" x2="483" y2="178" stroke="#C4571C" stroke-width="2"/>
<polygon points="483,171 495,178 483,185" fill="#C4571C"/>
<rect x="268" y="288" width="205" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="370.5" y="318" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#C4571C">Point of failure</text>
<line x1="284" y1="336" x2="457" y2="336" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="370.5" y="364" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">PMS cannot assign</text>
<text x="370.5" y="388" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">or bill rooms</text>
<line x1="284" y1="416" x2="457" y2="416" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="370.5" y="442" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">Fallback, paper</text>
<text x="370.5" y="464" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">registration cards</text>
<rect x="497" y="118" width="205" height="120" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="599.5" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#C4571C">3</text>
<text x="599.5" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#16181F">Stay and room</text>
<text x="599.5" y="208" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#5B564A">Key cards and cooling</text>
<line x1="704" y1="178" x2="712" y2="178" stroke="#C4571C" stroke-width="2"/>
<polygon points="712,171 724,178 712,185" fill="#C4571C"/>
<rect x="497" y="288" width="205" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="599.5" y="318" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#C4571C">Point of failure</text>
<line x1="513" y1="336" x2="686" y2="336" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="599.5" y="364" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">Key cards dead,</text>
<text x="599.5" y="388" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">cooling lost</text>
<line x1="513" y1="416" x2="686" y2="416" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="599.5" y="442" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">Fallback, generator</text>
<text x="599.5" y="464" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">load priorities</text>
<rect x="726" y="118" width="205" height="120" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="828.5" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#C4571C">4</text>
<text x="828.5" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#16181F">Restaurants and facilities</text>
<text x="828.5" y="208" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#5B564A">Point of sale and supply</text>
<line x1="933" y1="178" x2="941" y2="178" stroke="#C4571C" stroke-width="2"/>
<polygon points="941,171 953,178 941,185" fill="#C4571C"/>
<rect x="726" y="288" width="205" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="828.5" y="318" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#C4571C">Point of failure</text>
<line x1="742" y1="336" x2="915" y2="336" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="828.5" y="364" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">Point of sale, laundry</text>
<text x="828.5" y="388" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">and supply interrupted</text>
<line x1="742" y1="416" x2="915" y2="416" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="828.5" y="442" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">Fallback, pre-qualified</text>
<text x="828.5" y="464" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">alternate suppliers</text>
<rect x="955" y="118" width="205" height="120" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1057.5" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#C4571C">5</text>
<text x="1057.5" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#16181F">Departure and payment</text>
<text x="1057.5" y="208" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#5B564A">Checkout and settlement</text>
<rect x="955" y="288" width="205" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1057.5" y="318" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#C4571C">Point of failure</text>
<line x1="971" y1="336" x2="1144" y2="336" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1057.5" y="364" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">Billing and payment</text>
<text x="1057.5" y="388" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#16181F">gateway offline</text>
<line x1="971" y1="416" x2="1144" y2="416" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1057.5" y="442" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">Fallback, manual ledger</text>
<text x="1057.5" y="464" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8A8578">and later settlement</text>
<rect x="40" y="520" width="1120" height="170" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="41" y="534" width="5" height="142" rx="2.5" fill="#C4571C"/>
<text x="600" y="552" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#C4571C">What the guest actually remembers</text>
<text x="600" y="588" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#16181F">Guests rarely remember the incident, they remember whether staff knew what they were doing</text>
<rect x="70" y="612" width="330" height="30" rx="6" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="235" y="632" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#16181F">First-hours card per department</text>
<rect x="435" y="612" width="330" height="30" rx="6" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="632" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#16181F">One voice for the property</text>
<rect x="800" y="612" width="330" height="30" rx="6" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="965" y="632" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#16181F">Paper rates and registration</text>
<text x="600" y="672" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#5B564A">Manual fallbacks are written and rehearsed on a quiet shift, not invented at full occupancy</text>
<text x="600" y="728" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8A8578">Source, hospitality continuity · risk-place.org</text>
</svg>
