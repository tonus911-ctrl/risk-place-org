<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1376" width="1060" height="1376" role="img" aria-label="The hotel guest journey, its points of failure and the manual fallback at each stage">
<rect x="0" y="0" width="1060" height="1376" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">The guest journey, five stages and five failure points</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">At every stage a system can fail, and a manual fallback must be written and rehearsed first</text>

<rect x="8" y="112" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="196" r="25" fill="#C4571C"/>
<text x="60" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="108" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Booking and rates</text>
<text x="108" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Distribution channels</text>
<text x="108" y="224" font-family="Consolas, monospace" font-size="15" fill="#A34D19">POINT OF FAILURE</text>
<text x="290" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Booking channel down, rates frozen</text>
<text x="108" y="258" font-family="Consolas, monospace" font-size="15" fill="#A34D19">FALLBACK</text>
<text x="290" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">approved paper rate sheet</text>

<polygon points="53,286 67,286 60,298" fill="#C4571C"/>

<rect x="8" y="306" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="390" r="25" fill="#C4571C"/>
<text x="60" y="398" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="108" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Arrival and check-in</text>
<text x="108" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Property management</text>
<text x="108" y="418" font-family="Consolas, monospace" font-size="15" fill="#A34D19">POINT OF FAILURE</text>
<text x="290" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">PMS cannot assign or bill rooms</text>
<text x="108" y="452" font-family="Consolas, monospace" font-size="15" fill="#A34D19">FALLBACK</text>
<text x="290" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">paper registration cards</text>

<polygon points="53,480 67,480 60,492" fill="#C4571C"/>

<rect x="8" y="500" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="584" r="25" fill="#C4571C"/>
<text x="60" y="592" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="108" y="542" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Stay and room</text>
<text x="108" y="574" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Key cards and cooling</text>
<text x="108" y="612" font-family="Consolas, monospace" font-size="15" fill="#A34D19">POINT OF FAILURE</text>
<text x="290" y="612" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Key cards dead, cooling lost</text>
<text x="108" y="646" font-family="Consolas, monospace" font-size="15" fill="#A34D19">FALLBACK</text>
<text x="290" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">generator load priorities</text>

<polygon points="53,674 67,674 60,686" fill="#C4571C"/>

<rect x="8" y="694" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="778" r="25" fill="#C4571C"/>
<text x="60" y="786" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="736" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Restaurants and facilities</text>
<text x="108" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Point of sale and supply</text>
<text x="108" y="806" font-family="Consolas, monospace" font-size="15" fill="#A34D19">POINT OF FAILURE</text>
<text x="290" y="806" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Point of sale, laundry and supply interrupted</text>
<text x="108" y="840" font-family="Consolas, monospace" font-size="15" fill="#A34D19">FALLBACK</text>
<text x="290" y="840" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">pre-qualified alternate suppliers</text>

<polygon points="53,868 67,868 60,880" fill="#C4571C"/>

<rect x="8" y="888" width="1044" height="168" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="972" r="25" fill="#C4571C"/>
<text x="60" y="980" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="108" y="930" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Departure and payment</text>
<text x="108" y="962" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Checkout and settlement</text>
<text x="108" y="1000" font-family="Consolas, monospace" font-size="15" fill="#A34D19">POINT OF FAILURE</text>
<text x="290" y="1000" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Billing and payment gateway offline</text>
<text x="108" y="1034" font-family="Consolas, monospace" font-size="15" fill="#A34D19">FALLBACK</text>
<text x="290" y="1034" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">manual ledger and later settlement</text>

<rect x="8" y="1088" width="1044" height="224" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="9" y="1102" width="5" height="196" rx="2.5" fill="#C4571C"/>
<text x="530" y="1128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#C4571C">What the guest actually remembers</text>
<text x="530" y="1166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Guests rarely remember the incident, they remember whether staff knew what they were doing</text>
<rect x="40" y="1194" width="316" height="40" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="1220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">First-hours card per department</text>
<rect x="372" y="1194" width="316" height="40" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">One voice for the property</text>
<rect x="704" y="1194" width="316" height="40" rx="8" fill="#E7E2DA" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="862" y="1220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Paper rates and registration</text>
<text x="530" y="1284" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Manual fallbacks are written and rehearsed on a quiet shift, not invented at full occupancy</text>

<text x="530" y="1348" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Source, hospitality continuity · risk-place.org</text>
</svg>
