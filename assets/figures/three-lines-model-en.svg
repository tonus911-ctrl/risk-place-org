<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1400" width="1060" height="1400" role="img" aria-label="The three lines model — the governing body, management with its first and second line roles, and internal audit as independent assurance, showing who reports to whom">
<rect x="0" y="0" width="1060" height="1400" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Three roles, one board, and one independent opinion</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">The IIA model of 2020 describes responsibilities, not departments, and it names who reports to whom</text>

<!-- governing body -->
<rect x="8" y="112" width="1044" height="110" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="530" y="156" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Governing body — the board and its committees</text>
<text x="530" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Accepts accountability to stakeholders, sets the appetite, receives all three reports</text>

<!-- delegation arrows -->
<text x="270" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">delegates authority and resources</text>
<line x1="270" y1="258" x2="270" y2="274" stroke="#C4571C" stroke-width="2.5"/><polygon points="263,272 270,286 277,272" fill="#C4571C"/>
<text x="790" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">grants the mandate, protects independence</text>
<line x1="790" y1="258" x2="790" y2="274" stroke="#C4571C" stroke-width="2.5"/><polygon points="783,272 790,286 797,272" fill="#C4571C"/>

<text x="16" y="312" font-family="Consolas, monospace" font-size="15" fill="#C4571C">MANAGEMENT — OWNS THE RISK THE BUSINESS CREATES</text>

<!-- first line -->
<rect x="8" y="324" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="60" cy="374" r="25" fill="#C4571C"/>
<text x="60" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="108" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Owners of processes and services</text>
<line x1="108" y1="388" x2="1028" y2="388" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="108" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Runs the business and takes the decisions</text>
<text x="108" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Owns the risk and operates the controls</text>
<text x="108" y="468" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Writes and maintains its own plans</text>
<text x="108" y="494" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Reports upward through the executive</text>

<!-- second line -->
<rect x="8" y="536" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="586" r="25" fill="#C4571C"/>
<text x="60" y="594" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="108" y="578" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Risk, compliance and continuity functions</text>
<line x1="108" y1="600" x2="1028" y2="600" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="108" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Sets the method and the standards</text>
<text x="108" y="654" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Monitors, challenges, consolidates</text>
<text x="108" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Supports the first line, never replaces it</text>
<text x="108" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Reports upward through the executive</text>

<text x="16" y="772" font-family="Consolas, monospace" font-size="15" fill="#C4571C">INDEPENDENT ASSURANCE</text>

<!-- third line -->
<rect x="8" y="784" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="834" r="25" fill="#C4571C"/>
<text x="60" y="842" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="108" y="826" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Internal audit, independent by design</text>
<line x1="108" y1="848" x2="1028" y2="848" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="108" y="876" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Assures that the framework works</text>
<text x="108" y="902" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Reports to the audit committee</text>
<text x="108" y="928" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Does not design what it audits</text>
<text x="108" y="954" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Administrative link to the CEO only</text>

<!-- what the board should get -->
<text x="530" y="1026" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#C4571C">WHAT THE BOARD SHOULD GET FROM EACH LINE</text>

<rect x="8" y="1046" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1086" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">First line — what we run, what nearly failed</text>
<rect x="8" y="1122" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1162" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Second line — is the method followed</text>
<rect x="8" y="1198" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="1238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Third line — can the first two be believed</text>

<text x="530" y="1302" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">The 2020 model dropped the word defence. The lines are roles that collaborate, not walls that stack up.</text>
<text x="530" y="1334" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Independence is what makes the third line worth reading. Separation of duty is not the same as isolation.</text>
<text x="530" y="1374" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Based on the IIA Three Lines Model, 2020, which replaced the Three Lines of Defence · risk-place.org</text>
</svg>
