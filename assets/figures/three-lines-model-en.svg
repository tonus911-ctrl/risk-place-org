<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="The three lines model — the governing body, management with its first and second line roles, and internal audit as independent assurance, showing who reports to whom">
<rect x="0" y="0" width="1200" height="740" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">Three roles, one board, and one independent opinion</text>
<text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">The IIA model of 2020 describes responsibilities, not departments, and it names who reports to whom</text>
<rect x="40" y="108" width="1120" height="70" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="138" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#16181F">Governing body — the board and its committees</text>
<text x="600" y="162" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#5B564A">Accepts accountability to stakeholders, sets the appetite, receives all three reports</text>
<line x1="425" y1="186" x2="425" y2="206" stroke="#C4571C" stroke-width="2"/>
<polygon points="418,205 425,220 432,205" fill="#C4571C"/>
<text x="411" y="206" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#8A8578">delegates authority and resources</text>
<line x1="993" y1="186" x2="993" y2="206" stroke="#C4571C" stroke-width="2"/>
<polygon points="986,205 993,220 1000,205" fill="#C4571C"/>
<text x="979" y="206" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#8A8578">grants the mandate, protects independence</text>
<rect x="40" y="228" width="770" height="272" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="425" y="252" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#C4571C">MANAGEMENT — OWNS THE RISK THE BUSINESS CREATES</text>
<rect x="826" y="228" width="334" height="272" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="993" y="252" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#C4571C">INDEPENDENT ASSURANCE</text>
<rect x="60" y="266" width="352" height="216" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="236" cy="298" r="17" fill="#C4571C"/>
<text x="236" y="304" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">1</text>
<text x="236" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">Owners of processes</text>
<text x="236" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">and services</text>
<line x1="76" y1="376" x2="396" y2="376" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="236" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Runs the business and takes the decisions</text>
<text x="236" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Owns the risk and operates the controls</text>
<text x="236" y="444" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Writes and maintains its own plans</text>
<text x="236" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Reports upward through the executive</text>
<rect x="433" y="266" width="357" height="216" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="611.5" cy="298" r="17" fill="#C4571C"/>
<text x="611.5" y="304" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">2</text>
<text x="611.5" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">Risk, compliance and</text>
<text x="611.5" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">continuity functions</text>
<line x1="449" y1="376" x2="774" y2="376" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="611.5" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Sets the method and the standards</text>
<text x="611.5" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Monitors, challenges, consolidates</text>
<text x="611.5" y="444" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Supports the first line, never replaces it</text>
<text x="611.5" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Reports upward through the executive</text>
<rect x="846" y="266" width="294" height="216" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="993" cy="298" r="17" fill="#C4571C"/>
<text x="993" y="304" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF">3</text>
<text x="993" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">Internal audit</text>
<text x="993" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#16181F">independent by design</text>
<line x1="862" y1="376" x2="1124" y2="376" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="993" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Assures that the framework works</text>
<text x="993" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Reports to the audit committee</text>
<text x="993" y="444" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Does not design what it audits</text>
<text x="993" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5B564A">Administrative link to the CEO only</text>
<rect x="40" y="520" width="1120" height="96" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="544" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#C4571C">WHAT THE BOARD SHOULD GET FROM EACH LINE</text>
<rect x="60" y="556" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="235" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5B564A">First line — what we run, what nearly failed</text>
<rect x="425" y="556" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5B564A">Second line — is the method followed</text>
<rect x="790" y="556" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="965" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#16181F">Third line — can the first two be believed</text>
<text x="600" y="648" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">The 2020 model dropped the word defence. The lines are roles that collaborate, not walls that stack up.</text>
<text x="600" y="676" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8A8578">Independence is what makes the third line worth reading. Separation of duty is not the same as isolation.</text>
<text x="600" y="712" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8A8578">Based on the IIA Three Lines Model, 2020, which replaced the Three Lines of Defence · risk-place.org</text>
</svg>
