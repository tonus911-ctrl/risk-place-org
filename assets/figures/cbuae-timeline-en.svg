<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1300" width="1060" height="1300" role="img" aria-label="The one-year transitional period under Article 184 of Federal Decree-Law No. 6 of 2025, shown as four working windows ending at the 16 September 2026 deadline">
<rect x="0" y="0" width="1060" height="1300" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">One transitional year, four working windows</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Federal Decree-Law No. 6 of 2025 — the transitional period granted by Article 184</text>

<!-- anchor -->
<rect x="8" y="112" width="1044" height="104" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="126" width="5" height="76" rx="2.5" fill="#C4571C"/>
<text x="40" y="146" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">ARTICLE 184 · ONE-YEAR TRANSITIONAL PERIOD</text>
<text x="40" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">In force 16 September 2025 — status to be regularised by 16 September 2026</text>

<!-- axis -->
<line x1="48" y1="250" x2="48" y2="1076" stroke="#C4571C" stroke-width="2.5"/>
<polygon points="39,1072 48,1090 57,1072" fill="#C4571C"/>
<circle cx="48" cy="284" r="9" fill="#C4571C"/><line x1="57" y1="284" x2="88" y2="284" stroke="#C4571C" stroke-width="2"/>
<circle cx="48" cy="504" r="9" fill="#C4571C"/><line x1="57" y1="504" x2="88" y2="504" stroke="#C4571C" stroke-width="2"/>
<circle cx="48" cy="724" r="9" fill="#C4571C"/><line x1="57" y1="724" x2="88" y2="724" stroke="#C4571C" stroke-width="2"/>
<circle cx="48" cy="916" r="9" fill="#C4571C"/><line x1="57" y1="916" x2="88" y2="916" stroke="#C4571C" stroke-width="2"/>

<!-- window 1 -->
<rect x="88" y="250" width="964" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="288" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">Q4 2025 + Q1 2026</text>
<line x1="120" y1="306" x2="1020" y2="306" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Gap assessment against Article 7 and the new scope</text>
<text x="120" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">BIA refresh</text>
<text x="120" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Remediation plan approved</text>
<line x1="120" y1="414" x2="1020" y2="414" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Calendars are still free and findings need months to fix</text>

<!-- window 2 -->
<rect x="88" y="470" width="964" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="508" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">Q2 2026</text>
<line x1="120" y1="526" x2="1020" y2="526" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Plans rewritten and short</text>
<text x="120" y="588" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Technology recovery arrangements verified</text>
<text x="120" y="616" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">First full test with timings</text>
<line x1="120" y1="634" x2="1020" y2="634" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="658" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">A failed test here is a finding you fix, not a risk you carry</text>

<!-- window 3 -->
<rect x="88" y="690" width="964" height="172" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="728" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">JUL — AUG 2026</text>
<line x1="120" y1="746" x2="1020" y2="746" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="780" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Second test if the first produced material findings</text>
<text x="120" y="808" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Evidence pack assembled, every item dated</text>
<line x1="120" y1="826" x2="1020" y2="826" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="850" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">The August queue is real and sign-offs jam before the date</text>

<!-- window 4 -->
<rect x="88" y="882" width="964" height="172" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="120" y="920" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">1 — 16 SEPTEMBER 2026</text>
<line x1="120" y1="938" x2="1020" y2="938" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="972" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Buffer</text>
<text x="120" y="1000" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Nothing new starts here</text>
<line x1="120" y1="1018" x2="1020" y2="1018" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="120" y="1042" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Late fixes fail interviews and a quiet fortnight signals control</text>

<!-- deadline -->
<rect x="8" y="1110" width="1044" height="104" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<rect x="9" y="1124" width="5" height="76" rx="2.5" fill="#C4571C"/>
<text x="40" y="1144" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">16 SEPTEMBER 2026 · TRANSITIONAL PERIOD ENDS</text>
<text x="40" y="1182" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The Central Bank may extend at its discretion, nothing obliges it, and waiting for an extension is not a plan</text>

<text x="530" y="1252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Sources — Federal Decree-Law No. 6 of 2025, Article 184</text>
<text x="530" y="1276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">CBUAE Rulebook, Operational Risk Regulation and Standards, Article 7</text>
</svg>
