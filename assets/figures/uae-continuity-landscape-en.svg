<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1152" width="1060" height="1152" role="img" aria-label="Three layers of business continuity requirement in the UAE and who each layer binds, the contractual pressure on everyone else, and one common starting point">
<rect x="0" y="0" width="1060" height="1152" fill="#FDFBF7"/>

<text x="530" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Three layers of requirement, one starting point</text>
<text x="530" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Business continuity in the UAE — who is bound by what</text>

<!-- layer 1 -->
<rect x="8" y="104" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="40" y="138" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">MANDATORY</text>
<text x="40" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">The national standard</text>
<text x="1028" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="17" fill="#16181F">NCEMA 7000</text>
<line x1="40" y1="196" x2="1020" y2="196" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="40" y="224" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#5B564A">WHO IS BOUND</text>
<text x="40" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Federal and local government · Critical infrastructure operators · Their suppliers, via contract</text>
<text x="40" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Compliance is measured by audit</text>

<!-- layer 2 -->
<rect x="8" y="316" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="40" y="350" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">MANDATORY</text>
<text x="40" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">The Central Bank</text>
<text x="1028" y="388" text-anchor="end" font-family="Consolas, monospace" font-size="17" fill="#16181F">CBUAE Article 7</text>
<line x1="40" y1="408" x2="1020" y2="408" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="40" y="436" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#5B564A">WHO IS BOUND</text>
<text x="40" y="464" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Banks and financial institutions · Insurers · Payment service providers</text>
<text x="40" y="496" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Transition period to 16 September 2026</text>

<!-- layer 3 -->
<rect x="8" y="528" width="1044" height="196" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="40" y="562" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#5B564A">VOLUNTARY</text>
<text x="40" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">International standard</text>
<text x="1028" y="600" text-anchor="end" font-family="Consolas, monospace" font-size="17" fill="#16181F">ISO 22301</text>
<line x1="40" y1="620" x2="1020" y2="620" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="40" y="648" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#5B564A">WHO ASKS FOR IT</text>
<text x="40" y="676" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Government and large tenders · Parent companies · International clients</text>
<text x="40" y="708" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">No law compels it, contracts do</text>

<line x1="530" y1="732" x2="530" y2="756" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,754 530,768 537,754" fill="#C4571C"/>

<!-- contractual pressure -->
<rect x="8" y="776" width="1044" height="124" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="790" width="5" height="96" rx="2.5" fill="#C4571C"/>
<text x="40" y="822" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">And those bound by no regulator are bound by contracts</text>
<text x="40" y="856" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Tenders ask for evidence, the requirement flows down the contract chain, and</text>
<text x="40" y="882" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">interruption underwriting asks harder questions every year</text>

<line x1="530" y1="908" x2="530" y2="932" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,930 530,944 537,930" fill="#C4571C"/>

<!-- starting point -->
<rect x="8" y="952" width="1044" height="140" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="996" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">One starting point, whatever binds you</text>
<text x="530" y="1034" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Gap assessment, two to three weeks</text>
<text x="530" y="1064" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">then three to six months to a tested system</text>

<text x="530" y="1128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Sources — NCEMA 7000 · CBUAE Rulebook, Article 7 · Federal Decree-Law No. 6 of 2025</text>
</svg>
