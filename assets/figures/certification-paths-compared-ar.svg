<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1400" width="1060" height="1400" direction="rtl" role="img" aria-label="مقارنة ثلاثة مسارات للتأهيل في استمرارية الأعمال، معهد BCI ومعهد DRI وبرنامج ERGP واحدا تلو الآخر مع الحالات التي يناسبها كل مسار">
<rect x="0" y="0" width="1060" height="1400" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">ثلاثة مسارات إلى مؤهل في استمرارية الأعمال</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">منتجات مختلفة لا نسخ متنافسة من منتج واحد، طابق المسار مع حالتك أنت</text>
<rect x="8" y="112" width="1044" height="384" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="960.2" y="146" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">جمعية عضوية مهنية</text>
<text x="1006.7" y="186" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">BCI</text>
<text x="934.5" y="216" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">معهد استمرارية الأعمال</text>
<line x1="32" y1="238" x2="1028" y2="238" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="996.1" y="268" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">كيف ينال</text>
<text x="490.0" y="268" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">اختبار على مرجع معرفي منشور، ثم درجات على سنوات ممارسة موثقة</text>
<text x="989.4" y="300" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يعطيك</text>
<text x="555.5" y="300" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مؤهل محمول ودرجات عضوية ومجتمع مهني تنتمي إليه</text>
<text x="1011.8" y="332" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اللغة</text>
<text x="714.6" y="332" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الإنجليزية غالبا</text>
<line x1="32" y1="354" x2="1028" y2="354" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="987.1" y="384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">يناسبك حين</text>
<text x="839.8" y="416" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">يسمي إعلان وظيفة أو سياسة ترقية اسم المعهد</text>
<text x="882.4" y="444" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">تريد سلم درجات ينمو مع خبرة موثقة</text>
<text x="903.7" y="472" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">تتوقع العمل خارج منطقة الخليج</text>
<rect x="8" y="516" width="1044" height="384" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="969.2" y="550" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">جهة منح شهادات</text>
<text x="918.8" y="590" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">DRI International</text>
<text x="899.2" y="620" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">شهادات في ممارسة الاستمرارية</text>
<line x1="32" y1="642" x2="1028" y2="642" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="996.1" y="672" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">كيف ينال</text>
<text x="492.2" y="672" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">اختبار على ممارسات مهنية منشورة، ثم ملف خبرة تراجعه الجهة نفسها</text>
<text x="989.4" y="704" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يعطيك</text>
<text x="537.0" y="704" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مؤهل محمول ودرجات تتصاعد ومجتمع معتمدين حول العالم</text>
<text x="1011.8" y="736" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اللغة</text>
<text x="714.6" y="736" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الإنجليزية غالبا</text>
<line x1="32" y1="758" x2="1028" y2="758" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="987.1" y="788" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">يناسبك حين</text>
<text x="879.6" y="820" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">يفرز سوق عملك على حروف الشهادة</text>
<text x="857.2" y="848" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">تريد اختبارا وملف خبرة تراجعه جهة مستقلة</text>
<text x="885.2" y="876" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">يمول صاحب العمل هذا الطريق أصلا</text>
<rect x="8" y="920" width="1044" height="384" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="978.2" y="954" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">برنامج تطبيقي</text>
<text x="993.3" y="994" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">ERGP</text>
<text x="935.6" y="1024" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">حوكمة مرونة المؤسسة</text>
<line x1="32" y1="1046" x2="1028" y2="1046" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="996.1" y="1076" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">كيف ينال</text>
<text x="533.7" y="1076" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ست وحدات وستة مخرجات، ثم تقرير ختامي يناقش مع خبير</text>
<text x="989.4" y="1108" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يعطيك</text>
<text x="533.7" y="1108" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ست وثائق على نطاق مؤسستك وشهادة برقم في سجل عام</text>
<text x="1011.8" y="1140" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اللغة</text>
<text x="700.6" y="1140" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">العربية والإنجليزية</text>
<line x1="32" y1="1162" x2="1028" y2="1162" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="987.1" y="1192" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">يناسبك حين</text>
<text x="841.0" y="1224" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">أوراق مجلسك ومراسلات الجهة الرقابية بالعربية</text>
<text x="808.5" y="1252" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">تقييمك القادم يقرأ مقابل NCEMA 7000 وISO 22301</text>
<text x="874.6" y="1280" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">عليك أن تنتج الوثائق لمؤسستك بنفسك</text>
<text x="530" y="1360" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">لا مسار أفضل من الآخرين، الأفضل هو ما تطلبه حالتك</text>
</svg>
