<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" direction="rtl" role="img" aria-label="مقارنة ثلاثة مسارات للتأهيل في استمرارية الأعمال، معهد BCI ومعهد DRI وبرنامج ERGP جنبا إلى جنب مع الحالات التي يناسبها كل مسار">
<rect x="0" y="0" width="1200" height="740" fill="#FDFBF7"/>

<text x="600" y="48" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">ثلاثة مسارات إلى مؤهل في استمرارية الأعمال</text>
<text x="600" y="82" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">منتجات مختلفة لا نسخ متنافسة من منتج واحد، طابق المسار مع حالتك أنت</text>

<!-- المسار الأول على اليمين، BCI -->
<rect x="800" y="108" width="360" height="300" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="140" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">جمعية عضوية مهنية</text>
<text x="980" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="22" fill="#16181F">BCI</text>
<text x="980" y="198" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">معهد استمرارية الأعمال</text>
<line x1="824" y1="214" x2="1136" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="238" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">كيف ينال</text>
<text x="980" y="260" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">اختبار على مرجع معرفي منشور، ثم</text>
<text x="980" y="278" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">درجات على سنوات ممارسة موثقة</text>
<text x="980" y="304" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">ماذا يعطيك</text>
<text x="980" y="326" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">مؤهل محمول ودرجات عضوية</text>
<text x="980" y="344" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ومجتمع مهني تنتمي إليه</text>
<text x="980" y="368" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">اللغة</text>
<text x="980" y="390" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الإنجليزية غالبا</text>

<!-- المسار الثاني في الوسط، DRI -->
<rect x="420" y="108" width="360" height="300" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="140" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">جهة منح شهادات</text>
<text x="600" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="22" fill="#16181F">DRI International</text>
<text x="600" y="198" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">شهادات في ممارسة الاستمرارية</text>
<line x1="444" y1="214" x2="756" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="238" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">كيف ينال</text>
<text x="600" y="260" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">اختبار على ممارسات مهنية منشورة،</text>
<text x="600" y="278" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ثم ملف خبرة تراجعه الجهة نفسها</text>
<text x="600" y="304" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">ماذا يعطيك</text>
<text x="600" y="326" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">مؤهل محمول ودرجات تتصاعد</text>
<text x="600" y="344" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ومجتمع معتمدين حول العالم</text>
<text x="600" y="368" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">اللغة</text>
<text x="600" y="390" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الإنجليزية غالبا</text>

<!-- المسار الثالث على اليسار، ERGP -->
<rect x="40" y="108" width="360" height="300" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="140" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">برنامج تطبيقي</text>
<text x="220" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="22" fill="#16181F">ERGP</text>
<text x="220" y="198" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">حوكمة مرونة المؤسسة</text>
<line x1="64" y1="214" x2="376" y2="214" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="238" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">كيف ينال</text>
<text x="220" y="260" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ست وحدات وستة مخرجات، ثم تقرير</text>
<text x="220" y="278" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ختامي يناقش مع خبير</text>
<text x="220" y="304" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">ماذا يعطيك</text>
<text x="220" y="326" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">ست وثائق على نطاق مؤسستك</text>
<text x="220" y="344" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">وشهادة برقم في سجل عام</text>
<text x="220" y="368" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">اللغة</text>
<text x="220" y="390" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">العربية والإنجليزية</text>

<!-- أسهم نزولا إلى شريط الحالات -->
<line x1="980" y1="418" x2="980" y2="440" stroke="#C4571C" stroke-width="2"/><polygon points="974,439 980,450 986,439" fill="#C4571C"/>
<line x1="600" y1="418" x2="600" y2="440" stroke="#C4571C" stroke-width="2"/><polygon points="594,439 600,450 606,439" fill="#C4571C"/>
<line x1="220" y1="418" x2="220" y2="440" stroke="#C4571C" stroke-width="2"/><polygon points="214,439 220,450 226,439" fill="#C4571C"/>

<!-- حالات المسار الأول -->
<rect x="800" y="456" width="360" height="210" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="488" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">يناسبك حين</text>
<text x="980" y="516" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">يسمي إعلان وظيفة أو سياسة</text>
<text x="980" y="534" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">ترقية اسم المعهد</text>
<line x1="860" y1="550" x2="1100" y2="550" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="574" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">تريد سلم درجات ينمو</text>
<text x="980" y="592" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">مع خبرة موثقة</text>
<line x1="860" y1="608" x2="1100" y2="608" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="980" y="632" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">تتوقع العمل خارج</text>
<text x="980" y="650" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">منطقة الخليج</text>

<!-- حالات المسار الثاني -->
<rect x="420" y="456" width="360" height="210" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="488" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">يناسبك حين</text>
<text x="600" y="516" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">يفرز سوق عملك على</text>
<text x="600" y="534" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">حروف الشهادة</text>
<line x1="480" y1="550" x2="720" y2="550" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="574" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">تريد اختبارا وملف خبرة</text>
<text x="600" y="592" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">تراجعه جهة مستقلة</text>
<line x1="480" y1="608" x2="720" y2="608" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="632" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">يمول صاحب العمل</text>
<text x="600" y="650" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">هذا الطريق أصلا</text>

<!-- حالات المسار الثالث -->
<rect x="40" y="456" width="360" height="210" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="488" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">يناسبك حين</text>
<text x="220" y="516" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">أوراق مجلسك ومراسلات</text>
<text x="220" y="534" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">الجهة الرقابية بالعربية</text>
<line x1="100" y1="550" x2="340" y2="550" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="574" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">تقييمك القادم يقرأ مقابل</text>
<text x="220" y="592" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">NCEMA 7000 وISO 22301</text>
<line x1="100" y1="608" x2="340" y2="608" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="220" y="632" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">عليك أن تنتج الوثائق</text>
<text x="220" y="650" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">لمؤسستك بنفسك</text>

<text x="600" y="706" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">لا مسار أفضل من الآخرين، الأفضل هو ما تطلبه حالتك</text>
</svg>
