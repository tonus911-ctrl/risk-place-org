<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" direction="rtl" role="img" aria-label="المهلة الانتقالية لسنة واحدة بموجب المادة 184 من المرسوم بقانون اتحادي رقم 6 لسنة 2025، معروضة كأربع نوافذ عمل تنتهي في 16 سبتمبر 2026">
<rect x="0" y="0" width="1200" height="710" fill="#FDFBF7"/>

<text x="600" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">سنة انتقالية واحدة، وأربع نوافذ عمل</text>
<text x="600" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">المرسوم بقانون اتحادي رقم 6 لسنة 2025، المهلة الانتقالية التي منحتها المادة 184</text>

<!-- المرساة -->
<rect x="40" y="104" width="1120" height="78" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1154" y="116" width="5" height="54" rx="2.5" fill="#C4571C"/>
<text x="600" y="132" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#C4571C">المادة 184 · مهلة انتقالية سنة واحدة</text>
<text x="600" y="162" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#16181F">نفذ في 16 سبتمبر 2025، وتسوية الأوضاع حتى 16 سبتمبر 2026</text>

<!-- المحور -->
<line x1="1148" y1="228" x2="66" y2="228" stroke="#C4571C" stroke-width="2.5"/>
<polygon points="68,219 40,228 68,237" fill="#C4571C"/>
<circle cx="1027" cy="228" r="7" fill="#C4571C"/>
<circle cx="742" cy="228" r="7" fill="#C4571C"/>
<circle cx="457" cy="228" r="7" fill="#C4571C"/>
<circle cx="172" cy="228" r="7" fill="#C4571C"/>
<line x1="1027" y1="235" x2="1027" y2="258" stroke="#C4571C" stroke-width="2"/><polygon points="1020,257 1027,271 1034,257" fill="#C4571C"/>
<line x1="742" y1="235" x2="742" y2="258" stroke="#C4571C" stroke-width="2"/><polygon points="735,257 742,271 749,257" fill="#C4571C"/>
<line x1="457" y1="235" x2="457" y2="258" stroke="#C4571C" stroke-width="2"/><polygon points="450,257 457,271 464,257" fill="#C4571C"/>
<line x1="172" y1="235" x2="172" y2="258" stroke="#C4571C" stroke-width="2"/><polygon points="165,257 172,271 179,257" fill="#C4571C"/>

<!-- النافذة 1 -->
<rect x="895" y="278" width="265" height="240" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1027" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#C4571C">الربع الأخير 2025 والأول 2026</text>
<line x1="911" y1="340" x2="1144" y2="340" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1027" y="366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">فحص فجوات مقابل المادة 7</text>
<text x="1027" y="386" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">ونطاق القانون الجديد</text>
<text x="1027" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">تحديث تحليل الأثر</text>
<text x="1027" y="426" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">خطة معالجة معتمدة</text>
<line x1="911" y1="446" x2="1144" y2="446" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1027" y="470" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">التقويمات ما زالت متاحة</text>
<text x="1027" y="490" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">والملاحظات تحتاج شهورا</text>

<!-- النافذة 2 -->
<rect x="610" y="278" width="265" height="240" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="742" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#C4571C">الربع الثاني 2026</text>
<line x1="626" y1="340" x2="859" y2="340" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="742" y="366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">خطط معاد كتابتها وقصيرة</text>
<text x="742" y="386" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">ترتيبات تعاف تقني</text>
<text x="742" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">متحقق منها</text>
<text x="742" y="426" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">أول اختبار كامل بتوقيتات</text>
<line x1="626" y1="446" x2="859" y2="446" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="742" y="470" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">اختبار فاشل هنا ملاحظة تصلح</text>
<text x="742" y="490" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">لا خطر تحملونه لاحقا</text>

<!-- النافذة 3 -->
<rect x="325" y="278" width="265" height="240" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="457" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#C4571C">يوليو وأغسطس 2026</text>
<line x1="341" y1="340" x2="574" y2="340" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="457" y="366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">اختبار ثان إن أنتج الأول</text>
<text x="457" y="386" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">ملاحظات جوهرية</text>
<text x="457" y="406" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">حزمة الأدلة مجمعة</text>
<text x="457" y="426" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">وكل عنصر فيها مؤرخ</text>
<line x1="341" y1="446" x2="574" y2="446" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="457" y="470" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">طابور أغسطس حقيقي</text>
<text x="457" y="490" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">والتوقيعات تزدحم قبل الموعد</text>

<!-- النافذة 4 -->
<rect x="40" y="278" width="265" height="240" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="172" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#C4571C">1 إلى 16 سبتمبر 2026</text>
<line x1="56" y1="340" x2="289" y2="340" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="172" y="386" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">هامش أمان</text>
<text x="172" y="410" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">لا شيء جديد يبدأ هنا</text>
<line x1="56" y1="446" x2="289" y2="446" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="172" y="470" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">الإصلاح المتأخر يفشل</text>
<text x="172" y="490" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">في المقابلة، والهدوء سيطرة</text>

<!-- الموعد -->
<rect x="40" y="548" width="1120" height="78" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="1154" y="560" width="5" height="54" rx="2.5" fill="#C4571C"/>
<text x="600" y="576" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#C4571C">16 سبتمبر 2026 · انتهاء المهلة الانتقالية</text>
<text x="600" y="604" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14.5" fill="#5B564A">وللمصرف المركزي صلاحية تقديرية بالتمديد، ولا شيء يلزمه به، وانتظار التمديد ليس خطة</text>

<text x="600" y="672" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">المصادر، المرسوم بقانون اتحادي رقم 6 لسنة 2025، المادة 184 · كتاب قواعد المصرف المركزي، نظام ومعايير المخاطر التشغيلية، المادة 7</text>
</svg>
