<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1300" width="1060" height="1300" direction="rtl" role="img" aria-label="المهلة الانتقالية لسنة واحدة بموجب المادة 184 من المرسوم بقانون اتحادي رقم 6 لسنة 2025، معروضة كأربع نوافذ عمل تنتهي في 16 سبتمبر 2026">
<rect x="0" y="0" width="1060" height="1300" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">سنة انتقالية واحدة، وأربع نوافذ عمل</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">المرسوم بقانون اتحادي رقم 6 لسنة 2025، المهلة الانتقالية التي منحتها المادة 184</text>

<!-- المرساة -->
<rect x="8" y="112" width="1044" height="104" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="1046" y="126" width="5" height="76" rx="2.5" fill="#C4571C"/>
<text x="530" y="146" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">المادة 184 · مهلة انتقالية سنة واحدة</text>
<text x="530" y="184" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">نفذ في 16 سبتمبر 2025، وتسوية الأوضاع حتى 16 سبتمبر 2026</text>

<!-- المحور -->
<line x1="1012" y1="250" x2="1012" y2="1076" stroke="#C4571C" stroke-width="2.5"/>
<polygon points="1003,1072 1012,1090 1021,1072" fill="#C4571C"/>
<circle cx="1012" cy="284" r="9" fill="#C4571C"/><line x1="1003" y1="284" x2="972" y2="284" stroke="#C4571C" stroke-width="2"/>
<circle cx="1012" cy="504" r="9" fill="#C4571C"/><line x1="1003" y1="504" x2="972" y2="504" stroke="#C4571C" stroke-width="2"/>
<circle cx="1012" cy="724" r="9" fill="#C4571C"/><line x1="1003" y1="724" x2="972" y2="724" stroke="#C4571C" stroke-width="2"/>
<circle cx="1012" cy="916" r="9" fill="#C4571C"/><line x1="1003" y1="916" x2="972" y2="916" stroke="#C4571C" stroke-width="2"/>

<!-- النافذة 1 -->
<rect x="8" y="250" width="964" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="288" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الربع الأخير 2025 والأول 2026</text>
<line x1="40" y1="306" x2="940" y2="306" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="340" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">فحص فجوات مقابل المادة 7 ونطاق القانون الجديد</text>
<text x="490" y="368" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تحديث تحليل الأثر</text>
<text x="490" y="396" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">خطة معالجة معتمدة</text>
<line x1="40" y1="414" x2="940" y2="414" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="438" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">التقويمات ما زالت متاحة والملاحظات تحتاج شهورا</text>

<!-- النافذة 2 -->
<rect x="8" y="470" width="964" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="508" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الربع الثاني 2026</text>
<line x1="40" y1="526" x2="940" y2="526" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="560" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">خطط معاد كتابتها وقصيرة</text>
<text x="490" y="588" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ترتيبات تعاف تقني متحقق منها</text>
<text x="490" y="616" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أول اختبار كامل بتوقيتات</text>
<line x1="40" y1="634" x2="940" y2="634" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="658" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">اختبار فاشل هنا ملاحظة تصلح لا خطر تحملونه لاحقا</text>

<!-- النافذة 3 -->
<rect x="8" y="690" width="964" height="172" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="728" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يوليو وأغسطس 2026</text>
<line x1="40" y1="746" x2="940" y2="746" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="780" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">اختبار ثان إن أنتج الأول ملاحظات جوهرية</text>
<text x="490" y="808" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">حزمة الأدلة مجمعة وكل عنصر فيها مؤرخ</text>
<line x1="40" y1="826" x2="940" y2="826" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="850" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">طابور أغسطس حقيقي والتوقيعات تزدحم قبل الموعد</text>

<!-- النافذة 4 -->
<rect x="8" y="882" width="964" height="172" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="490" y="920" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">من 1 إلى 16 سبتمبر 2026</text>
<line x1="40" y1="938" x2="940" y2="938" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="972" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">هامش أمان</text>
<text x="490" y="1000" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لا شيء جديد يبدأ هنا</text>
<line x1="40" y1="1018" x2="940" y2="1018" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="490" y="1042" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">الإصلاح المتأخر يفشل في المقابلة، والهدوء سيطرة</text>

<!-- الموعد -->
<rect x="8" y="1110" width="1044" height="104" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<rect x="1046" y="1124" width="5" height="76" rx="2.5" fill="#C4571C"/>
<text x="530" y="1144" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">16 سبتمبر 2026 · انتهاء المهلة الانتقالية</text>
<text x="530" y="1182" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">وللمصرف المركزي صلاحية تقديرية بالتمديد، ولا شيء يلزمه به، وانتظار التمديد ليس خطة</text>

<text x="530" y="1252" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصادر، المرسوم بقانون اتحادي رقم 6 لسنة 2025، المادة 184</text>
<text x="530" y="1276" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">كتاب قواعد المصرف المركزي، نظام ومعايير المخاطر التشغيلية، المادة 7</text>
</svg>
