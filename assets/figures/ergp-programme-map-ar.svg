<text x="990" y="662" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">94 فصلا و24 مجموعة أسئلة تحقق ذاتي</text>
<rect x="426" y="606" width="348" height="76" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="638" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16" fill="#16181F">المشروع الختامي</text>
<text x="600" y="662" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تقرير بمستوى المجلس يراجع مع خبير البرنامج</text>
<rect x="36" y="606" width="348" height="76" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="210" y="638" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16" fill="#16181F">شهادة مرقمة</text>
<text x="210" y="662" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">في سجل علني يفحصه أي طرف ثالث</text>
<line x1="36" y1="593" x2="1164" y2="593" stroke="#E1DCD3" stroke-width="1.5"/>
<line x1="812" y1="644" x2="791" y2="644" stroke="#C4571C" stroke-width="2"/>
<polygon points="792,638 778,644 792,650" fill="#C4571C"/>
<line x1="422" y1="644" x2="401" y2="644" stroke="#C4571C" stroke-width="2"/>
<polygon points="402,638 388,644 402,650" fill="#C4571C"/>
<text x="600" y="716" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">الوحدات تغذي بعضها بعضا، وكل مخرج يدخل مؤسستك قبل أن ينتهي البرنامج</text>
