<line x1="422" y1="469" x2="401" y2="469" stroke="#C4571C" stroke-width="2"/>
<polygon points="402,463 388,469 402,475" fill="#C4571C"/>
<rect x="816" y="606" width="348" height="76" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
