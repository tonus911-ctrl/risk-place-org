<text x="600" y="522" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">يبقى في يدك</text>
<text x="600" y="544" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">مصفوفة مطابقة المؤسسة</text>
<text x="600" y="564" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">مع المعيارين الوطني والدولي</text>
