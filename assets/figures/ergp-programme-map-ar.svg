<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1276" width="1060" height="1276" direction="rtl" role="img" aria-label="خريطة برنامج ERGP، ست وحدات و94 فصلا وما يبقى في يد المشارك بعد كل وحدة، ثم المشروع الختامي والشهادة المرقمة في سجل علني">
<rect x="0" y="0" width="1060" height="1276" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">خريطة برنامج ERGP</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">ست وحدات و94 فصلا، وما يبقى في يد المشارك بعد كل وحدة</text>

<!-- الوحدة 1 -->
<rect x="8" y="112" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="168" r="25" fill="#C4571C"/>
<text x="1000" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="586" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">حوكمة المرونة ومجلس الإدارة</text>
<text x="116" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">19 فصلا</text>
<text x="880" y="190" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يبقى في يدك</text>
<text x="420" y="190" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سياسة حوكمة المرونة وخريطة أجهزة الحوكمة</text>
<polygon points="993,228 1007,228 1000,238" fill="#C4571C"/>

<!-- الوحدة 2 -->
<rect x="8" y="240" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="296" r="25" fill="#C4571C"/>
<text x="1000" y="304" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="586" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">من إدارة المخاطر إلى مرونة الأعمال</text>
<text x="116" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">15 فصلا</text>
<text x="880" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يبقى في يدك</text>
<text x="420" y="318" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سجل مخاطر المرونة بمؤشرات إنذار مبكر</text>
<polygon points="993,356 1007,356 1000,366" fill="#C4571C"/>

<!-- الوحدة 3 -->
<rect x="8" y="368" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="424" r="25" fill="#C4571C"/>
<text x="1000" y="432" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="586" y="410" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">تحليل الأثر واقتصاد التعافي</text>
<text x="116" y="410" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">15 فصلا</text>
<text x="880" y="446" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يبقى في يدك</text>
<text x="420" y="446" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تحليل أثر مكتمل بأهداف يمكن الدفاع عنها بالمال</text>
<polygon points="993,484 1007,484 1000,494" fill="#C4571C"/>

<!-- الوحدة 4 -->
<rect x="8" y="496" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="552" r="25" fill="#C4571C"/>
<text x="1000" y="560" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="586" y="538" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">إدارة الأزمات واتخاذ القرار</text>
<text x="116" y="538" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">15 فصلا</text>
<text x="880" y="574" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يبقى في يدك</text>
<text x="420" y="574" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">خطة استجابة للأزمات وسيناريو تمرين</text>
<polygon points="993,612 1007,612 1000,622" fill="#C4571C"/>

<!-- الوحدة 5 -->
<rect x="8" y="624" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="680" r="25" fill="#C4571C"/>
<text x="1000" y="688" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="586" y="666" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المتطلبات التنظيمية للمرونة</text>
<text x="116" y="666" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">15 فصلا</text>
<text x="880" y="702" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يبقى في يدك</text>
<text x="420" y="702" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مصفوفة مطابقة المؤسسة مع المعيارين الوطني والدولي</text>
<polygon points="993,740 1007,740 1000,750" fill="#C4571C"/>

<!-- الوحدة 6 -->
<rect x="8" y="752" width="1044" height="112" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="808" r="25" fill="#C4571C"/>
<text x="1000" y="816" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="586" y="794" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التأكيد والتقارير والنضج</text>
<text x="116" y="794" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">15 فصلا</text>
<text x="880" y="830" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يبقى في يدك</text>
<text x="420" y="830" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لوحة متابعة وقالب تقرير لمجلس الإدارة</text>

<line x1="8" y1="896" x2="1052" y2="896" stroke="#E1DCD3" stroke-width="1.5"/>

<!-- المحصلة 1 -->
<rect x="8" y="916" width="1044" height="88" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="954" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">ست وحدات وستة مخرجات</text>
<text x="530" y="984" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">94 فصلا و24 مجموعة أسئلة تحقق ذاتي</text>
<polygon points="523,1008 537,1008 530,1018" fill="#C4571C"/>

<!-- المحصلة 2 -->
<rect x="8" y="1020" width="1044" height="88" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="1058" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المشروع الختامي</text>
<text x="530" y="1088" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تقرير بمستوى المجلس يراجع مع خبير البرنامج</text>
<polygon points="523,1112 537,1112 530,1122" fill="#C4571C"/>

<!-- المحصلة 3 -->
<rect x="8" y="1124" width="1044" height="88" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="1162" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">شهادة مرقمة</text>
<text x="530" y="1192" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">في سجل علني يفحصه أي طرف ثالث</text>

<text x="530" y="1248" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">الوحدات تغذي بعضها بعضا، وكل مخرج يدخل مؤسستك قبل أن ينتهي البرنامج</text>
</svg>
