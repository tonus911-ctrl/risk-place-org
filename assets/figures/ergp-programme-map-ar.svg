<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" direction="rtl" role="img" aria-label="خريطة برنامج ERGP، ست وحدات و94 فصلا وما يبقى في يد المشارك بعد كل وحدة، ثم المشروع الختامي والشهادة المرقمة في سجل علني">
<rect x="0" y="0" width="1200" height="740" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">خريطة برنامج ERGP</text>
<text x="600" y="80" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">ست وحدات و94 فصلا، وما يبقى في يد المشارك بعد كل وحدة</text>
<rect x="816" y="112" width="348" height="222" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
