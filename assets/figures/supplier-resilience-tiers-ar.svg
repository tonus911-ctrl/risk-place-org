<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1390" width="1060" height="1390" direction="rtl" role="img" aria-label="انسياب واجب تقييم الموردين، وثلاثة مستويات من متطلبات الاستمرارية وما يطلب من كل مستوى">
<rect x="0" y="0" width="1060" height="1390" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">ثلاثة مستويات من الموردين، وثلاث حزم أدلة</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">حجم الدليل المطلوب يتبع أثر توقفكم على العميل، لا حجم شركتكم</text>

<rect x="8" y="112" width="1044" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مشغل بنية تحتية حيوية</text>
<text x="530" y="186" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">المعيار الوطني يلزمه بتقييم مورديه</text>
<polygon points="523,214 537,214 530,226" fill="#C4571C"/>

<rect x="8" y="232" width="1044" height="96" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="274" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المورد المباشر</text>
<text x="530" y="306" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">يجيب بالأدلة، لا بالنية</text>
<polygon points="523,334 537,334 530,346" fill="#C4571C"/>

<rect x="8" y="352" width="1044" height="96" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="530" y="394" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المورد من الباطن</text>
<text x="530" y="426" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">يسأل بدوره عن نقطة فشله</text>

<text x="530" y="486" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">واجب تقييم الموردين ينساب نزولا عبر العقود، لا عبر التفتيش</text>

<rect x="8" y="512" width="1044" height="296" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="880" y="564" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مورد حيوي</text>
<text x="880" y="596" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">توقفكم يوقف خط العميل</text>
<text x="560" y="558" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">حزمة الأدلة</text>
<text x="338" y="596" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ملخص استمرارية</text>
<text x="338" y="628" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">التزامات تعاف</text>
<text x="338" y="660" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تقرير تمرين مؤرخ</text>
<text x="338" y="692" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">خريطة الباطن</text>
<text x="338" y="724" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بروتوكول تواصل</text>
<text x="530" y="780" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">المشتري يطلب الحزمة كاملة، ويسأل عن تاريخ آخر تمرين وعن الملاحظات التي أغلقت</text>

<rect x="8" y="832" width="1044" height="232" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="880" y="884" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مورد مهم</text>
<text x="880" y="916" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">توقفكم يؤخر ولا يوقف</text>
<text x="560" y="878" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">حزمة الأدلة</text>
<text x="338" y="916" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ملخص من صفحتين</text>
<text x="338" y="948" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">التزامات تعاف</text>
<text x="338" y="980" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بروتوكول تواصل</text>
<text x="530" y="1036" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">ثلاثة مستندات تكفي، بشرط أن تكون أرقام التعافي مشتقة من تحليل أثر لا من التمني</text>

<rect x="8" y="1088" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="880" y="1140" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مورد عادي</text>
<text x="880" y="1172" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">بديل متاح خلال أيام</text>
<text x="560" y="1134" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">حزمة الأدلة</text>
<text x="338" y="1172" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">إقرار استمرارية</text>
<text x="338" y="1204" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تواصل الطوارئ</text>
<text x="530" y="1260" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">إقرار قصير وبيانات اتصال عاملة، والتركيز ينتقل إلى السعر والجودة</text>

<text x="530" y="1328" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">الحزمة نفسها تجهز في ستة إلى ثمانية أسابيع، وتدرج في أي تأهيل أو مناقصة</text>
<text x="530" y="1362" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصدر، تأهيل موردي أدنوك وبعد المرونة · risk-place.org</text>
</svg>
