<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" direction="rtl" role="img" aria-label="انسياب واجب تقييم الموردين، وثلاثة مستويات من متطلبات الاستمرارية وما يطلب من كل مستوى">
<rect x="0" y="0" width="1200" height="760" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">ثلاثة مستويات من الموردين، وثلاث حزم أدلة</text>
<text x="600" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">حجم الدليل المطلوب يتبع أثر توقفكم على العميل، لا حجم شركتكم</text>
<rect x="800" y="104" width="340" height="74" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="970" y="134" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">مشغل بنية تحتية حيوية</text>
<text x="970" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12" fill="#5B564A">المعيار الوطني يلزمه بتقييم مورديه</text>
<line x1="798" y1="141" x2="784" y2="141" stroke="#C4571C" stroke-width="2"/>
<polygon points="784,134 772,141 784,148" fill="#C4571C"/>
<rect x="430" y="104" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="134" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">المورد المباشر</text>
<text x="600" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12" fill="#5B564A">يجيب بالأدلة، لا بالنية</text>
<line x1="428" y1="141" x2="414" y2="141" stroke="#C4571C" stroke-width="2"/>
<polygon points="414,134 402,141 414,148" fill="#C4571C"/>
<rect x="60" y="104" width="340" height="74" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="230" y="134" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">المورد من الباطن</text>
<text x="230" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12" fill="#5B564A">يسأل بدوره عن نقطة فشله</text>
<text x="600" y="200" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">واجب تقييم الموردين ينساب نزولا عبر العقود، لا عبر التفتيش</text>
<rect x="40" y="222" width="1120" height="146" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<rect x="880" y="240" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1010" y="274" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#16181F">مورد حيوي</text>
<text x="1010" y="302" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">توقفكم يوقف</text>
<text x="1010" y="324" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">خط العميل</text>
<rect x="710" y="252" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="785" y="280" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">ملخص استمرارية</text>
<rect x="548" y="252" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="623" y="280" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">التزامات تعاف</text>
<rect x="386" y="252" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="461" y="280" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">تقرير تمرين مؤرخ</text>
<rect x="224" y="252" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="299" y="280" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">خريطة الباطن</text>
<rect x="62" y="252" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="137" y="280" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">بروتوكول تواصل</text>
<text x="460" y="330" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">المشتري يطلب الحزمة كاملة، ويسأل عن تاريخ آخر تمرين وعن الملاحظات التي أغلقت</text>
<rect x="40" y="382" width="1120" height="146" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="880" y="400" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1010" y="434" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#16181F">مورد مهم</text>
<text x="1010" y="462" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">توقفكم يؤخر</text>
<text x="1010" y="484" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">ولا يوقف</text>
<rect x="710" y="412" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="785" y="440" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">ملخص من صفحتين</text>
<rect x="548" y="412" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="623" y="440" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">التزامات تعاف</text>
<rect x="386" y="412" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="461" y="440" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">بروتوكول تواصل</text>
<text x="460" y="490" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">ثلاثة مستندات تكفي، بشرط أن تكون أرقام التعافي مشتقة من تحليل أثر لا من التمني</text>
<rect x="40" y="542" width="1120" height="146" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="880" y="560" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1010" y="594" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#16181F">مورد عادي</text>
<text x="1010" y="622" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">بديل متاح</text>
<text x="1010" y="644" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#5B564A">خلال أيام</text>
<rect x="710" y="572" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="785" y="600" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">إقرار استمرارية</text>
<rect x="548" y="572" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="623" y="600" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#16181F">تواصل الطوارئ</text>
<text x="460" y="650" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">إقرار قصير وبيانات اتصال عاملة، والتركيز ينتقل إلى السعر والجودة</text>
<text x="600" y="716" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الحزمة نفسها تجهز في ستة إلى ثمانية أسابيع، وتدرج في أي تأهيل أو مناقصة</text>
<text x="600" y="744" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">المصدر، تأهيل موردي أدنوك وبعد المرونة · risk-place.org</text>
</svg>
