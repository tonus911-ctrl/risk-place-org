<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1056" width="1060" height="1056" role="img" aria-label="Five stages from NCEMA 7000 training to proven competence: ground in the standard, work on your own processes, working artefacts, assessment, proven competence">
<rect x="0" y="0" width="1060" height="1056" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">From training to proven competence</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Five stages, and the evidence each one leaves behind</text>

<!-- stage 1 -->
<rect x="8" y="112" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="166" r="25" fill="#C4571C"/>
<text x="60" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="108" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Ground in the standard</text>
<text x="108" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Clauses, terms, scope. What is guidance and what is a shall.</text>
<text x="1028" y="190" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">3-4 hours</text>
<polygon points="53,226 67,226 60,238" fill="#C4571C"/>

<!-- stage 2 -->
<rect x="8" y="246" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="300" r="25" fill="#C4571C"/>
<text x="60" y="308" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="108" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Your own processes</text>
<text x="108" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Impact analysis on real activity, real dependencies.</text>
<text x="1028" y="324" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">8-10 hours</text>
<polygon points="53,360 67,360 60,372" fill="#C4571C"/>

<!-- stage 3 -->
<rect x="8" y="380" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="434" r="25" fill="#C4571C"/>
<text x="60" y="442" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="108" y="424" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Working artefacts</text>
<text x="108" y="458" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Targets in money. Plan skeleton with names. One scenario.</text>
<text x="1028" y="458" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">20-30 hours of work</text>
<polygon points="53,494 67,494 60,506" fill="#C4571C"/>

<!-- stage 4 -->
<rect x="8" y="514" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="568" r="25" fill="#C4571C"/>
<text x="60" y="576" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Assessment with a threshold</text>
<text x="108" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A test that can be failed, plus your own work defended.</text>
<text x="1028" y="592" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">2-3 hours</text>
<polygon points="53,628 67,628 60,640" fill="#C4571C"/>

<!-- stage 5 -->
<rect x="8" y="648" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="60" cy="702" r="25" fill="#C4571C"/>
<text x="60" y="710" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="108" y="692" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Proven competence</text>
<text x="108" y="726" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Named person, dated record, credential a third party checks.</text>
<text x="1028" y="726" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">revisited annually</text>

<!-- evidence panel -->
<rect x="8" y="782" width="1044" height="214" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="796" width="5" height="186" rx="2.5" fill="#C4571C"/>
<text x="530" y="818" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">What the path leaves behind</text>

<text x="44" y="866" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#C4571C">FOR THE AUDITOR</text>
<text x="380" y="866" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Competence records with names, dates, syllabus and result</text>

<text x="44" y="914" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#C4571C">FOR THE ORGANISATION</text>
<text x="380" y="914" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Impact analysis, recovery targets, plan and exercise report in use</text>

<text x="44" y="962" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#C4571C">FOR THE PERSON</text>
<text x="380" y="962" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A credential a third party can check, not a PDF with a border</text>

<text x="530" y="1030" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Awareness 1.5 h per person / practitioner 16-24 contact hours / 6-10 weeks elapsed for one practitioner</text>
</svg>
