<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 886" width="1060" height="886" role="img" aria-label="Critical clinical services and the maximum absence each one tolerates">
<rect x="0" y="0" width="1060" height="886" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Critical services and their tolerable absence</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Seven services ordered by how long a patient can wait before delay becomes harm</text>

<text x="198" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Critical service</text>
<text x="728" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Maximum tolerable absence, growing to the right</text>
<line x1="404" y1="144" x2="1024" y2="144" stroke="#E1DCD3" stroke-width="1.5"/>
<polygon points="1036,144 1024,138 1024,150" fill="#C4571C"/>

<rect x="8" y="162" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="197" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Emergency and resuscitation</text>
<rect x="404" y="179" width="56" height="22" rx="6" fill="#C4571C"/>
<rect x="472" y="176" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="557" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Minutes</text>

<rect x="8" y="232" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="267" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Intensive care and life support</text>
<rect x="404" y="249" width="56" height="22" rx="6" fill="#C4571C"/>
<rect x="472" y="246" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="557" y="266" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Minutes</text>

<rect x="8" y="302" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="337" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Operating theatres</text>
<rect x="404" y="319" width="137" height="22" rx="6" fill="#C4571C"/>
<rect x="553" y="316" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="638" y="336" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">One hour</text>

<rect x="8" y="372" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="407" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">EMR read-only access</text>
<rect x="404" y="389" width="185" height="22" rx="6" fill="#C4571C"/>
<rect x="601" y="386" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="686" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Two hours</text>

<rect x="8" y="442" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="477" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Laboratory and blood bank</text>
<rect x="404" y="459" width="249" height="22" rx="6" fill="#C4571C"/>
<rect x="665" y="456" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="750" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Four hours</text>

<rect x="8" y="512" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="547" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Pharmacy and dispensing</text>
<rect x="404" y="529" width="321" height="22" rx="6" fill="#C4571C"/>
<rect x="737" y="526" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="822" y="546" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Eight hours</text>

<rect x="8" y="582" width="380" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="198" y="617" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Outpatient clinics and billing</text>
<rect x="404" y="599" width="450" height="22" rx="6" fill="#C4571C"/>
<rect x="866" y="596" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="951" y="616" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Two days</text>

<rect x="8" y="666" width="1044" height="154" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="9" y="680" width="5" height="126" rx="2.5" fill="#C4571C"/>
<text x="530" y="708" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#C4571C">Illustrative for discussion, not a standard</text>
<text x="530" y="748" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Every provider derives its own figures in the business impact analysis,</text>
<text x="530" y="780" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">then clinical governance signs them off</text>

<text x="530" y="858" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Source, healthcare continuity · risk-place.org</text>
</svg>
