<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 886" width="1060" height="886" direction="rtl" role="img" aria-label="الخدمات السريرية الحرجة وأقصى مدة غياب يتحملها المريض">
<rect x="0" y="0" width="1060" height="886" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">الخدمات الحرجة وزمن غيابها المسموح</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">سبع خدمات مرتبة بالمدة التي يتحملها المريض قبل أن يتحول التأخير إلى ضرر</text>

