<rect x="8" y="666" width="1044" height="154" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="1046" y="680" width="5" height="126" rx="2.5" fill="#C4571C"/>
<text x="530" y="708" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#C4571C">الأرقام أمثلة للنقاش لا معايير</text>
<text x="530" y="748" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">كل منشأة تحسب أرقامها في تحليل أثر الأعمال،</text>
<text x="530" y="780" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ثم تعتمدها الحوكمة السريرية وتوقعها الإدارة الطبية</text>

<text x="530" y="858" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصدر، استمرارية الرعاية الصحية · risk-place.org</text>
