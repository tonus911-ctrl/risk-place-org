<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" direction="rtl" role="img" aria-label="اليوم الأول لهجوم برمجية الفدية موزعا على الساعات، ومعه القرارات الخمسة التي تحتاج صاحبا مسمى">
<rect x="0" y="0" width="1200" height="680" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">اليوم الأول، بالترتيب الذي تصل به القرارات</text>
<text x="600" y="82" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">العزل والإعلان والتشغيل المتدهور والتواصل وحفظ الأدلة، ولكل واحد منها صاحب قبل اليوم لا فيه</text>
<rect x="907" y="116" width="253" height="244" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1033.5" y="144" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">الساعة الأولى</text>
<text x="1033.5" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">التأكد والتصنيف</text>
<line x1="1144" y1="192" x2="923" y2="192" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1033.5" y="220" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">نقطة اتصال مناوبة تستلم البلاغ</text>
<text x="1033.5" y="242" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">فتح سجل القرارات بالتوقيتات</text>
<text x="1033.5" y="264" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">لا بريد جماعي ولا شائعات</text>
<text x="1033.5" y="286" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الساعة الأولى العامة</text>
<text x="1033.5" y="308" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">بروتوكول مستقل</text>
<line x1="901" y1="238" x2="892" y2="238" stroke="#C4571C" stroke-width="2"/>
<polygon points="892,231 877,238 892,245" fill="#C4571C"/>
<rect x="618" y="116" width="253" height="244" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="744.5" y="144" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">الساعات من 1 إلى 4</text>
<text x="744.5" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">العزل والإعلان</text>
<line x1="855" y1="192" x2="634" y2="192" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="744.5" y="220" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">فصل الشبكات والمواقع</text>
<text x="744.5" y="242" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">بصلاحية مكتوبة</text>
<text x="744.5" y="264" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تفعيل خطة الاستمرارية</text>
<text x="744.5" y="286" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">عند عتبتها المكتوبة</text>
<text x="744.5" y="308" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تجميد الاستعادة</text>
<text x="744.5" y="330" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">حتى تحفظ الأدلة</text>
<line x1="612" y1="238" x2="603" y2="238" stroke="#C4571C" stroke-width="2"/>
<polygon points="603,231 588,238 603,245" fill="#C4571C"/>
<rect x="329" y="116" width="253" height="244" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="455.5" y="144" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">الساعات من 4 إلى 12</text>
<text x="455.5" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">التشغيل والتواصل</text>
<line x1="566" y1="192" x2="345" y2="192" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="455.5" y="220" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الأنشطة ذات الأولوية</text>
<text x="455.5" y="242" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">تنتقل إلى الوضع اليدوي</text>
<text x="455.5" y="264" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">بيان أولي للموظفين</text>
<text x="455.5" y="286" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">وللعملاء</text>
<text x="455.5" y="308" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">المؤمن والمستشار القانوني</text>
<text x="455.5" y="330" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">على الخط بالفعل</text>
<line x1="323" y1="238" x2="314" y2="238" stroke="#C4571C" stroke-width="2"/>
<polygon points="314,231 299,238 314,245" fill="#C4571C"/>
<rect x="40" y="116" width="253" height="244" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="166.5" y="144" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#C4571C">الساعات من 12 إلى 24</text>
<text x="166.5" y="176" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17.5" fill="#16181F">الإخطار وإعادة البناء</text>
<line x1="277" y1="192" x2="56" y2="192" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="166.5" y="220" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">مسار الإخطار مع المستشار</text>
<text x="166.5" y="242" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">والساعة تبدأ بالاكتشاف</text>
<text x="166.5" y="264" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الاستعادة من نسخة</text>
<text x="166.5" y="286" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">أثبتها اختبار استعادة</text>
<text x="166.5" y="308" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">أي تواصل مع المهاجمين</text>
<text x="166.5" y="330" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">متروك للمختصين</text>
<rect x="40" y="388" width="1120" height="150" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="416" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">خمسة قرارات تحتاج اسما لا اجتماعا</text>
<rect x="932" y="432" width="208" height="84" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="1036" cy="454" r="13" fill="#C4571C"/>
<text x="1036" y="459" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF">1</text>
<text x="1036" y="485" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">العزل</text>
<text x="1036" y="506" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">صلاحية مكتوبة على مدار الساعة</text>
<rect x="704" y="432" width="208" height="84" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="808" cy="454" r="13" fill="#C4571C"/>
<text x="808" y="459" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF">2</text>
<text x="808" y="485" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">الإعلان</text>
<text x="808" y="506" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">عتبة محددة لا نقاش</text>
<rect x="476" y="432" width="208" height="84" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="580" cy="454" r="13" fill="#C4571C"/>
<text x="580" y="459" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF">3</text>
<text x="580" y="485" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">التشغيل المتدهور</text>
<text x="580" y="506" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">من خطط الوضع اليدوي</text>
<rect x="248" y="432" width="208" height="84" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="352" cy="454" r="13" fill="#C4571C"/>
<text x="352" y="459" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF">4</text>
<text x="352" y="485" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">التواصل</text>
<text x="352" y="506" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">صوت واحد وبيانات معدة سلفا</text>
<rect x="20" y="432" width="208" height="84" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="124" cy="454" r="13" fill="#C4571C"/>
<text x="124" y="459" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF">5</text>
<text x="124" y="485" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">حفظ الأدلة</text>
<text x="124" y="506" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">قبل استعادة أي شيء</text>
<rect x="40" y="558" width="1120" height="54" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="590" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#16181F">بطاقة من صفحة واحدة، خمسة قرارات وأصحاب ونواب وعتبات وأرقام، مغلفة ودون اتصال وفي ثلاثة مواقع</text>
<text x="600" y="650" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">الساعة تبدأ بالاكتشاف لا باجتماعكم الأول · risk-place.org</text>
</svg>
