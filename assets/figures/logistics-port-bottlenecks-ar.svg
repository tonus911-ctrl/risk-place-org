<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1394" width="1060" height="1394" direction="rtl" role="img" aria-label="سلسلة التسليم اللوجستي ومواضع الاختناق الأربعة وما يفتح كل اختناق وساعة الالتزامات">
<rect x="0" y="0" width="1060" height="1394" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">أين تختنق سلسلة التسليم، وما يفتح الاختناق</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">القطاع لا يخسر أصوله بل يخسر وصوله، والاختناق ممر أو نظام أو إذن</text>

<rect x="8" y="112" width="1044" height="88" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="156" r="25" fill="#C4571C"/>
<text x="1000" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="520" y="166" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المنشأ أو المصنع</text>

<polygon points="993,206 1007,206 1000,218" fill="#C4571C"/>

<rect x="8" y="226" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="302" r="25" fill="#C4571C"/>
<text x="1000" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="520" y="274" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">النقل البري</text>
<text x="880" y="314" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الاختناق</text>
<text x="520" y="314" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">إغلاق منطقة أو إغلاق مسار بري</text>
<text x="880" y="350" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما يفتح الاختناق</text>
<text x="520" y="350" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بديل بري مسعر سلفا ومحفز مكتوب للتحويل</text>

<polygon points="993,384 1007,384 1000,396" fill="#C4571C"/>

<rect x="8" y="404" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="480" r="25" fill="#C4571C"/>
<text x="1000" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="520" y="452" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الميناء أو المطار</text>
<text x="880" y="492" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الاختناق</text>
<text x="520" y="492" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ازدحام الميناء أو إغلاق المجال الجوي</text>
<text x="880" y="528" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما يفتح الاختناق</text>
<text x="520" y="528" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بوابة ثانية بعقد لا برسالة نوايا</text>

<polygon points="993,562 1007,562 1000,574" fill="#C4571C"/>

<rect x="8" y="582" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="658" r="25" fill="#C4571C"/>
<text x="1000" y="666" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="520" y="630" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التخليص الجمركي</text>
<text x="880" y="670" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الاختناق</text>
<text x="520" y="670" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">توقف الأنظمة ومنصات الجمارك</text>
<text x="880" y="706" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما يفتح الاختناق</text>
<text x="520" y="706" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">وضع متدهور بالورق ونسخة دون اتصال</text>

<polygon points="993,740 1007,740 1000,752" fill="#C4571C"/>

<rect x="8" y="760" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="836" r="25" fill="#C4571C"/>
<text x="1000" y="844" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="520" y="808" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المستودع</text>
<text x="880" y="848" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الاختناق</text>
<text x="520" y="848" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تعثر شريك، ناقل، مخلص، مستودع</text>
<text x="880" y="884" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما يفتح الاختناق</text>
<text x="520" y="884" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">شريك ثان مؤهل وعقد جاهز للتوقيع</text>

<polygon points="993,918 1007,918 1000,930" fill="#C4571C"/>

<rect x="8" y="938" width="1044" height="88" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="982" r="25" fill="#C4571C"/>
<text x="1000" y="990" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="520" y="992" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التسليم للعميل</text>

<rect x="8" y="1058" width="1044" height="272" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="1046" y="1072" width="5" height="244" rx="2.5" fill="#C4571C"/>
<text x="530" y="1098" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#C4571C">ساعة الالتزامات، ما ينكسر ومتى</text>
<rect x="814" y="1124" width="210" height="46" rx="8" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="919" y="1153" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#C4571C">بعد 12 ساعة</text>
<text x="400" y="1153" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سلسلة التبريد والشحن العاجل</text>
<rect x="814" y="1186" width="210" height="46" rx="8" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="919" y="1215" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#C4571C">بعد 24 ساعة</text>
<text x="400" y="1215" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">شحنات المشاريع المرتبطة بغرامات</text>
<rect x="814" y="1248" width="210" height="46" rx="8" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="919" y="1277" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#C4571C">بعد 72 ساعة</text>
<text x="400" y="1277" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">التدفق كله يعاد تسعيره وتوجيهه</text>

<text x="530" y="1366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المصدر، استمرارية اللوجستيات والموانئ · risk-place.org</text>
</svg>
