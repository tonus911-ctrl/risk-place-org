<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1550" width="1060" height="1550" direction="rtl" role="img" aria-label="الأقسام السبعة لخطة استمرارية الأعمال، ماذا يحتوي كل قسم وما اختبار الجودة الذي يجب أن يجتازه">
<rect x="0" y="0" width="1060" height="1550" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">سبعة أقسام، ولكل قسم اختبار يجب أن يجتازه</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">العمل أولا والمرجع لاحقا، ولا شيء لا يفيد هذه الليلة</text>
<rect x="8" y="112" width="1044" height="64" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="152" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">اختبار الثانية صباحا، على المناوب أن يجد عمل الثلاثين دقيقة التالية خلال تسعين ثانية</text>
<rect x="8" y="200" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1008" cy="238" r="25" fill="#C4571C"/>
<text x="1008" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="922.5" y="246" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التفعيل</text>
<line x1="32" y1="266" x2="960" y2="266" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="298" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="660.6" y="298" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">من يعلن الحادث وعلى أي مؤشرات</text>
<text x="983.2" y="330" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="656.1" y="330" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">صفحة واحدة يطبقها مناوب وحده ليلا</text>
<rect x="8" y="368" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1008" cy="406" r="25" fill="#C4571C"/>
<text x="1008" y="414" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="862.6" y="414" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الأدوار والصلاحيات</text>
<line x1="32" y1="434" x2="960" y2="434" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="466" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="629.2" y="466" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">إيقاف العمل وصرف المال والتصريح للخارج</text>
<text x="983.2" y="498" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="652.7" y="498" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لكل دور نائب ولا خطوة تحتاج اجتماعا</text>
<rect x="8" y="536" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1008" cy="574" r="25" fill="#C4571C"/>
<text x="1008" y="582" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="877.7" y="582" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الساعات الأولى</text>
<line x1="32" y1="602" x2="960" y2="602" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="634" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="665.0" y="634" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">قوائم تدقيق للساعات من 1 إلى 4</text>
<text x="983.2" y="666" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="666.7" y="666" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أفعال وأصحاب لا نصوص سياسات</text>
<rect x="8" y="704" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1008" cy="742" r="25" fill="#C4571C"/>
<text x="1008" y="750" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="881.0" y="750" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الحلول المؤقتة</text>
<line x1="32" y1="770" x2="960" y2="770" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="802" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="652.2" y="802" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">عمل يدوي وموردون بدلاء وموقع بديل</text>
<text x="983.2" y="834" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="670.1" y="834" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لكل حل مشغل وطاقة وحد زمني</text>
<rect x="8" y="872" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1008" cy="910" r="25" fill="#C4571C"/>
<text x="1008" y="918" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="921.4" y="918" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التعافي</text>
<line x1="32" y1="938" x2="960" y2="938" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="970" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="630.3" y="970" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">العودة وفق RTO وRPO بترتيب الاعتماديات</text>
<text x="983.2" y="1002" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="638.7" y="1002" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">متسق مع أرقام تحليل الأثر ومثبت باختبار</text>
<rect x="8" y="1040" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1008" cy="1078" r="25" fill="#C4571C"/>
<text x="1008" y="1086" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="917.4" y="1086" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التواصل</text>
<line x1="32" y1="1106" x2="960" y2="1106" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="1138" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="657.8" y="1138" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الموظفون والعملاء والجهات والإعلام</text>
<text x="983.2" y="1170" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="627.0" y="1170" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بيان أول جاهز خلال ساعة دون صياغة جديدة</text>
<rect x="8" y="1208" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1008" cy="1246" r="25" fill="#C4571C"/>
<text x="1008" y="1254" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">7</text>
<text x="839.6" y="1254" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">جهات الاتصال والموارد</text>
<line x1="32" y1="1274" x2="960" y2="1274" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="991.0" y="1306" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ماذا يحتوي</text>
<text x="652.2" y="1306" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أشخاص وموردون ومؤمنون ومنظمون</text>
<text x="983.2" y="1338" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">اختبار الجودة</text>
<text x="616.9" y="1338" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مؤرخة ومتحقق منها كل ربع ومتاحة دون اتصال</text>
<rect x="8" y="1400" width="1044" height="64" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="1440" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">الأقسام من 1 إلى 3، وهي المستخدمة تحت الضغط، تسع من 10 إلى 15 صفحة، وما عداها ملاحق</text>
<text x="530" y="1512" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">كتلة من 120 صفحة ليست خطة بل خزانة ملفات لها غلاف · risk-place.org</text>
</svg>
