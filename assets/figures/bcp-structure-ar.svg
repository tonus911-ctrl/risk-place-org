<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" direction="rtl" role="img" aria-label="الأقسام السبعة لخطة استمرارية الأعمال، ماذا يحتوي كل قسم وما اختبار الجودة الذي يجب أن يجتازه">
<rect x="0" y="0" width="1200" height="760" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">سبعة أقسام، ولكل قسم اختبار يجب أن يجتازه</text>
<text x="600" y="82" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">العمل أولا والمرجع لاحقا، ولا شيء لا يفيد هذه الليلة</text>
<rect x="40" y="104" width="1120" height="46" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="133" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14.5" fill="#16181F">اختبار الثانية صباحا، على المناوب أن يجد عمل الثلاثين دقيقة التالية خلال تسعين ثانية</text>
<text x="1088" y="178" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">القسم</text>
<text x="788" y="178" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">ماذا يحتوي</text>
<text x="428" y="178" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">اختبار الجودة</text>
<rect x="40" y="192" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="1124" cy="220" r="15" fill="#C4571C"/>
<text x="1124" y="225" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">1</text>
<text x="1088" y="225" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">التفعيل</text>
<line x1="804" y1="204" x2="804" y2="236" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="225" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">من يعلن الحادث وعلى أي مؤشرات</text>
<line x1="444" y1="204" x2="444" y2="236" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="225" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">صفحة واحدة يطبقها مناوب وحده ليلا</text>
<rect x="40" y="256" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1124" cy="284" r="15" fill="#C4571C"/>
<text x="1124" y="289" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">2</text>
<text x="1088" y="289" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">الأدوار والصلاحيات</text>
<line x1="804" y1="268" x2="804" y2="300" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="289" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">إيقاف العمل وصرف المال والتصريح للخارج</text>
<line x1="444" y1="268" x2="444" y2="300" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="289" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">لكل دور نائب ولا خطوة تحتاج اجتماعا</text>
<rect x="40" y="320" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1124" cy="348" r="15" fill="#C4571C"/>
<text x="1124" y="353" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">3</text>
<text x="1088" y="353" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">الساعات الأولى</text>
<line x1="804" y1="332" x2="804" y2="364" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="353" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">قوائم تدقيق للساعات من 1 إلى 4</text>
<line x1="444" y1="332" x2="444" y2="364" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="353" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">أفعال وأصحاب لا نصوص سياسات</text>
<rect x="40" y="384" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1124" cy="412" r="15" fill="#C4571C"/>
<text x="1124" y="417" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">4</text>
<text x="1088" y="417" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">الحلول المؤقتة</text>
<line x1="804" y1="396" x2="804" y2="428" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="417" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">عمل يدوي وموردون بدلاء وموقع بديل</text>
<line x1="444" y1="396" x2="444" y2="428" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="417" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">لكل حل مشغل وطاقة وحد زمني</text>
<rect x="40" y="448" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1124" cy="476" r="15" fill="#C4571C"/>
<text x="1124" y="481" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">5</text>
<text x="1088" y="481" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">التعافي</text>
<line x1="804" y1="460" x2="804" y2="492" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="481" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">العودة وفق RTO وRPO بترتيب الاعتماديات</text>
<line x1="444" y1="460" x2="444" y2="492" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="481" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">متسق مع أرقام تحليل الأثر ومثبت باختبار</text>
<rect x="40" y="512" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1124" cy="540" r="15" fill="#C4571C"/>
<text x="1124" y="545" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">6</text>
<text x="1088" y="545" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">التواصل</text>
<line x1="804" y1="524" x2="804" y2="556" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="545" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">الموظفون والعملاء والجهات والإعلام</text>
<line x1="444" y1="524" x2="444" y2="556" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="545" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">بيان أول جاهز خلال ساعة دون صياغة جديدة</text>
<rect x="40" y="576" width="1120" height="56" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<circle cx="1124" cy="604" r="15" fill="#C4571C"/>
<text x="1124" y="609" text-anchor="middle" direction="rtl" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">7</text>
<text x="1088" y="609" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#16181F">جهات الاتصال والموارد</text>
<line x1="804" y1="588" x2="804" y2="620" stroke="#E1DCD3" stroke-width="1"/>
<text x="788" y="609" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#5B564A">أشخاص وموردون ومؤمنون ومنظمون</text>
<line x1="444" y1="588" x2="444" y2="620" stroke="#E1DCD3" stroke-width="1"/>
<text x="428" y="609" text-anchor="end" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#8A8578">مؤرخة ومتحقق منها كل ربع ومتاحة دون اتصال</text>
<rect x="40" y="646" width="1120" height="46" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="675" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="14" fill="#16181F">الأقسام من 1 إلى 3، وهي المستخدمة تحت الضغط، تسع من 10 إلى 15 صفحة، وما عداها ملاحق</text>
<text x="600" y="730" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">كتلة من 120 صفحة ليست خطة بل خزانة ملفات لها غلاف · risk-place.org</text>
</svg>
