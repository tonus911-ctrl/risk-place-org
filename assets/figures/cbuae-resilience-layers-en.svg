<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1272" width="1060" height="1272" role="img" aria-label="The two regulatory layers in the UAE: the CBUAE Rulebook with Article 7, and Federal Decree-Law No. 6 of 2025; below them five stages of the evidence file from documented policy to board reporting">
<rect x="0" y="0" width="1060" height="1272" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Two regulatory layers, one evidence trail</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">What regulates operational resilience in the UAE, and what the examiner expects to find</text>

<!-- layer one -->
<rect x="8" y="112" width="1044" height="124" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="126" width="5" height="96" rx="2.5" fill="#C4571C"/>
<text x="40" y="146" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">LAYER ONE · IN FORCE NOW</text>
<text x="40" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">CBUAE Rulebook — Operational Risk Regulation and Standards</text>
<text x="40" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Article 7 — Disaster Recovery and Business Continuity Management · applies to licensed banks</text>

<!-- layer two -->
<rect x="8" y="252" width="1044" height="124" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="266" width="5" height="96" rx="2.5" fill="#C4571C"/>
<text x="40" y="286" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">LAYER TWO · TRANSITION DEADLINE 16 SEPTEMBER 2026</text>
<text x="40" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Federal Decree-Law No. 6 of 2025</text>
<text x="40" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Issued 8 September 2025, effective 16 September 2025 · Article 149 · Article 184</text>

<text x="530" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">What the examiner expects to find in the file</text>

<!-- stage 1 -->
<rect x="8" y="446" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="500" r="25" fill="#C4571C"/>
<text x="60" y="508" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="108" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Documented BCM policy</text>
<text x="108" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Signed, current, roles and authorities</text>
<polygon points="53,558 67,558 60,568" fill="#C4571C"/>

<!-- stage 2 -->
<rect x="8" y="570" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="624" r="25" fill="#C4571C"/>
<text x="60" y="632" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="108" y="614" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">BIA and risk assessment</text>
<text x="108" y="648" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Ongoing, refreshed as the business changes</text>
<polygon points="53,682 67,682 60,692" fill="#C4571C"/>

<!-- stage 3 -->
<rect x="8" y="694" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="748" r="25" fill="#C4571C"/>
<text x="60" y="756" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="108" y="738" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">BCP and disaster recovery</text>
<text x="108" y="772" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Critical functions covered end to end</text>
<polygon points="53,806 67,806 60,816" fill="#C4571C"/>

<!-- stage 4 -->
<rect x="8" y="818" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="872" r="25" fill="#C4571C"/>
<text x="60" y="880" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="862" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Testing, annual minimum</text>
<text x="108" y="896" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Or whenever operations materially change</text>
<polygon points="53,930 67,930 60,940" fill="#C4571C"/>

<!-- stage 5 -->
<rect x="8" y="942" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="60" cy="996" r="25" fill="#C4571C"/>
<text x="60" y="1004" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="108" y="986" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Evidence and board reporting</text>
<text x="108" y="1020" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A dated file, ready for examination</text>

<!-- proportionality -->
<rect x="8" y="1074" width="1044" height="116" rx="10" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="9" y="1088" width="5" height="88" rx="2.5" fill="#C4571C"/>
<text x="40" y="1108" font-family="Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#A34D19">PROPORTIONALITY</text>
<text x="40" y="1142" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Requirements scale with the risk profile, nature, size and complexity of the</text>
<text x="40" y="1168" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">institution — small does not mean exempt</text>

<text x="530" y="1224" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Sources — CBUAE Rulebook, Operational Risk Regulation and Standards, Article 7</text>
<text x="530" y="1248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">Federal Decree-Law No. 6 of 2025, Articles 149 and 184</text>
</svg>
