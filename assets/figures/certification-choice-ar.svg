<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1118" width="1060" height="1118" direction="rtl" role="img" aria-label="اختيار شهادة في استمرارية الأعمال، مؤهل يحمله الشخص مقابل شهادة تحملها المؤسسة، ثم خمسة معايير هي العمق والتقييم والمخرجات والاعتراف وقابلية التحقق">
<rect x="0" y="0" width="1060" height="1118" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">اختيار شهادة في استمرارية الأعمال</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">كلمة واحدة تغطي منتجين مختلفين، حدد ما تحتاجه ثم اختبر البرنامج بالمعايير نفسها</text>

<!-- اللوحة اليمنى، الشهادة للشخص -->
<rect x="544" y="112" width="508" height="266" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="798" y="148" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">تصدر لشخص باسمه</text>
<text x="798" y="188" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="24" fill="#16181F">مؤهل تحمله معك أنت</text>
<text x="798" y="226" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">تمنحه جمعية مهنية أو جهة تملك برنامج تأهيل أو</text>
<text x="798" y="250" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">مركز تدريب، بعد اختبار تسجل نتيجته.</text>
<text x="798" y="284" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">يثبت أن منهجا غطي وأن اختبارا اجتيز، وأحيانا</text>
<text x="798" y="308" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">سنوات ممارسة يتحقق منها طرف ثالث.</text>
<line x1="568" y1="330" x2="1028" y2="330" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="798" y="358" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">لا يثبت أن خطط شركتك تعمل</text>

<!-- اللوحة اليسرى، الشهادة للمؤسسة -->
<rect x="8" y="112" width="508" height="266" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="262" y="148" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">تصدر لكيان قانوني</text>
<text x="262" y="188" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="24" fill="#16181F">شهادة تحملها الشركة</text>
<text x="262" y="226" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">تصدرها جهة منح شهادات بعد تدقيق، لنطاق محدد</text>
<text x="262" y="250" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">ومدة صلاحية معلومة، مع تدقيق مراقبة دوري.</text>
<text x="262" y="284" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">تثبت أن نظام الإدارة فحص مقابل معيار داخل</text>
<text x="262" y="308" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16.5" fill="#3F3B33">ذلك النطاق وحده.</text>
<line x1="32" y1="330" x2="492" y2="330" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="262" y="358" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">لا يثبت أن أي موظف بعينه كفء</text>

<!-- سهمان نزولا إلى شريط المعايير -->
<line x1="798" y1="390" x2="798" y2="414" stroke="#C4571C" stroke-width="2.5"/><polygon points="791,412 798,426 805,412" fill="#C4571C"/>
<line x1="262" y1="390" x2="262" y2="414" stroke="#C4571C" stroke-width="2.5"/><polygon points="255,412 262,426 269,412" fill="#C4571C"/>

<text x="530" y="462" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="21" fill="#16181F">أيا كان اختيارك، اختبر البرنامج بالمعايير الخمسة</text>

<!-- المعيار 1 -->
<rect x="8" y="486" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="540" r="25" fill="#C4571C"/>
<text x="1000" y="548" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="606" y="530" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">العمق</text>
<text x="606" y="564" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ساعات التدريس، والعمل الذي تنجزه بين الجلسات.</text>
<text x="136" y="564" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إشارة خطر، شهادة في يوم</text>

<!-- المعيار 2 -->
<rect x="8" y="606" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="660" r="25" fill="#C4571C"/>
<text x="1000" y="668" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="606" y="650" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التقييم</text>
<text x="606" y="684" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">عتبة يمكن الرسوب فيها، وإنسان يصحح ما أنتجته أنت.</text>
<text x="136" y="684" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إشارة خطر، لا أحد يرسب</text>

<!-- المعيار 3 -->
<rect x="8" y="726" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="780" r="25" fill="#C4571C"/>
<text x="1000" y="788" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="606" y="770" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">المخرجات</text>
<text x="606" y="804" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ما يخرج معك من القاعة، مبني على نطاقك أنت لا على حالة افتراضية.</text>
<text x="136" y="804" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إشارة خطر، شرائح فقط</text>

<!-- المعيار 4 -->
<rect x="8" y="846" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="900" r="25" fill="#C4571C"/>
<text x="1000" y="908" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="606" y="890" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الاعتراف</text>
<text x="606" y="924" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">من يقبلها فعلا، اطلب أسماء جهات ومناقصات لا صفات عامة.</text>
<text x="136" y="924" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إشارة خطر، ادعاء فضفاض</text>

<!-- المعيار 5 -->
<rect x="8" y="966" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1000" cy="1020" r="25" fill="#C4571C"/>
<text x="1000" y="1028" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="606" y="1010" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">قابلية التحقق</text>
<text x="606" y="1044" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">رقم فريد وتحقق علني وقاعدة للتجديد أو لانتهاء الصلاحية.</text>
<text x="136" y="1044" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">إشارة خطر، لا سبيل للتحقق</text>

<text x="530" y="1102" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">إذا سقط البرنامج في اثنين من الخمسة فما تشتريه ورقة بإطار لا مؤهلا</text>
</svg>
