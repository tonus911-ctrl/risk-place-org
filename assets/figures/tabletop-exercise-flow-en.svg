<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The three stages of a tabletop exercise, design before the day, the room on the day, and findings closed after it">
<rect x="0" y="0" width="1200" height="700" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">A tabletop exercise, from design to closed findings</text>
<text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Preparation decides what the exercise can find, the room decides how honestly, the debrief decides what changes</text>
<rect x="40" y="116" width="352" height="244" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="216" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#C4571C">BEFORE</text>
<text x="216" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Design the scenario</text>
<line x1="58" y1="198" x2="374" y2="198" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="216" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">The worst realistic day, not the worst one</text>
<text x="216" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">A timeline of 6 to 10 injects at intervals</text>
<text x="216" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Constraints written honestly, not politely</text>
<text x="216" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">An answer key taken from the plan itself</text>
<line x1="397" y1="238" x2="405" y2="238" stroke="#C4571C" stroke-width="2"/>
<polygon points="405,231 419,238 405,245" fill="#C4571C"/>
<rect x="424" y="116" width="352" height="244" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#C4571C">ON THE DAY</text>
<text x="600" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Run the room</text>
<line x1="442" y1="198" x2="758" y2="198" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">The real decision holders, not delegates</text>
<text x="600" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">2 to 3 hours and the clock never stops</text>
<text x="600" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">The facilitator asks and never answers</text>
<text x="600" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">A scribe logs times and disagreements</text>
<line x1="781" y1="238" x2="789" y2="238" stroke="#C4571C" stroke-width="2"/>
<polygon points="789,231 803,238 789,245" fill="#C4571C"/>
<rect x="808" y="116" width="352" height="244" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="984" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#C4571C">AFTER</text>
<text x="984" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Close the findings</text>
<line x1="826" y1="198" x2="1142" y2="198" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="984" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">A report of 2 to 4 pages within a week</text>
<text x="984" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">The top three findings closed first</text>
<text x="984" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">The plan amended where it actually broke</text>
<text x="984" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Evidence kept, it is what auditors want</text>
<rect x="40" y="386" width="1120" height="54" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#16181F">Every stalled discussion is itself a finding — nobody owns this decision — log it and move on</text>
<text x="600" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">The three things a document cannot test</text>
<rect x="40" y="506" width="352" height="110" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="216" y="546" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#16181F">Authority</text>
<line x1="100" y1="562" x2="332" y2="562" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="216" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Does the holder know the limit</text>
<rect x="424" y="506" width="352" height="110" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="546" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#16181F">Handoffs</text>
<line x1="484" y1="562" x2="716" y2="562" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="600" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Does the next person receive it</text>
<rect x="808" y="506" width="352" height="110" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="984" y="546" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#16181F">Workarounds</text>
<line x1="868" y1="562" x2="1100" y2="562" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="984" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Do they exist outside the page</text>
<text x="600" y="664" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8A8578">An exercise that ends with «no major issues» has not tested anything · risk-place.org</text>
</svg>
