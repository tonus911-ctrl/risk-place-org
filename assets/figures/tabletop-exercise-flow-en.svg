<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1396" width="1060" height="1396" role="img" aria-label="The three stages of a tabletop exercise, design before the day, the room on the day, and findings closed after it">
<rect x="0" y="0" width="1060" height="1396" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">A tabletop exercise, from design to closed findings</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">Preparation decides what the exercise can find, the room decides how honestly,</text>
<text x="530" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">the debrief decides what changes</text>
<rect x="8" y="138" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="32" y="156" width="152" height="32" rx="16" fill="#C4571C"/>
<text x="108" y="179" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">BEFORE</text>
<text x="208" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Design the scenario</text>
<line x1="32" y1="202" x2="1028" y2="202" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The worst realistic day, not the worst one</text>
<text x="32" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A timeline of 6 to 10 injects at intervals</text>
<text x="32" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Constraints written honestly, not politely</text>
<text x="32" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">An answer key taken from the plan itself</text>
<line x1="530" y1="344" x2="530" y2="358" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,356 530,370 537,356" fill="#C4571C"/>
<rect x="8" y="378" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<rect x="32" y="396" width="152" height="32" rx="16" fill="#C4571C"/>
<text x="108" y="419" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">ON THE DAY</text>
<text x="208" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Run the room</text>
<line x1="32" y1="442" x2="1028" y2="442" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The real decision holders, not delegates</text>
<text x="32" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">2 to 3 hours and the clock never stops</text>
<text x="32" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The facilitator asks and never answers</text>
<text x="32" y="550" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A scribe logs times and disagreements</text>
<line x1="530" y1="584" x2="530" y2="598" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,596 530,610 537,596" fill="#C4571C"/>
<rect x="8" y="618" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="32" y="636" width="152" height="32" rx="16" fill="#C4571C"/>
<text x="108" y="659" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">AFTER</text>
<text x="208" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Close the findings</text>
<line x1="32" y1="682" x2="1028" y2="682" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="712" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A report of 2 to 4 pages within a week</text>
<text x="32" y="738" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The top three findings closed first</text>
<text x="32" y="764" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">The plan amended where it actually broke</text>
<text x="32" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Evidence kept, it is what auditors want</text>
<rect x="8" y="858" width="1044" height="80" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="906" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Every stalled discussion is itself a finding — nobody owns this decision — log it and move on</text>
<text x="530" y="986" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">The three things a document cannot test</text>
<rect x="8" y="1012" width="1044" height="84" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="1064" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Authority</text>
<text x="1028" y="1064" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Does the holder know the limit</text>
<rect x="8" y="1112" width="1044" height="84" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="1164" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Handoffs</text>
<text x="1028" y="1164" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Does the next person receive it</text>
<rect x="8" y="1212" width="1044" height="84" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="1264" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Workarounds</text>
<text x="1028" y="1264" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Do they exist outside the page</text>
<text x="530" y="1356" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">An exercise that ends with «no major issues» has not tested anything · risk-place.org</text>
</svg>
