<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1590" width="1060" height="1590" direction="rtl" role="img" aria-label="مقارنة بين مؤشر الأداء الرئيسي ومؤشر المخاطر الرئيسي، مع عتبة برتقالية وعتبة حمراء على مقياس واحد والتصعيد المطلوب في كل حالة">
<rect x="0" y="0" width="1060" height="1590" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">مؤشران مختلفان لسؤالين مختلفين</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">مؤشر الأداء يخبرك بما تحقق فعلا، ومؤشر المخاطر ينبهك إلى خطر يتحرك بينما يبقى وقت للتصرف</text>
<rect x="8" y="112" width="1044" height="248" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="956.3" y="146" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">مؤشر الأداء الرئيسي</text>
<text x="915.4" y="186" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">هل سلمنا ما وعدنا به</text>
<line x1="32" y1="206" x2="1028" y2="206" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="1008.4" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يقيس</text>
<text x="716.5" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">ناتجا أنتجه العمل بالفعل</text>
<text x="1010.1" y="270" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الأفق</text>
<text x="709.8" y="270" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">متأخر غالبا، يؤكد ما مضى</text>
<text x="1009.0" y="302" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يملكه</text>
<text x="698.6" y="302" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">المدير المسؤول عن التسليم</text>
<text x="992.7" y="334" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">عند تحركه</text>
<text x="669.4" y="334" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يفسر الانحراف في اجتماع المراجعة</text>
<rect x="8" y="380" width="1044" height="248" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="944.0" y="414" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">مؤشر المخاطر الرئيسي</text>
<text x="898.1" y="454" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">هل يقترب خطر من حده</text>
<line x1="32" y1="474" x2="1028" y2="474" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="1008.4" y="506" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يقيس</text>
<text x="681.8" y="506" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">محركات الخطر وسلامة الضوابط</text>
<text x="1010.1" y="538" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">الأفق</text>
<text x="701.9" y="538" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">متقدم، يتحرك قبل الخسارة</text>
<text x="1009.0" y="570" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">يملكه</text>
<text x="681.2" y="570" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مالك الخطر المسمى في السجل</text>
<text x="992.7" y="602" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">عند تحركه</text>
<text x="680.6" y="602" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يطلق إجراء متفقا عليه عند العتبة</text>
<rect x="8" y="656" width="1044" height="96" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="692" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">الرقم نفسه قد يكون الاثنين</text>
<text x="530" y="726" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">تأخر تسليم مورد واحد بنسبة 12 بالمئة، مؤشر أداء لإدارة المشتريات ومؤشر مخاطر للخدمة التي تتوقف بدونه</text>
<text x="530" y="812" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">العتبات والتصعيد، ما يحول الرقم إلى ضبط فعلي</text>
<text x="700" y="856" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">العتبة البرتقالية</text>
<line x1="700" y1="864" x2="700" y2="876" stroke="#C4571C" stroke-width="2.5"/>
<text x="354" y="856" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">العتبة الحمراء</text>
<line x1="354" y1="864" x2="354" y2="876" stroke="#C4571C" stroke-width="2.5"/>
<rect x="700" y="874" width="352" height="38" rx="19" fill="#FFFFFF" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="354" y="874" width="346" height="38" rx="19" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="8" y="874" width="346" height="38" rx="19" fill="#C4571C" stroke="#C4571C" stroke-width="1.5"/>
<text x="876" y="900" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">داخل الشهية</text>
<text x="527" y="900" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مراقبة وتصرف</text>
<text x="181" y="900" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#FFFFFF">تجاوز</text>
<line x1="530" y1="920" x2="530" y2="936" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,934 530,948 537,934" fill="#C4571C"/>
<rect x="8" y="960" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="956.9" y="1004" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">لا شيء يصعد</text>
<text x="75.7" y="1004" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">داخل الشهية</text>
<line x1="32" y1="1024" x2="1028" y2="1024" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="895.8" y="1056" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يراجعه المالك في الدورة الشهرية</text>
<text x="899.8" y="1082" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يسجل الاتجاه دون إجراء مطلوب</text>
<text x="877.4" y="1108" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يبقى على لوحة المتابعة لا في المحضر</text>
<rect x="8" y="1150" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="941.2" y="1194" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">تصرف ولا تنتظر</text>
<text x="84.1" y="1194" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">مراقبة وتصرف</text>
<line x1="32" y1="1214" x2="1028" y2="1214" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="857.8" y="1246" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يستجيب مالك الخطر خلال خمسة أيام عمل</text>
<text x="886.3" y="1272" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يسجل السبب والإجراء مقابل الخطر</text>
<text x="879.6" y="1298" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تراه لجنة المخاطر في اجتماعها التالي</text>
<rect x="8" y="1340" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="959.7" y="1384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">تجاوز الشهية</text>
<text x="51.0" y="1384" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">تجاوز</text>
<line x1="32" y1="1404" x2="1028" y2="1404" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="927.2" y="1436" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تبلغ اللجنة خلال 24 ساعة</text>
<text x="891.4" y="1462" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تعرض خطة معالجة بتواريخ وأسماء</text>
<text x="870.1" y="1488" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">وإن لم يفعل شيء يسجل القبول صراحة</text>
<text x="530" y="1560" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">العتبة بلا مالك مسمى وإجراء متفق عليه مجرد زينة · risk-place.org</text>
</svg>
