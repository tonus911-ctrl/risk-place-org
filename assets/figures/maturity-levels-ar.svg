<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1340" width="1060" height="1340" direction="rtl" role="img" aria-label="مستويات نضج المرونة الخمسة من المستوى الأولي إلى المتحسن باستمرار، مع وصف قصير لكل مستوى والدليل الذي ينبغي أن يراه المقيم">
<rect x="0" y="0" width="1060" height="1340" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">خمسة مستويات لنضج المرونة</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">كل مستوى يبلغ بإزالة اعتماد ما زال المستوى الذي تحته يتسامح معه</text>
<rect x="8" y="112" width="1044" height="180" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="162" r="25" fill="#C4571C"/>
<text x="1000" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="927.4" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">أولي</text>
<text x="112.6" y="154" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما ينبغي أن يراه المقيم</text>
<text x="785.1" y="184" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">يعتمد على من يكون في المناوبة ذلك اليوم</text>
<line x1="32" y1="204" x2="952" y2="204" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="711.2" y="236" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">لا سجل مخاطر ولا تحليل أثر، وخطط منسوخة من قالب جاهز</text>
<text x="711.8" y="262" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">التعافي لم يجرب من طرفه إلى طرفه ولا أحد يدعي أنه جرب</text>
<line x1="530" y1="298" x2="530" y2="312" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,310 530,324 537,310" fill="#C4571C"/>
<rect x="8" y="332" width="1044" height="180" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="382" r="25" fill="#C4571C"/>
<text x="1000" y="390" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="887.6" y="374" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">قابل للتكرار</text>
<text x="112.6" y="374" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما ينبغي أن يراه المقيم</text>
<text x="818.2" y="404" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">يعمل حين يؤديه الأشخاص أنفسهم</text>
<line x1="32" y1="424" x2="952" y2="424" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="737.0" y="456" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بعض الخدمات محللة وخطط موجودة للأعطال الواضحة</text>
<text x="774.5" y="482" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">التمارين تجرى وملاحظاتها لا تتابع حتى الإغلاق</text>
<line x1="530" y1="518" x2="530" y2="532" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,530 530,544 537,530" fill="#C4571C"/>
<rect x="8" y="552" width="1044" height="180" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="602" r="25" fill="#C4571C"/>
<text x="1000" y="610" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="924.6" y="594" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">محدد</text>
<text x="112.6" y="594" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما ينبغي أن يراه المقيم</text>
<text x="821.5" y="624" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">منظومة على الورق تطبق بتفاوت</text>
<line x1="32" y1="644" x2="952" y2="644" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="756.6" y="676" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">سياسة ومنهجية وتقويم تمارين معتمدة ومتبعة فعلا</text>
<text x="760.5" y="702" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الخط الثاني يتحدى لكن الأدلة ما زالت تجمع يدويا</text>
<line x1="530" y1="738" x2="530" y2="752" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,750 530,764 537,750" fill="#C4571C"/>
<rect x="8" y="772" width="1044" height="180" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="1000" cy="822" r="25" fill="#C4571C"/>
<text x="1000" y="830" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="885.4" y="814" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">مدار ومقاس</text>
<text x="154.6" y="814" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#C4571C">الوجهة المناسبة لمعظم المؤسسات</text>
<text x="796.3" y="844" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">الأرقام تصدق لأنها اختبرت لا لأنها أعلنت</text>
<line x1="32" y1="864" x2="952" y2="864" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="746.5" y="896" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">التعافي مثبت ضمن الهدف بتمرين لا بادعاء في وثيقة</text>
<text x="732.5" y="922" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">رأي مستقل من الخط الثالث وملاحظات مؤرخة لها ملاك</text>
<line x1="530" y1="958" x2="530" y2="972" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,970 530,984 537,970" fill="#C4571C"/>
<rect x="8" y="992" width="1044" height="180" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="1000" cy="1042" r="25" fill="#C4571C"/>
<text x="1000" y="1050" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="860.2" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">متحسن باستمرار</text>
<text x="112.6" y="1034" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#A34D19">ما ينبغي أن يراه المقيم</text>
<text x="821.5" y="1064" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">يغير العمل نفسه لا الأوراق وحدها</text>
<line x1="32" y1="1084" x2="952" y2="1084" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="724.6" y="1116" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">بيانات التعطل تغذي قرارات الهندسة والموردين والاستثمار</text>
<text x="740.3" y="1142" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">المجلس يرى الاتجاه والكلفة وتتحرك الشهية مع الدليل</text>
<text x="530" y="1232" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">حددوا الهدف لكل خدمة لا للشركة كلها، فالمستوى الخامس يكلف أكثر مما يعيد</text>
<text x="530" y="1264" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">ما لم يكن التعطل خطركم التجاري الأساسي</text>
<text x="530" y="1306" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">المستوى المدعى في تقييم ذاتي والمستوى المثبت في تدقيق رقمان مختلفان · risk-place.org</text>
</svg>
