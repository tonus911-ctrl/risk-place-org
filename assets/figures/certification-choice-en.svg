<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1118" width="1060" height="1118" role="img" aria-label="Choosing a certification in business continuity: a qualification held by a person versus a certificate held by an organisation, then five tests — depth, assessment, artefacts, recognition, verifiability">
<rect x="0" y="0" width="1060" height="1118" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Choosing a certification in business continuity</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">One word, two products. Decide which you need, then test the programme the same way.</text>

<!-- panel: the person -->
<rect x="8" y="112" width="508" height="266" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="148" font-family="Consolas, monospace" font-size="14" letter-spacing="1.4" fill="#A34D19">CERTIFIES A PERSON</text>
<text x="32" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#16181F">A qualification you carry</text>
<text x="32" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">Issued to a named individual by a professional</text>
<text x="32" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">institute, a scheme owner or a training provider.</text>
<text x="32" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">Proves a syllabus was covered and an exam passed.</text>
<text x="32" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">Sometimes years of practice are verified too.</text>
<line x1="32" y1="330" x2="492" y2="330" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="358" font-family="Consolas, monospace" font-size="14.5" fill="#5B564A">IT DOES NOT PROVE YOUR PLANS WORK</text>

<!-- panel: the organisation -->
<rect x="544" y="112" width="508" height="266" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="568" y="148" font-family="Consolas, monospace" font-size="14" letter-spacing="1.4" fill="#A34D19">CERTIFIES AN ORGANISATION</text>
<text x="568" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#16181F">A certificate the company holds</text>
<text x="568" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">Issued to a legal entity after an audit by a</text>
<text x="568" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">certification body, for a defined scope and period.</text>
<text x="568" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">Proves the management system was examined</text>
<text x="568" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#3F3B33">against a standard, and is re-checked later.</text>
<line x1="568" y1="330" x2="1028" y2="330" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="568" y="358" font-family="Consolas, monospace" font-size="14.5" fill="#5B564A">IT DOES NOT PROVE ANY PERSON IS COMPETENT</text>

<!-- arrows down into the test band -->
<line x1="262" y1="390" x2="262" y2="414" stroke="#C4571C" stroke-width="2.5"/><polygon points="255,412 262,426 269,412" fill="#C4571C"/>
<line x1="798" y1="390" x2="798" y2="414" stroke="#C4571C" stroke-width="2.5"/><polygon points="791,412 798,426 805,412" fill="#C4571C"/>

<text x="530" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#16181F">Whichever you need, put the programme through the same five tests</text>

<!-- test 1 -->
<rect x="8" y="486" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="540" r="25" fill="#C4571C"/>
<text x="60" y="548" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="108" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Depth</text>
<text x="108" y="564" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Contact hours, and the work you do between the sessions.</text>
<text x="1028" y="564" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">flag: 1-day certificate</text>

<!-- test 2 -->
<rect x="8" y="606" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="660" r="25" fill="#C4571C"/>
<text x="60" y="668" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="108" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Assessment</text>
<text x="108" y="684" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A threshold you can miss, and a person who marks what you produced.</text>
<text x="1028" y="684" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">flag: nobody ever fails</text>

<!-- test 3 -->
<rect x="8" y="726" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="780" r="25" fill="#C4571C"/>
<text x="60" y="788" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="108" y="770" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Artefacts</text>
<text x="108" y="804" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">What leaves the room, built on your own scope, not on a case study.</text>
<text x="1028" y="804" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">flag: slides only</text>

<!-- test 4 -->
<rect x="8" y="846" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="900" r="25" fill="#C4571C"/>
<text x="60" y="908" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="890" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Recognition</text>
<text x="108" y="924" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Who accepts it. Ask for employers and tenders by name, not adjectives.</text>
<text x="1028" y="924" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">flag: vague claims</text>

<!-- test 5 -->
<rect x="8" y="966" width="1044" height="108" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<circle cx="60" cy="1020" r="25" fill="#C4571C"/>
<text x="60" y="1028" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="108" y="1010" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Verifiable</text>
<text x="108" y="1044" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A unique number, a public check, and a rule for renewal or expiry.</text>
<text x="1028" y="1044" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#A34D19">flag: no way to check</text>

<text x="530" y="1102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Fail two of the five and what you are buying is a document with a border, not a qualification</text>
</svg>
