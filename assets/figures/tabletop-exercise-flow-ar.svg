<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1396" width="1060" height="1396" direction="rtl" role="img" aria-label="مراحل التمرين النظري الثلاث، الإعداد قبل اليوم وإدارة القاعة في اليوم وإغلاق الملاحظات بعده">
<rect x="0" y="0" width="1060" height="1396" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">التمرين النظري، من التصميم إلى إغلاق الملاحظات</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">الإعداد يقرر ما يستطيع التمرين أن يجده، والقاعة تقرر بأي صدق،</text>
<text x="530" y="108" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">والمراجعة تقرر ما الذي يتغير</text>
<rect x="8" y="138" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="876" y="156" width="152" height="32" rx="16" fill="#C4571C"/>
<text x="952" y="179" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#FFFFFF">قبل التمرين</text>
<text x="765.8" y="180" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">تصميم السيناريو</text>
<line x1="32" y1="202" x2="1028" y2="202" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="893.6" y="232" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أسوأ يوم واقعي لا أسوأ يوم ممكن</text>
<text x="849.9" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">خط زمني من 6 إلى 10 مداخلات على فترات</text>
<text x="905.4" y="284" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">قيود مكتوبة بصدق ومنها الغياب</text>
<text x="888.6" y="310" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مفتاح إجابة مأخوذ من الخطة نفسها</text>
<line x1="530" y1="344" x2="530" y2="358" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,356 530,370 537,356" fill="#C4571C"/>
<rect x="8" y="378" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<rect x="876" y="396" width="152" height="32" rx="16" fill="#C4571C"/>
<text x="952" y="419" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#FFFFFF">يوم التمرين</text>
<text x="789.3" y="420" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">إدارة القاعة</text>
<line x1="32" y1="442" x2="1028" y2="442" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="893.0" y="472" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">أصحاب القرار أنفسهم لا مندوبوهم</text>
<text x="874.6" y="498" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">من ساعتين إلى ثلاث والساعة لا تتوقف</text>
<text x="923.3" y="524" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">الميسر يسأل ولا يجيب أبدا</text>
<text x="856.6" y="550" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">مدون يسجل التوقيتات والقرارات والخلافات</text>
<line x1="530" y1="584" x2="530" y2="598" stroke="#C4571C" stroke-width="2.5"/><polygon points="523,596 530,610 537,596" fill="#C4571C"/>
<rect x="8" y="618" width="1044" height="200" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="876" y="636" width="152" height="32" rx="16" fill="#C4571C"/>
<text x="952" y="659" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#FFFFFF">بعد التمرين</text>
<text x="763.0" y="660" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">إغلاق الملاحظات</text>
<line x1="32" y1="682" x2="1028" y2="682" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="873.4" y="712" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تقرير من صفحتين إلى أربع خلال أسبوع</text>
<text x="914.9" y="738" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">إغلاق أهم ثلاث ملاحظات أولا</text>
<text x="903.1" y="764" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تعديل الخطة حيث انكسرت فعلا</text>
<text x="885.2" y="790" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">حفظ الأدلة، وهي ما يطلبه المدققون</text>
<rect x="8" y="858" width="1044" height="80" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="906" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">كل نقاش متوقف هو نفسه ملاحظة، لا أحد يملك هذا القرار، سجلوه وتقدموا</text>
<text x="530" y="986" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">ثلاثة أشياء لا تستطيع الوثيقة اختبارها</text>
<rect x="8" y="1012" width="1044" height="84" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="982.6" y="1064" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الصلاحية</text>
<text x="121.6" y="1064" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">هل يعرف صاحبها حدها</text>
<rect x="8" y="1112" width="1044" height="84" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="973.7" y="1164" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">التسليمات</text>
<text x="120.5" y="1164" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">هل يستلمها التالي فعلا</text>
<rect x="8" y="1212" width="1044" height="84" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="949.0" y="1264" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">الحلول المؤقتة</text>
<text x="116.0" y="1264" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">هل توجد خارج الورقة</text>
<text x="530" y="1356" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">التمرين الذي ينتهي بلا مشكلات كبرى لم يختبر شيئا · risk-place.org</text>
</svg>
