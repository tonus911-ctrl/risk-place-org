<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-label="From first chapter to a verified certificate">
<rect x="0" y="0" width="1060" height="470" fill="#FDFBF7"/>
<text x="30" y="46" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">From first chapter to a verified certificate</text>
<text x="30" y="78" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">Start any day, move at your own pace. Every step is assessed, and the result can be checked by anyone.</text>
<line x1="132" y1="150" x2="928" y2="150" stroke="#E1DCD3" stroke-width="3"/>
<circle cx="132" cy="150" r="27" fill="#C4571C"/>
<text x="132" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#FFFFFF">01</text>
<text x="132" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Read and answer</text>
<text x="132" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">94 chapters in six modules</text>
<text x="132" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#A34D19">24 checkpoint blocks</text>
<circle cx="331" cy="150" r="27" fill="#C4571C"/>
<text x="331" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#FFFFFF">02</text>
<text x="331" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Pass the module tests</text>
<text x="331" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Six tests, 8 questions</text>
<text x="331" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">each</text>
<text x="331" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#A34D19">Pass mark 6 of 8</text>
<circle cx="530" cy="150" r="27" fill="#C4571C"/>
<text x="530" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#FFFFFF">03</text>
<text x="530" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Build the capstone</text>
<text x="530" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">A resilience report on your</text>
<text x="530" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">own organisation</text>
<text x="530" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#A34D19">Not a case study</text>
<circle cx="729" cy="150" r="27" fill="#C4571C"/>
<text x="729" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#FFFFFF">04</text>
<text x="729" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Defend it live</text>
<text x="729" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Before the examiner, in</text>
<text x="729" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Arabic or English</text>
<text x="729" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#A34D19">The credential is earned</text>
<circle cx="928" cy="150" r="27" fill="#C4571C"/>
<text x="928" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#FFFFFF">05</text>
<text x="928" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16181F">Get the certificate</text>
<text x="928" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">Numbered, entered in the</text>
<text x="928" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">public register</text>
<text x="928" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#A34D19">QR check in ten seconds</text>
<rect x="30" y="336" width="672" height="106" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="726" y="336" width="304" height="106" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="54" y="368" text-anchor="start" font-family="Consolas, monospace" font-size="14" letter-spacing="1.3" fill="#A34D19">WHAT STAYS IN YOUR HANDS</text>
<text x="54" y="394" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#3F3B33">Six working documents — governance policy, governance map, continuity</text>
<text x="54" y="415" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#3F3B33">plan, crisis plan and exercise scenario, compliance matrix against NCEMA</text>
<text x="54" y="436" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#3F3B33">7000 and ISO 22301, dashboard and board report.</text>
<text x="750" y="368" text-anchor="start" font-family="Consolas, monospace" font-size="14" letter-spacing="1.3" fill="#A34D19">VALID THREE YEARS</text>
<text x="750" y="394" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#3F3B33">Renewal through evidence of</text>
<text x="750" y="415" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#3F3B33">practice and professional</text>
<text x="750" y="436" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#3F3B33">development.</text>
</svg>