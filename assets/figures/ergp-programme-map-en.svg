<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1276" width="1060" height="1276" role="img" aria-label="The ERGP programme map: six modules, 94 chapters, the artefact each module leaves in your hands, then the capstone and the numbered certificate in a public register">
