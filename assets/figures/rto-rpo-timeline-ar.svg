<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" direction="rtl" role="img" aria-label="شكل زمني حول لحظة التعطل يبين نقطة RPO قبلها وهدف RTO بعدها، وفوقهما الحد الأقصى المقبول للتعطل">
<rect x="0" y="0" width="1200" height="660" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="27" fill="#16181F">هدفان وشكل زمني واحد ولحظة تعطل واحدة</text>
<text x="600" y="82" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15.5" fill="#5B564A">RPO ينظر إلى الوراء ويقاس بالبيانات، وRTO ينظر إلى الأمام ويقاس بالوقت</text>
<line x1="1130" y1="300" x2="74" y2="300" stroke="#E1DCD3" stroke-width="2"/>
<polygon points="74,293 60,300 74,307" fill="#E1DCD3"/>
<line x1="600" y1="168" x2="600" y2="326" stroke="#C4571C" stroke-width="2.5"/>
<rect x="430" y="118" width="340" height="52" rx="10" fill="#C4571C" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="140" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="16" fill="#FFFFFF">لحظة التعطل</text>
<text x="600" y="160" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12" fill="#FFFFFF">الاكتشاف يبدأ كل الساعات</text>
<circle cx="870" cy="300" r="9" fill="#C4571C"/>
<text x="870" y="222" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">آخر نسخة سليمة</text>
<text x="870" y="244" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">وكل ما بعدها مفقود</text>
<line x1="870" y1="252" x2="870" y2="288" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="270" cy="300" r="9" fill="#C4571C"/>
<text x="270" y="222" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#16181F">عودة الخدمة للعمل</text>
<text x="270" y="244" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">بالحد الأدنى المتفق عليه</text>
<line x1="270" y1="252" x2="270" y2="288" stroke="#E1DCD3" stroke-width="1.5"/>
<line x1="100" y1="252" x2="100" y2="288" stroke="#8A8578" stroke-width="1.5"/>
<text x="100" y="222" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">MTPD الحد الأعلى</text>
<text x="100" y="244" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="11.5" fill="#8A8578">ويوضع RTO تحته بهامش</text>
<rect x="600" y="322" width="270" height="40" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="735" y="347" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#16181F">RPO، كم من البيانات تحتملون خسارته</text>
<rect x="270" y="322" width="330" height="40" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="435" y="347" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13" fill="#16181F">RTO، كم يحتمل النشاط أن يبقى متوقفا</text>
<rect x="640" y="400" width="520" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="900" y="432" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#16181F">RPO يشترى بتواتر النسخ</text>
<line x1="1120" y1="448" x2="680" y2="448" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="900" y="476" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">تحدده فترات النسخ والتماثل</text>
<text x="900" y="500" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">النسخ الليلي وحده لا يجعله 24 ساعة</text>
<text x="900" y="524" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">استعادة فاشلة تحوله إلى ما لا نهاية</text>
<rect x="40" y="400" width="520" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="300" y="432" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#16181F">RTO يشترى بالقدرة والتدريب</text>
<line x1="520" y1="448" x2="80" y2="448" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="300" y="476" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">تحدده القدرة والإجراء والناس</text>
<text x="300" y="500" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">يقاس على أطول مسار في الاعتماديات</text>
<text x="300" y="524" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#5B564A">وبلا قياس على الساعة يبقى أمنية</text>
<rect x="40" y="566" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="594" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="13.5" fill="#16181F">الرواتب، RTO أربع وعشرون ساعة وRPO ساعة واحدة، تعود الدورة خلال يوم وينقص على الأكثر آخر ساعة من المدخلات</text>
<text x="600" y="640" text-anchor="middle" direction="rtl" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="12.5" fill="#8A8578">لكل نشاط رقماه الخاصان، مأخوذان من منحنى الأثر · risk-place.org</text>
</svg>
