<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 990" width="1060" height="990" direction="rtl" role="img" aria-label="شكل زمني حول لحظة التعطل يبين نقطة RPO قبلها وهدف RTO بعدها، وفوقهما الحد الأقصى المقبول للتعطل">
<rect x="0" y="0" width="1060" height="990" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="28" fill="#16181F">هدفان وشكل زمني واحد ولحظة تعطل واحدة</text>
<text x="530" y="82" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="18" fill="#5B564A">RPO ينظر إلى الوراء ويقاس بالبيانات، وRTO ينظر إلى الأمام ويقاس بالوقت</text>
<text x="106.5" y="180" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#5B564A">MTPD الحد الأعلى</text>
<text x="118.2" y="204" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">ويوضع RTO تحته بهامش</text>
<line x1="60" y1="214" x2="60" y2="298" stroke="#5B564A" stroke-width="1.5"/>
<rect x="390" y="126" width="340" height="60" rx="10" fill="#C4571C" stroke="#C4571C" stroke-width="1.5"/>
<text x="560" y="152" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#FFFFFF">لحظة التعطل</text>
<text x="560" y="176" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#FFFFFF">الاكتشاف يبدأ كل الساعات</text>
<line x1="560" y1="186" x2="560" y2="336" stroke="#C4571C" stroke-width="2.5"/>
<text x="910" y="236" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">آخر نسخة سليمة</text>
<text x="910" y="260" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">وكل ما بعدها مفقود</text>
<line x1="910" y1="270" x2="910" y2="298" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="160" y="236" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">عودة الخدمة للعمل</text>
<text x="160" y="260" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">بالحد الأدنى المتفق عليه</text>
<line x1="160" y1="270" x2="160" y2="298" stroke="#D6D0C4" stroke-width="1.5"/>
<line x1="1020" y1="310" x2="40" y2="310" stroke="#E1DCD3" stroke-width="2.5"/>
<polygon points="40,301 16,310 40,319" fill="#E1DCD3"/>
<circle cx="910" cy="310" r="9" fill="#C4571C"/>
<circle cx="160" cy="310" r="9" fill="#C4571C"/>
<rect x="560" y="336" width="350" height="48" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="735" y="366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">RPO، كم من البيانات تحتملون خسارته</text>
<rect x="160" y="336" width="400" height="48" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="360" y="366" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">RTO، كم يحتمل النشاط أن يبقى متوقفا</text>
<rect x="8" y="430" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="893.0" y="474" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">RPO يشترى بتواتر النسخ</text>
<line x1="32" y1="494" x2="1028" y2="494" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="917.1" y="526" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تحدده فترات النسخ والتماثل</text>
<text x="883.0" y="552" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">النسخ الليلي وحده لا يجعله 24 ساعة</text>
<text x="889.7" y="578" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">استعادة فاشلة تحوله إلى ما لا نهاية</text>
<rect x="8" y="620" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="869.0" y="664" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="23" fill="#16181F">RTO يشترى بالقدرة والتدريب</text>
<line x1="32" y1="684" x2="1028" y2="684" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="912.1" y="716" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">تحدده القدرة والإجراء والناس</text>
<text x="874.6" y="742" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">يقاس على أطول مسار في الاعتماديات</text>
<text x="896.4" y="768" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#3F3B33">وبلا قياس على الساعة يبقى أمنية</text>
<rect x="8" y="830" width="1044" height="80" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="878" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="17" fill="#16181F">الرواتب، RTO أربع وعشرون ساعة وRPO ساعة واحدة، تعود الدورة خلال يوم وينقص على الأكثر آخر ساعة من المدخلات</text>
<text x="530" y="954" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,serif" font-size="15" fill="#5B564A">لكل نشاط رقماه الخاصان، مأخوذان من منحنى الأثر · risk-place.org</text>
</svg>
