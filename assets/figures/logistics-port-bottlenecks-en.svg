<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1394" width="1060" height="1394" role="img" aria-label="The logistics delivery chain, its four bottlenecks, what opens each of them and the commitment clock">
<rect x="0" y="0" width="1060" height="1394" rx="0" fill="#FDFBF7"/>

<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Where the delivery chain chokes, and what opens it</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">The sector loses access, not assets — a corridor, a system or a permit is missing</text>

<rect x="8" y="112" width="1044" height="88" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="156" r="25" fill="#C4571C"/>
<text x="60" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">1</text>
<text x="108" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Origin or plant</text>

<polygon points="53,206 67,206 60,218" fill="#C4571C"/>

<rect x="8" y="226" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="302" r="25" fill="#C4571C"/>
<text x="60" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">2</text>
<text x="108" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Road haulage</text>
<text x="108" y="314" font-family="Consolas, monospace" font-size="15" fill="#A34D19">BOTTLENECK</text>
<text x="290" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Area closure or a road corridor shut</text>
<text x="108" y="350" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT OPENS IT</text>
<text x="290" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A priced road alternate and a written trigger</text>

<polygon points="53,384 67,384 60,396" fill="#C4571C"/>

<rect x="8" y="404" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="480" r="25" fill="#C4571C"/>
<text x="60" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">3</text>
<text x="108" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Port or airport</text>
<text x="108" y="492" font-family="Consolas, monospace" font-size="15" fill="#A34D19">BOTTLENECK</text>
<text x="290" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Port congestion or airspace closure</text>
<text x="108" y="528" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT OPENS IT</text>
<text x="290" y="528" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A second gateway under contract, not intent</text>

<polygon points="53,562 67,562 60,574" fill="#C4571C"/>

<rect x="8" y="582" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="658" r="25" fill="#C4571C"/>
<text x="60" y="666" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">4</text>
<text x="108" y="630" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Customs clearance</text>
<text x="108" y="670" font-family="Consolas, monospace" font-size="15" fill="#A34D19">BOTTLENECK</text>
<text x="290" y="670" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Systems down and customs platforms</text>
<text x="108" y="706" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT OPENS IT</text>
<text x="290" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Degraded mode on paper and an offline data copy</text>

<polygon points="53,740 67,740 60,752" fill="#C4571C"/>

<rect x="8" y="760" width="1044" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="836" r="25" fill="#C4571C"/>
<text x="60" y="844" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">5</text>
<text x="108" y="808" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Warehouse</text>
<text x="108" y="848" font-family="Consolas, monospace" font-size="15" fill="#A34D19">BOTTLENECK</text>
<text x="290" y="848" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Partner failure, carrier, broker, operator</text>
<text x="108" y="884" font-family="Consolas, monospace" font-size="15" fill="#A34D19">WHAT OPENS IT</text>
<text x="290" y="884" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A qualified second partner with the contract ready</text>

<polygon points="53,918 67,918 60,930" fill="#C4571C"/>

<rect x="8" y="938" width="1044" height="88" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="60" cy="982" r="25" fill="#C4571C"/>
<text x="60" y="990" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#FFFFFF">6</text>
<text x="108" y="992" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">Delivery to client</text>

<rect x="8" y="1058" width="1044" height="272" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<rect x="9" y="1072" width="5" height="244" rx="2.5" fill="#C4571C"/>
<text x="530" y="1098" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#C4571C">The commitment clock — what breaks and when</text>
<rect x="36" y="1124" width="210" height="46" rx="8" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="141" y="1153" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#C4571C">After 12 hours</text>
<text x="278" y="1153" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">cold chain and express freight</text>
<rect x="36" y="1186" width="210" height="46" rx="8" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="141" y="1215" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#C4571C">After 24 hours</text>
<text x="278" y="1215" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">project cargo carrying penalties</text>
<rect x="36" y="1248" width="210" height="46" rx="8" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="141" y="1277" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#C4571C">After 72 hours</text>
<text x="278" y="1277" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">the whole flow is re-priced and re-routed</text>

<text x="530" y="1366" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Source — continuity for logistics and ports · risk-place.org</text>
</svg>
