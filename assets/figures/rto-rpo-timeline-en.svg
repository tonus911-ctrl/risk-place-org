<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="A time axis around the moment of disruption showing the recovery point objective before it and the recovery time objective after it, with the maximum tolerable period as the ceiling">
<rect x="0" y="0" width="1200" height="660" fill="#FDFBF7"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181F">Two objectives, one axis, one moment of disruption</text>
<text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#5B564A">RPO looks backwards and is measured in data. RTO looks forwards and is measured in time.</text>
<line x1="70" y1="300" x2="1126" y2="300" stroke="#E1DCD3" stroke-width="2"/>
<polygon points="1126,293 1140,300 1126,307" fill="#E1DCD3"/>
<line x1="600" y1="168" x2="600" y2="326" stroke="#C4571C" stroke-width="2.5"/>
<rect x="430" y="118" width="340" height="52" rx="10" fill="#C4571C" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#FFFFFF">The disruption</text>
<text x="600" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#FFFFFF">detection starts every clock</text>
<circle cx="330" cy="300" r="9" fill="#C4571C"/>
<text x="330" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#16181F">Last good copy</text>
<text x="330" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8A8578">everything after it is lost</text>
<line x1="330" y1="252" x2="330" y2="288" stroke="#E1DCD3" stroke-width="1.5"/>
<circle cx="930" cy="300" r="9" fill="#C4571C"/>
<text x="930" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#16181F">Service usable again</text>
<text x="930" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8A8578">at the agreed minimum</text>
<line x1="930" y1="252" x2="930" y2="288" stroke="#E1DCD3" stroke-width="1.5"/>
<line x1="1100" y1="252" x2="1100" y2="288" stroke="#8A8578" stroke-width="1.5"/>
<text x="1100" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">MTPD, the ceiling</text>
<text x="1100" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#8A8578">RTO sits below it</text>
<rect x="330" y="322" width="270" height="40" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="465" y="347" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#16181F">RPO · data you can afford to lose</text>
<rect x="600" y="322" width="330" height="40" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="1.5"/>
<text x="765" y="347" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#16181F">RTO · how long the activity may stay down</text>
<rect x="40" y="400" width="520" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="300" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#16181F">RPO is bought with backup frequency</text>
<line x1="80" y1="448" x2="520" y2="448" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="300" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Replication and backup intervals set it</text>
<text x="300" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Nightly backups do not make it 24 hours</text>
<text x="300" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">A failed restore turns it into infinity</text>
<rect x="640" y="400" width="520" height="152" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="900" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#16181F">RTO is bought with capacity and drill</text>
<line x1="680" y1="448" x2="1120" y2="448" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="900" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Capacity, procedure and people set it</text>
<text x="900" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">It runs along the longest dependency path</text>
<text x="900" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5B564A">Untimed, it is a wish and not an objective</text>
<rect x="40" y="566" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="1.5"/>
<text x="600" y="594" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#16181F">Payroll · RTO 24 hours · RPO 1 hour — the run is back within a day, and at most the last hour of entries is missing</text>
<text x="600" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8A8578">Each activity earns its own two numbers, from the impact curve · risk-place.org</text>
</svg>
