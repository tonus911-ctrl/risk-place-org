<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 990" width="1060" height="990" role="img" aria-label="A time axis around the moment of disruption showing the recovery point objective before it and the recovery time objective after it, with the maximum tolerable period as the ceiling">
<rect x="0" y="0" width="1060" height="990" fill="#FDFBF7"/>
<text x="530" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16181F">Two objectives, one axis, one moment of disruption</text>
<text x="530" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5B564A">RPO looks backwards and is measured in data. RTO looks forwards and is measured in time.</text>
<text x="1044" y="180" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#5B564A">MTPD, the ceiling</text>
<text x="1044" y="204" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">RTO sits below it</text>
<line x1="1000" y1="214" x2="1000" y2="298" stroke="#5B564A" stroke-width="1.5"/>
<rect x="330" y="126" width="340" height="60" rx="10" fill="#C4571C" stroke="#C4571C" stroke-width="1.5"/>
<text x="500" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#FFFFFF">The disruption</text>
<text x="500" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#FFFFFF">detection starts every clock</text>
<line x1="500" y1="186" x2="500" y2="336" stroke="#C4571C" stroke-width="2.5"/>
<text x="150" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Last good copy</text>
<text x="150" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">everything after it is lost</text>
<line x1="150" y1="270" x2="150" y2="298" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="900" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Service usable again</text>
<text x="900" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5B564A">at the agreed minimum</text>
<line x1="900" y1="270" x2="900" y2="298" stroke="#D6D0C4" stroke-width="1.5"/>
<line x1="40" y1="310" x2="1020" y2="310" stroke="#E1DCD3" stroke-width="2.5"/>
<polygon points="1020,301 1044,310 1020,319" fill="#E1DCD3"/>
<circle cx="150" cy="310" r="9" fill="#C4571C"/>
<circle cx="900" cy="310" r="9" fill="#C4571C"/>
<rect x="150" y="336" width="350" height="48" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="325" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">RPO · data you can afford to lose</text>
<rect x="500" y="336" width="400" height="48" rx="10" fill="#F1EEE8" stroke="#C4571C" stroke-width="2"/>
<text x="700" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">RTO · how long the activity may stay down</text>
<rect x="8" y="430" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="474" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">RPO is bought with backup frequency</text>
<line x1="32" y1="494" x2="1028" y2="494" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Replication and backup intervals set it</text>
<text x="32" y="552" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Nightly backups do not make it 24 hours</text>
<text x="32" y="578" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">A failed restore turns it into infinity</text>
<rect x="8" y="620" width="1044" height="170" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="32" y="664" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#16181F">RTO is bought with capacity and drill</text>
<line x1="32" y1="684" x2="1028" y2="684" stroke="#D6D0C4" stroke-width="1.5"/>
<text x="32" y="716" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Capacity, procedure and people set it</text>
<text x="32" y="742" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">It runs along the longest dependency path</text>
<text x="32" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3F3B33">Untimed, it is a wish and not an objective</text>
<rect x="8" y="830" width="1044" height="80" rx="10" fill="#FFFFFF" stroke="#C4571C" stroke-width="2"/>
<text x="530" y="878" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16181F">Payroll · RTO 24 hours · RPO 1 hour — the run is back within a day, and at most the last hour of entries is missing</text>
<text x="530" y="954" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5B564A">Each activity earns its own two numbers, from the impact curve · risk-place.org</text>
</svg>
