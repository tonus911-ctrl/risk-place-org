<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-label="من الفصل الأول إلى شهادة يمكن التحقق منها" direction="rtl">
<rect x="0" y="0" width="1060" height="470" fill="#FDFBF7"/>
<text x="1030" y="46" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="27" fill="#16181F">من الفصل الأول إلى شهادة يمكن التحقق منها</text>
<text x="1030" y="78" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="17" fill="#5B564A">ابدأوا في أي يوم وتقدموا بوتيرتكم. كل خطوة تقيم، والنتيجة يمكن لأي شخص التحقق منها.</text>
<line x1="132" y1="150" x2="928" y2="150" stroke="#E1DCD3" stroke-width="3"/>
<circle cx="928" cy="150" r="27" fill="#C4571C"/>
<text x="928" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#FFFFFF">01</text>
<text x="928" y="212" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#16181F">اقرأوا وأجيبوا</text>
<text x="928" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">٩٤ فصلاً في ستة مسارات</text>
<text x="928" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" fill="#A34D19">٢٤ مجموعة أسئلة تحقق</text>
<circle cx="729" cy="150" r="27" fill="#C4571C"/>
<text x="729" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#FFFFFF">02</text>
<text x="729" y="212" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#16181F">اجتازوا اختبارات المسارات</text>
<text x="729" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">ستة اختبارات، ثمانية</text>
<text x="729" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">أسئلة لكل منها</text>
<text x="729" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" fill="#A34D19">النجاح ٦ من ٨</text>
<circle cx="530" cy="150" r="27" fill="#C4571C"/>
<text x="530" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#FFFFFF">03</text>
<text x="530" y="212" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#16181F">أنجزوا المشروع الختامي</text>
<text x="530" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">تقرير مرونة عن</text>
<text x="530" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">منظمتكم أنتم</text>
<text x="530" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" fill="#A34D19">وليس حالة دراسية</text>
<circle cx="331" cy="150" r="27" fill="#C4571C"/>
<text x="331" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#FFFFFF">04</text>
<text x="331" y="212" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#16181F">ادافعوا عنه مباشرة</text>
<text x="331" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">أمام الممتحن، بالعربية</text>
<text x="331" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">أو الإنجليزية</text>
<text x="331" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" fill="#A34D19">الشهادة تكتسب</text>
<circle cx="132" cy="150" r="27" fill="#C4571C"/>
<text x="132" y="158" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#FFFFFF">05</text>
<text x="132" y="212" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="19" fill="#16181F">احصلوا على الشهادة</text>
<text x="132" y="238" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">مرقمة ومدرجة في</text>
<text x="132" y="258" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#5B564A">السجل العام</text>
<text x="132" y="282" text-anchor="middle" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" fill="#A34D19">تحقق بالرمز في عشر ثوان</text>
<rect x="358" y="336" width="672" height="106" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<rect x="30" y="336" width="304" height="106" rx="10" fill="#F1EEE8" stroke="#E1DCD3" stroke-width="1.5"/>
<text x="1030" y="368" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" letter-spacing="0" fill="#A34D19">ما يبقى بين أيديكم</text>
<text x="1006" y="394" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#3F3B33">ستة مستندات عمل، سياسة الحوكمة وخريطتها، خطة الاستمرارية، خطة</text>
<text x="1006" y="415" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#3F3B33">الأزمة وسيناريو التمرين، مصفوفة المطابقة مع NCEMA 7000 وISO</text>
<text x="1006" y="436" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#3F3B33">22301، لوحة المؤشرات وتقرير المجلس.</text>
<text x="310" y="368" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="14" letter-spacing="0" fill="#A34D19">صالحة ثلاث سنوات</text>
<text x="310" y="394" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#3F3B33">التجديد بإثبات الممارسة والتطوير</text>
<text x="310" y="415" text-anchor="end" font-family="'Noto Naskh Arabic', Georgia, serif" font-size="15.5" fill="#3F3B33">المهني.</text>
</svg>